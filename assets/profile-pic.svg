<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#060608"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0"/>
    </radialGradient>
    <filter id="textshadow">
      <feDropShadow dx="0" dy="1" stdDeviation="3" flood-color="#000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Square background -->
  <rect width="400" height="400" fill="url(#bg)"/>

  <!-- Glow -->
  <rect width="400" height="400" fill="url(#glow)"/>

  <!-- Outer border -->
  <rect x="8" y="8" width="384" height="384" rx="18" fill="none" stroke="#10b981" stroke-width="2.5" opacity="0.4"/>

  <!-- Inner border accent -->
  <rect x="16" y="16" width="368" height="368" rx="12" fill="none" stroke="#f59e0b" stroke-width="1" opacity="0.18"/>

  <!-- Top green accent bar -->
  <rect x="40" y="40" width="320" height="3" rx="1.5" fill="#10b981" opacity="0.5"/>

  <!-- "THE BET" main text -->
  <text x="200" y="196"
        font-family="'Arial Black', 'Helvetica Neue', Arial, sans-serif"
        font-weight="900"
        font-size="68"
        letter-spacing="2"
        text-anchor="middle"
        fill="#ffffff"
        filter="url(#textshadow)">THE BET</text>

  <!-- Gold divider line -->
  <rect x="60" y="212" width="280" height="2.5" rx="1.5" fill="#f59e0b" opacity="0.8"/>

  <!-- "CFB PICKS" subtitle -->
  <text x="200" y="248"
        font-family="'Arial', Helvetica, sans-serif"
        font-weight="700"
        font-size="23"
        letter-spacing="6"
        text-anchor="middle"
        fill="#10b981"
        opacity="0.95">CFB PICKS</text>

  <!-- Bottom green accent bar -->
  <rect x="40" y="357" width="320" height="3" rx="1.5" fill="#10b981" opacity="0.5"/>

  <!-- Corner dots -->
  <circle cx="40"  cy="40"  r="4" fill="#10b981" opacity="0.4"/>
  <circle cx="360" cy="40"  r="4" fill="#10b981" opacity="0.4"/>
  <circle cx="40"  cy="360" r="4" fill="#10b981" opacity="0.4"/>
  <circle cx="360" cy="360" r="4" fill="#10b981" opacity="0.4"/>
</svg>
