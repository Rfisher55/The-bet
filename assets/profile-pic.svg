<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#060608"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="2" stdDeviation="6" flood-color="#10b981" flood-opacity="0.5"/>
    </filter>
    <filter id="textshadow">
      <feDropShadow dx="0" dy="1" stdDeviation="3" flood-color="#000" flood-opacity="0.6"/>
    </filter>
    <clipPath id="circle">
      <circle cx="200" cy="200" r="200"/>
    </clipPath>
  </defs>

  <!-- Background circle -->
  <circle cx="200" cy="200" r="200" fill="url(#bg)"/>

  <!-- Subtle glow center -->
  <circle cx="200" cy="185" r="200" fill="url(#glow)"/>

  <!-- Outer ring -->
  <circle cx="200" cy="200" r="188" fill="none" stroke="#10b981" stroke-width="2.5" opacity="0.35"/>

  <!-- Inner ring accent -->
  <circle cx="200" cy="200" r="178" fill="none" stroke="#f59e0b" stroke-width="1" opacity="0.15"/>

  <!-- Dollar sign icon (top) -->
  <g transform="translate(200,95)" filter="url(#shadow)">
    <!-- Vertical bar of $ -->
    <rect x="-2" y="-22" width="4" height="46" rx="2" fill="#10b981"/>
    <!-- S shape using arcs -->
    <path d="M-14,-8 Q-14,-20 0,-20 Q14,-20 14,-10 Q14,0 0,2 Q-14,4 -14,13 Q-14,22 0,22 Q14,22 14,10"
          fill="none" stroke="#10b981" stroke-width="5.5" stroke-linecap="round"/>
  </g>

  <!-- "THE BET" main text -->
  <text x="200" y="198"
        font-family="'Arial Black', 'Helvetica Neue', Arial, sans-serif"
        font-weight="900"
        font-size="62"
        letter-spacing="2"
        text-anchor="middle"
        fill="#ffffff"
        filter="url(#textshadow)">THE BET</text>

  <!-- Thin gold divider line -->
  <rect x="72" y="212" width="256" height="2" rx="1" fill="#f59e0b" opacity="0.7"/>

  <!-- "CFB PICKS" subtitle -->
  <text x="200" y="244"
        font-family="'Arial', Helvetica, sans-serif"
        font-weight="700"
        font-size="22"
        letter-spacing="5"
        text-anchor="middle"
        fill="#10b981"
        opacity="0.9">CFB PICKS</text>

  <!-- Corner accent dots -->
  <circle cx="200" cy="330" r="3" fill="#f59e0b" opacity="0.5"/>
  <circle cx="185" cy="330" r="2" fill="#f59e0b" opacity="0.3"/>
  <circle cx="215" cy="330" r="2" fill="#f59e0b" opacity="0.3"/>
</svg>
