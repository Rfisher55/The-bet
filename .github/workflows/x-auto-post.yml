name: X Auto-Post Picks

on:
  schedule:
    # All times UTC — CFB season runs Aug–Nov (EDT=UTC-4), late bowl season (EST=UTC-5)
    # Times set for EDT (primary season). Nov DST switch makes these 1h early — acceptable.
    # Note: off-minute (:07) avoids GitHub's high-load start-of-hour window which
    # frequently drops or delays :00 scheduled runs.
    # Tuesday 10:07am ET  — Top 5 biggest matchups thread
    - cron: '7 14 * * 2'
    # Wednesday 11:07am ET — Top 5 picks thread
    - cron: '7 15 * * 3'
    # Thursday 10:07am ET  — Parlay card thread
    - cron: '7 14 * * 4'
    # Friday 10:07am ET    — 5 highest-confidence locks
    - cron: '7 14 * * 5'
    # Saturday 9:07am ET   — "Who covers?" polls
    - cron: '7 13 * * 6'
    # Saturday 11:07am ET  — Game day hype tweets
    - cron: '7 15 * * 6'
    # Sunday 11:07am ET    — Results thread + update season record
    - cron: '7 15 * * 0'

  workflow_dispatch:
    inputs:
      post_type:
        description: 'Post type'
        required: true
        default: 'top5'
        type: choice
        options: [early, matchups, top5, locks, parlay, final, polls, gameday, results]
      parlay_legs:
        description: 'Parlay legs (only for type=parlay)'
        required: false
        default: '3'
      dry_run:
        description: 'Dry run — preview without posting'
        required: false
        default: true
        type: boolean

# Queues a new run rather than cancelling a live thread mid-post.
# Branch-scoped so a manual dispatch on a dev branch doesn't block the scheduled main run.
concurrency:
  group: x-auto-post-${{ github.ref }}
  cancel-in-progress: false

jobs:
  post-picks:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # needed to commit season-record.json on Sundays

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Gate: only run when the full season schedule is live (100+ games from CFBD).
      # During preseason (21 curated games), x-preseason-post.yml handles all posting.
      # Manual workflow_dispatch always bypasses the gate for testing.
      - name: Check season gate
        id: gate
        run: |
          TOTAL=$(node -e "try{const d=require('./data/games-2026.json');console.log(d.totalGames||0)}catch{console.log(0)}")
          echo "total_games=$TOTAL" >> $GITHUB_OUTPUT
          if [ "$TOTAL" -le "100" ] && [ "${{ github.event_name }}" != "workflow_dispatch" ]; then
            echo "Preseason ($TOTAL games ≤ 100) — x-preseason-post.yml handles posting until CFBD publishes full schedule"
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "Season live ($TOTAL games) — running in-season post"
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - name: Setup Node.js
        if: steps.gate.outputs.skip != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        if: steps.gate.outputs.skip != 'true'
        run: npm install
        working-directory: scripts

      - name: Resolve post type from schedule
        if: steps.gate.outputs.skip != 'true'
        id: cfg
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "type=${{ inputs.post_type }}"   >> $GITHUB_OUTPUT
            echo "legs=${{ inputs.parlay_legs }}" >> $GITHUB_OUTPUT
            echo "dry=${{ inputs.dry_run }}"      >> $GITHUB_OUTPUT
          else
            DAY=$(date +%u)    # 1=Mon 2=Tue 3=Wed 4=Thu 5=Fri 6=Sat 7=Sun
            HOUR=$(date +%H)   # UTC hour
            case "$DAY" in
              2) echo "type=matchups" >> $GITHUB_OUTPUT ;;  # Tue: 5 biggest games
              3) echo "type=top5"     >> $GITHUB_OUTPUT ;;  # Wed: top 5 picks thread
              4) echo "type=parlay"   >> $GITHUB_OUTPUT ;;  # Thu: parlay card
              5) echo "type=locks"    >> $GITHUB_OUTPUT ;;  # Fri: 5 highest-conf locks
              6)
                # Two Saturday runs: 13 UTC (9am EDT) = polls, 15 UTC (11am EDT) = gameday
                # Use a range to handle GitHub's scheduler delay (up to ~30 min late)
                if [ "$HOUR" -ge "13" ] && [ "$HOUR" -lt "15" ]; then
                  echo "type=polls"   >> $GITHUB_OUTPUT
                else
                  echo "type=gameday" >> $GITHUB_OUTPUT
                fi ;;
              7) echo "type=results" >> $GITHUB_OUTPUT ;;
              *) echo "Unexpected DAY=$DAY — no scheduled post for this day" >&2; exit 1 ;;
            esac
            echo "legs=3"    >> $GITHUB_OUTPUT
            echo "dry=false" >> $GITHUB_OUTPUT
          fi

      - name: Verify X credentials
        if: steps.gate.outputs.skip != 'true'
        env:
          X_OAUTH2_CLIENT_ID:     ${{ secrets.X_OAUTH2_CLIENT_ID }}
          X_OAUTH2_CLIENT_SECRET: ${{ secrets.X_OAUTH2_CLIENT_SECRET }}
          X_OAUTH2_REFRESH_TOKEN: ${{ secrets.X_OAUTH2_REFRESH_TOKEN }}
        run: |
          MISSING=""
          [ -z "$X_OAUTH2_CLIENT_ID" ]     && MISSING="$MISSING X_OAUTH2_CLIENT_ID"
          [ -z "$X_OAUTH2_CLIENT_SECRET" ] && MISSING="$MISSING X_OAUTH2_CLIENT_SECRET"
          [ -z "$X_OAUTH2_REFRESH_TOKEN" ] && MISSING="$MISSING X_OAUTH2_REFRESH_TOKEN"
          if [ -n "$MISSING" ]; then
            echo "❌ Missing secrets:$MISSING"
            echo "Run x-oauth2-setup workflow to generate a refresh token."
            exit 1
          fi
          echo "✅ All X credentials present"

      - name: Post to X
        if: steps.gate.outputs.skip != 'true'
        id: post
        env:
          X_OAUTH2_CLIENT_ID:     ${{ secrets.X_OAUTH2_CLIENT_ID }}
          X_OAUTH2_CLIENT_SECRET: ${{ secrets.X_OAUTH2_CLIENT_SECRET }}
          X_OAUTH2_REFRESH_TOKEN: ${{ secrets.X_OAUTH2_REFRESH_TOKEN }}
        run: |
          DRY=""
          [ "${{ steps.cfg.outputs.dry }}" = "true" ] && DRY="--dry-run"
          node scripts/post-picks.js \
            --type ${{ steps.cfg.outputs.type }} \
            --legs ${{ steps.cfg.outputs.legs }} \
            $DRY

      - name: Rotate refresh token
        if: always() && steps.gate.outputs.skip != 'true' && steps.cfg.outputs.dry != 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          if [ -s /tmp/new_refresh_token ]; then
            gh secret set X_OAUTH2_REFRESH_TOKEN -R ${{ github.repository }} < /tmp/new_refresh_token
            echo "✅ Refresh token rotated"
          elif [ -z "$GH_TOKEN" ]; then
            echo "⚠️ GH_PAT secret not set — token not rotated. Add GH_PAT (repo scope) to keep the refresh token fresh."
          else
            echo "ℹ️ No new refresh token written (post may have failed before auth)"
          fi

      # On Sundays, commit the updated season-record.json back to the repo
      - name: Save season record
        if: steps.cfg.outputs.type == 'results' && steps.cfg.outputs.dry == 'false' && github.ref == 'refs/heads/main'
        run: |
          git config user.name  "TheBet Bot"
          git config user.email "bot@thebetcfb.com"
          git pull --rebase origin main || { echo "Rebase failed — aborting push"; exit 1; }
          git add data/season-record.json
          git diff --staged --quiet || { git commit -m "Update season record [skip ci]" && git push; }
