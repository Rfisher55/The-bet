name: X Auto-Post Picks

on:
  schedule:
    # Tuesday 10am ET  — Early look (ELITE picks only)
    - cron: '0 15 * * 2'
    # Wednesday 11am ET — Top 5 games thread
    - cron: '0 16 * * 3'
    # Thursday 10am ET  — Parlay card thread
    - cron: '0 15 * * 4'
    # Friday 10am ET    — Final locked picks
    - cron: '0 15 * * 5'
    # Saturday 9am ET   — Game day reminders
    - cron: '0 14 * * 6'

  # Manual trigger from GitHub Actions tab (for testing)
  workflow_dispatch:
    inputs:
      post_type:
        description: 'Post type'
        required: true
        default: 'top5'
        type: choice
        options: [early, top5, parlay, final, gameday]
      parlay_legs:
        description: 'Parlay legs (2-5, only used when type=parlay)'
        required: false
        default: '3'
      dry_run:
        description: 'Dry run — preview without posting'
        required: false
        default: true
        type: boolean

jobs:
  post-picks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install
        working-directory: scripts

      - name: Resolve post type from schedule
        id: cfg
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "type=${{ inputs.post_type }}"   >> $GITHUB_OUTPUT
            echo "legs=${{ inputs.parlay_legs }}" >> $GITHUB_OUTPUT
            echo "dry=${{ inputs.dry_run }}"      >> $GITHUB_OUTPUT
          else
            DAY=$(date +%u)   # 1=Mon 2=Tue 3=Wed 4=Thu 5=Fri 6=Sat 7=Sun
            case "$DAY" in
              2) echo "type=early"   >> $GITHUB_OUTPUT ;;
              3) echo "type=top5"    >> $GITHUB_OUTPUT ;;
              4) echo "type=parlay"  >> $GITHUB_OUTPUT ;;
              5) echo "type=final"   >> $GITHUB_OUTPUT ;;
              6) echo "type=gameday" >> $GITHUB_OUTPUT ;;
              *) echo "type=final"   >> $GITHUB_OUTPUT ;;
            esac
            echo "legs=3"  >> $GITHUB_OUTPUT
            echo "dry=false" >> $GITHUB_OUTPUT
          fi

      - name: Post to X
        env:
          X_API_KEY:             ${{ secrets.X_API_KEY }}
          X_API_SECRET:          ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN:        ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
        run: |
          DRY=""
          [ "${{ steps.cfg.outputs.dry }}" = "true" ] && DRY="--dry-run"
          node scripts/post-picks.js \
            --type ${{ steps.cfg.outputs.type }} \
            --legs ${{ steps.cfg.outputs.legs }} \
            $DRY
