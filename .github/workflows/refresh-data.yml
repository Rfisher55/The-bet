name: Refresh CFB Data

# When it runs (all times UTC, EDT = UTC-4, EST = UTC-5):
#   - Every 4 hours on weekdays (Mon–Fri)
#   - Every 10 minutes on Saturdays 8am–7pm ET (early kickoffs through prime time)
#   - Every 10 minutes Saturday night into Sunday early morning (late games / final scores)
#   - Every 30 minutes Sunday 9am–7pm ET (bowl games, delayed finals)
#   - Every 30 minutes Sunday night into Monday (cleanup)
#   - Every 2 hours Sunday overnight/morning outside game windows
#   - Manual trigger via GitHub UI or API
on:
  schedule:
    - cron: "0 */4 * * 1-5"        # weekdays: every 4h
    - cron: "*/10 12-23 * * 6"     # Saturday UTC 12–23 (8am–7pm ET) — game day
    - cron: "*/10 0-5 * * 0"       # Sunday UTC 0–5 (Sat 8pm–1am ET) — late games + finals
    - cron: "*/30 13-23 * * 0"     # Sunday UTC 13–23 (9am–7pm ET) — bowl/final results
    - cron: "*/30 0-4 * * 1"       # Monday UTC 0–4 (Sun 8pm–midnight ET) — cleanup
    - cron: "0 0-12/2 * * 0"       # Sunday UTC 0–12 every 2h — overnight catchup
  workflow_dispatch:
    inputs:
      force:
        description: "Force full refresh even if data is fresh"
        required: false
        default: "false"
      test_alert:
        description: "Post a sample injury alert tweet to test the system"
        required: false
        default: false
        type: boolean

permissions:
  contents: write   # needed to commit data/ back to the current branch

# Prevent concurrent runs on the same branch from colliding on git push.
# Branch-scoped so a manual dev-branch run doesn't cancel a scheduled main run.
concurrency:
  group: refresh-cfb-data-${{ github.ref }}
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install dependencies
        run: npm install
        working-directory: scripts

      - name: Fetch live CFB data
        env:
          CFBD_API_KEY:  ${{ secrets.CFBD_API_KEY }}
          # Optional — add these in GitHub repo Settings → Secrets → Actions for extra data:
          ODDS_API_KEY:  ${{ secrets.ODDS_API_KEY }}   # free at the-odds-api.com (500 req/mo, 20+ US books)
          ODDSPAPI_KEY:  ${{ secrets.ODDSPAPI_KEY }}   # free at oddspapi.io (250 req/mo, includes Pinnacle)
        run: node scripts/fetch-live-data.mjs

      - name: Fetch player roster data
        env:
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
        run: node scripts/fetch-players.mjs

      - name: Scrape web intelligence (betting %, ATS trends, news, Reddit)
        run: node scripts/scrape-web.mjs
        continue-on-error: true  # scraping is best-effort — don't fail the whole workflow

      - name: Commit updated data if changed
        run: |
          git config user.name  "CFB Data Bot"
          git config user.email "bot@thebetcfb.com"
          git add data/
          if git diff --staged --quiet; then
            echo "No data changes — skipping commit"
          else
            GAME_COUNT=$(node -e "const d=require('./data/games-2026.json');console.log(d.games.length)" 2>/dev/null || echo "?")
            LINES_COUNT=$(node -e "const d=require('./data/games-2026.json');console.log(d.games.filter(g=>g.bettingLines).length)" 2>/dev/null || echo "?")
            SOURCES=$(node -e "const d=require('./data/metadata.json');console.log((d.dataSourcesActive||[]).length+' sources')" 2>/dev/null || echo "")
            git commit -m "data: refresh $(date -u '+%Y-%m-%d %H:%M UTC') — ${GAME_COUNT} games, ${LINES_COUNT} with lines, ${SOURCES} [skip ci]"
            CURRENT_BRANCH=$(git rev-parse --abbrev-ref HEAD)
            git pull --rebase origin "$CURRENT_BRANCH" 2>/dev/null || { echo "⚠️ Rebase failed — skipping push to avoid overwriting concurrent data commit"; exit 1; }
            git push origin HEAD:"$CURRENT_BRANCH"
            # Sync data/ to main so the live GitHub Pages site always has fresh data
            if [ "$CURRENT_BRANCH" != "main" ]; then
              git fetch origin main
              git checkout main
              git pull --rebase origin main 2>/dev/null || true
              git checkout "$CURRENT_BRANCH" -- data/
              git add data/
              if ! git diff --staged --quiet; then
                git commit -m "data: sync to main from $CURRENT_BRANCH [skip ci]"
                git push origin main
                echo "✅ Data synced to main"
              else
                echo "No data delta vs main — skipping sync"
              fi
              git checkout "$CURRENT_BRANCH"
            fi
          fi

      - name: Check and post breaking alerts
        env:
          X_OAUTH2_CLIENT_ID:     ${{ secrets.X_OAUTH2_CLIENT_ID }}
          X_OAUTH2_CLIENT_SECRET: ${{ secrets.X_OAUTH2_CLIENT_SECRET }}
          X_OAUTH2_REFRESH_TOKEN: ${{ secrets.X_OAUTH2_REFRESH_TOKEN }}
        run: |
          TEST_FLAG=""
          [ "${{ inputs.test_alert }}" = "true" ] && TEST_FLAG="--test"
          node scripts/check-alerts.js $TEST_FLAG

      # If check-alerts.js posted and rotated the token, pass the new token forward
      # so live-game-alerts.js doesn't use the now-invalidated original token.
      - name: Pass rotated token to game alerts
        run: |
          if [ -s /tmp/new_refresh_token ]; then
            echo "X_OAUTH2_REFRESH_TOKEN=$(cat /tmp/new_refresh_token)" >> $GITHUB_ENV
            echo "✅ Using rotated token for live game alerts"
          fi

      - name: Post live game alerts (Saturdays only)
        env:
          X_OAUTH2_CLIENT_ID:     ${{ secrets.X_OAUTH2_CLIENT_ID }}
          X_OAUTH2_CLIENT_SECRET: ${{ secrets.X_OAUTH2_CLIENT_SECRET }}
          X_OAUTH2_REFRESH_TOKEN: ${{ env.X_OAUTH2_REFRESH_TOKEN }}
        run: |
          DAY=$(date +%u)
          if [ "$DAY" = "6" ]; then
            node scripts/live-game-alerts.js
          else
            echo "Not Saturday — skipping live alerts"
          fi

      - name: Commit alert state files
        run: |
          git config user.name  "CFB Data Bot"
          git config user.email "bot@thebetcfb.com"
          git add data/alert-state.json data/live-state.json
          if git diff --staged --quiet; then
            echo "No state changes — skipping commit"
          else
            git commit -m "data: update alert state [skip ci]"
            CURRENT_BRANCH=$(git rev-parse --abbrev-ref HEAD)
            git pull --rebase origin "$CURRENT_BRANCH" 2>/dev/null || { echo "⚠️ Rebase failed — skipping alert state push"; exit 1; }
            git push origin HEAD:"$CURRENT_BRANCH"
          fi

      - name: Rotate refresh token after alerts
        if: always()
        run: |
          if [ -s /tmp/new_refresh_token ]; then
            NEW_TOKEN=$(cat /tmp/new_refresh_token)
            node -e "
              const fs = require('fs');
              const p = 'data/x-auth.json';
              const s = fs.existsSync(p) ? JSON.parse(fs.readFileSync(p,'utf8')) : {};
              s.refreshToken = process.argv[1];
              s.updatedAt = new Date().toISOString();
              fs.writeFileSync(p, JSON.stringify(s, null, 2));
            " "$NEW_TOKEN"
            git config user.name  "TheBet Bot"
            git config user.email "bot@thebetcfb.com"
            git add data/x-auth.json
            git diff --staged --quiet || git commit -m "auth: rotate X OAuth2 refresh token [skip ci]"
            BRANCH=$(git rev-parse --abbrev-ref HEAD)
            git pull --rebase origin "$BRANCH" 2>/dev/null || true
            git push origin HEAD:"$BRANCH" || true
            echo "✅ Refresh token saved"
          fi
