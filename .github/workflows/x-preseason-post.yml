name: X Preseason Post

on:
  schedule:
    - cron: '7 10 * * 1-6'
      timezone: 'America/New_York'
  push:
    paths:
      - '.trigger-post'
  workflow_dispatch:
    inputs:
      angle:
        description: 'Content angle'
        required: true
        default: 'hot-takes'
        type: choice
        options: [intro, hot-takes, sleepers, fades, ats-value, portal, momentum, conference, team, rotate]
      team:
        description: 'Team name (angle=team only)'
        required: false
        default: ''
      conf:
        description: 'Conference (angle=conference only)'
        required: false
        default: ''
      count:
        description: 'Number of tweets'
        required: false
        default: '1'
      offset:
        description: 'Team offset for rotate'
        required: false
        default: '0'
      dry_run:
        description: 'Dry run — preview only'
        required: false
        default: false
        type: boolean

concurrency:
  group: x-post-${{ github.ref }}
  cancel-in-progress: false

jobs:
  preseason-post:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
      - name: Pull latest data
        run: git pull origin ${{ github.ref_name }}

      - name: Check season gate
        id: gate
        run: |
          TOTAL=$(node -e "try{const d=require('./data/games-2026.json');console.log(d.totalGames||0)}catch{console.log(0)}")
          HAS_LINES=$(node -e "try{const d=require('./data/games-2026.json');const n=(d.games||[]).filter(g=>g.bettingLines&&g.bettingLines.spread!=null).length;console.log(n)}catch{console.log(0)}")
          if [ "$TOTAL" -gt "100" ] && [ "$HAS_LINES" -gt "0" ] && [ "${{ github.event_name }}" != "workflow_dispatch" ]; then
            echo "Season live with lines — x-auto-post.yml handles posts"
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "Preseason mode ($TOTAL games) — running"
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - uses: actions/setup-node@v4
        if: steps.gate.outputs.skip != 'true'
        with: { node-version: '24' }

      - name: Install dependencies
        if: steps.gate.outputs.skip != 'true'
        run: npm install
        working-directory: scripts

      - name: Resolve angle from schedule
        if: steps.gate.outputs.skip != 'true'
        id: cfg
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "angle=${{ inputs.angle }}"   >> $GITHUB_OUTPUT
            echo "count=${{ inputs.count }}"   >> $GITHUB_OUTPUT
            echo "offset=${{ inputs.offset }}" >> $GITHUB_OUTPUT
            echo "team=${{ inputs.team }}"     >> $GITHUB_OUTPUT
            echo "conf=${{ inputs.conf }}"     >> $GITHUB_OUTPUT
            echo "dry=${{ inputs.dry_run }}"   >> $GITHUB_OUTPUT
          else
            DOW=$(date +%u)
            WEEK=$(date +%V)
            DAY_OF_YEAR=$(date +%j)
            echo "DOW=$DOW WEEK=$WEEK DAY_OF_YEAR=$DAY_OF_YEAR"
            CONFS=("SEC" "Big Ten" "Big 12" "ACC" "Mountain West" "Sun Belt" "MAC" "American Athletic" "Conference USA" "FBS Independents" "Pac-2")
            CONF_IDX=$(( (WEEK - 1) % 11 ))
            CONF="${CONFS[$CONF_IDX]}"
            OFFSET=$(( (DAY_OF_YEAR * 5) % 130 ))
            case "$DOW" in
              1) ANGLE="hot-takes"; COUNT=2; OFFSET=0; CONF=""; TEAM="" ;;
              2) ANGLE="conference"; COUNT=1; OFFSET=0; TEAM="" ;;
              3) ANGLE="rotate"; COUNT=3; CONF=""; TEAM="" ;;
              4) [ $(( WEEK % 2 )) -eq 1 ] && ANGLE="sleepers" || ANGLE="fades"; COUNT=3; OFFSET=0; CONF=""; TEAM="" ;;
              5) [ $(( WEEK % 2 )) -eq 1 ] && ANGLE="ats-value" || ANGLE="portal"; COUNT=3; OFFSET=0; CONF=""; TEAM="" ;;
              6) ANGLE="momentum"; COUNT=2; OFFSET=0; CONF=""; TEAM="" ;;
              *) echo "❌ Unexpected DOW=$DOW"; exit 1 ;;
            esac
            if [ -z "$ANGLE" ]; then echo "❌ ANGLE empty — aborting"; exit 1; fi
            echo "Resolved: angle=$ANGLE count=$COUNT conf=$CONF"
            echo "angle=$ANGLE"   >> $GITHUB_OUTPUT
            echo "count=$COUNT"   >> $GITHUB_OUTPUT
            echo "offset=$OFFSET" >> $GITHUB_OUTPUT
            echo "team=$TEAM"     >> $GITHUB_OUTPUT
            echo "conf=$CONF"     >> $GITHUB_OUTPUT
            echo "dry=false"      >> $GITHUB_OUTPUT
          fi

      - name: Skip if already posted today
        if: steps.gate.outputs.skip != 'true' && steps.cfg.outputs.dry != 'true'
        id: already_posted
        run: |
          TODAY=$(TZ='America/New_York' date +%Y-%m-%d)
          POSTED_ET=$(node -e "
            try {
              const d = JSON.parse(require('fs').readFileSync('data/x-auth.json','utf8'));
              const ts = d.postedAt || '';
              if (!ts) { console.log(''); process.exit(0); }
              console.log(new Date(ts).toLocaleDateString('en-CA', {timeZone:'America/New_York'}));
            } catch { console.log(''); }
          ")
          if [ "$POSTED_ET" = "$TODAY" ]; then
            echo "✅ Already posted today ET ($POSTED_ET) — skipping"
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "No successful post yet for $TODAY ET (last ET: ${POSTED_ET:-never}) — proceeding"
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - name: Verify X credentials
        if: steps.gate.outputs.skip != 'true' && steps.already_posted.outputs.skip != 'true'
        env:
          X_OAUTH2_CLIENT_ID:     ${{ secrets.X_OAUTH2_CLIENT_ID }}
          X_OAUTH2_CLIENT_SECRET: ${{ secrets.X_OAUTH2_CLIENT_SECRET }}
          X_OAUTH2_REFRESH_TOKEN: ${{ secrets.X_OAUTH2_REFRESH_TOKEN }}
        run: |
          MISSING=""
          [ -z "$X_OAUTH2_CLIENT_ID" ]     && MISSING="$MISSING X_OAUTH2_CLIENT_ID"
          [ -z "$X_OAUTH2_CLIENT_SECRET" ] && MISSING="$MISSING X_OAUTH2_CLIENT_SECRET"
          [ -z "$X_OAUTH2_REFRESH_TOKEN" ] && MISSING="$MISSING X_OAUTH2_REFRESH_TOKEN"
          if [ -n "$MISSING" ]; then echo "❌ Missing:$MISSING"; exit 1; fi
          echo "✅ Credentials present"

      - name: Post to X
        if: steps.gate.outputs.skip != 'true' && steps.already_posted.outputs.skip != 'true'
        id: post
        env:
          X_OAUTH2_CLIENT_ID:     ${{ secrets.X_OAUTH2_CLIENT_ID }}
          X_OAUTH2_CLIENT_SECRET: ${{ secrets.X_OAUTH2_CLIENT_SECRET }}
          X_OAUTH2_REFRESH_TOKEN: ${{ secrets.X_OAUTH2_REFRESH_TOKEN }}
        run: |
          # Build args as an array to correctly handle conference names with spaces ("Big Ten", etc.)
          ARGS=(--angle "${{ steps.cfg.outputs.angle }}" --count "${{ steps.cfg.outputs.count }}" --offset "${{ steps.cfg.outputs.offset }}")
          [ -n "${{ steps.cfg.outputs.conf }}" ] && ARGS+=(--conf "${{ steps.cfg.outputs.conf }}")
          [ -n "${{ steps.cfg.outputs.team }}" ] && ARGS+=(--team "${{ steps.cfg.outputs.team }}")
          [ "${{ steps.cfg.outputs.dry }}" = "true" ] && ARGS+=(--dry-run)
          echo "Posting: angle=${{ steps.cfg.outputs.angle }} count=${{ steps.cfg.outputs.count }} conf=${{ steps.cfg.outputs.conf }}"
          node scripts/post-preseason.js "${ARGS[@]}"

      - name: Save token and mark post
        if: always() && steps.gate.outputs.skip != 'true' && steps.cfg.outputs.dry != 'true'
        env:
          POST_OUTCOME: ${{ steps.post.outcome }}
        run: |
          if [ -s /tmp/new_refresh_token ]; then
            NEW_TOKEN=$(cat /tmp/new_refresh_token)
            node -e "
              const fs = require('fs');
              const p = 'data/x-auth.json';
              const s = fs.existsSync(p) ? JSON.parse(fs.readFileSync(p,'utf8')) : {};
              s.refreshToken = process.argv[1];
              s.updatedAt = new Date().toISOString();
              if (process.env.POST_OUTCOME === 'success' && fs.existsSync('/tmp/post_succeeded')) {
                s.postedAt = fs.readFileSync('/tmp/post_succeeded','utf8').trim();
              }
              fs.writeFileSync(p, JSON.stringify(s, null, 2));
            " "$NEW_TOKEN"
            git config user.name  "TheBet Bot"
            git config user.email "bot@thebetcfb.com"
            git add data/x-auth.json data/post-history.json
            git diff --staged --quiet || git commit -m "auth: rotate X OAuth2 refresh token [skip ci]"
            BRANCH=$(git rev-parse --abbrev-ref HEAD)
            git pull --rebase origin "$BRANCH" 2>/dev/null || true
            git push origin HEAD:"$BRANCH" || true
            echo "✅ Token saved. Post outcome: $POST_OUTCOME"
          else
            # Still commit post-history even if no new token (e.g. post succeeded but token unchanged)
            git config user.name  "TheBet Bot"
            git config user.email "bot@thebetcfb.com"
            git add data/post-history.json 2>/dev/null || true
            git diff --staged --quiet || { git commit -m "data: update post history [skip ci]" && BRANCH=$(git rev-parse --abbrev-ref HEAD) && git pull --rebase origin "$BRANCH" 2>/dev/null || true && git push origin HEAD:"$BRANCH" || true; }
            echo "ℹ️ No new refresh token"
          fi
