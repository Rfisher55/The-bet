name: X Preseason Post

on:
  # Auto-schedule: once per day at 10am ET (14:00 UTC), Mon-Sat
  schedule:
    - cron: '0 14 * * 1-6'

  workflow_dispatch:
    inputs:
      angle:
        description: 'Content angle'
        required: true
        default: 'hot-takes'
        type: choice
        options:
          - intro
          - hot-takes
          - sleepers
          - fades
          - ats-value
          - portal
          - momentum
          - conference
          - team
          - rotate
      team:
        description: 'Team name (only for angle=team, e.g. "Boise State")'
        required: false
        default: ''
      conf:
        description: 'Conference (only for angle=conference, e.g. "Big Ten")'
        required: false
        default: ''
      count:
        description: 'Number of tweets (1=single post, 3-5=thread)'
        required: false
        default: '1'
      offset:
        description: 'Team offset for rotate angle (0, 5, 10, 15…)'
        required: false
        default: '0'
      dry_run:
        description: 'Dry run — preview without posting'
        required: false
        default: false
        type: boolean

jobs:
  preseason-post:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm install
        working-directory: scripts

      - name: Resolve angle from schedule
        id: cfg
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "angle=${{ inputs.angle }}"   >> $GITHUB_OUTPUT
            echo "count=${{ inputs.count }}"   >> $GITHUB_OUTPUT
            echo "offset=${{ inputs.offset }}" >> $GITHUB_OUTPUT
            echo "team=${{ inputs.team }}"     >> $GITHUB_OUTPUT
            echo "conf=${{ inputs.conf }}"     >> $GITHUB_OUTPUT
            echo "dry=${{ inputs.dry_run }}"   >> $GITHUB_OUTPUT
          else
            # Auto-schedule: rotate angles by day of week + week number
            DOW=$(date +%u)       # 1=Mon … 6=Sat
            WEEK=$(date +%V)      # ISO week number (1-52)
            DAY_OF_YEAR=$(date +%j)

            # Conference rotation (10 conferences, rotate by week)
            CONFS=("SEC" "Big Ten" "Big 12" "ACC" "Mountain West" "Sun Belt" "MAC" "American Athletic" "Conference USA" "FBS Independents")
            CONF_IDX=$(( (WEEK - 1) % 10 ))
            CONF="${CONFS[$CONF_IDX]}"

            # Team rotate offset: advances by 5 every day
            OFFSET=$(( (DAY_OF_YEAR * 5) % 130 ))

            case "$DOW" in
              1) # Monday — Bold hot takes
                echo "angle=hot-takes" >> $GITHUB_OUTPUT
                echo "count=2"         >> $GITHUB_OUTPUT
                echo "offset=0"        >> $GITHUB_OUTPUT
                echo "conf="           >> $GITHUB_OUTPUT
                echo "team="           >> $GITHUB_OUTPUT
                ;;
              2) # Tuesday — Conference power rankings
                echo "angle=conference" >> $GITHUB_OUTPUT
                echo "count=1"          >> $GITHUB_OUTPUT
                echo "offset=0"         >> $GITHUB_OUTPUT
                echo "conf=${CONF}"     >> $GITHUB_OUTPUT
                echo "team="            >> $GITHUB_OUTPUT
                ;;
              3) # Wednesday — Team spotlight rotation (covers all 133 teams)
                echo "angle=rotate"    >> $GITHUB_OUTPUT
                echo "count=3"         >> $GITHUB_OUTPUT
                echo "offset=${OFFSET}" >> $GITHUB_OUTPUT
                echo "conf="           >> $GITHUB_OUTPUT
                echo "team="           >> $GITHUB_OUTPUT
                ;;
              4) # Thursday — Sleepers (odd weeks) or Fades (even weeks)
                if [ $(( WEEK % 2 )) -eq 1 ]; then
                  echo "angle=sleepers" >> $GITHUB_OUTPUT
                else
                  echo "angle=fades"    >> $GITHUB_OUTPUT
                fi
                echo "count=3"  >> $GITHUB_OUTPUT
                echo "offset=0" >> $GITHUB_OUTPUT
                echo "conf="    >> $GITHUB_OUTPUT
                echo "team="    >> $GITHUB_OUTPUT
                ;;
              5) # Friday — ATS value (odd weeks) or Transfer portal (even weeks)
                if [ $(( WEEK % 2 )) -eq 1 ]; then
                  echo "angle=ats-value" >> $GITHUB_OUTPUT
                else
                  echo "angle=portal"    >> $GITHUB_OUTPUT
                fi
                echo "count=3"  >> $GITHUB_OUTPUT
                echo "offset=0" >> $GITHUB_OUTPUT
                echo "conf="    >> $GITHUB_OUTPUT
                echo "team="    >> $GITHUB_OUTPUT
                ;;
              6) # Saturday — Program momentum
                echo "angle=momentum" >> $GITHUB_OUTPUT
                echo "count=2"        >> $GITHUB_OUTPUT
                echo "offset=0"       >> $GITHUB_OUTPUT
                echo "conf="          >> $GITHUB_OUTPUT
                echo "team="          >> $GITHUB_OUTPUT
                ;;
            esac
            echo "dry=false" >> $GITHUB_OUTPUT
          fi

      - name: Post to X
        env:
          X_OAUTH2_CLIENT_ID:     ${{ secrets.X_OAUTH2_CLIENT_ID }}
          X_OAUTH2_CLIENT_SECRET: ${{ secrets.X_OAUTH2_CLIENT_SECRET }}
          X_OAUTH2_REFRESH_TOKEN: ${{ secrets.X_OAUTH2_REFRESH_TOKEN }}
        run: |
          DRY=""
          [ "${{ steps.cfg.outputs.dry }}" = "true" ] && DRY="--dry-run"

          TEAM_ARG=""
          [ -n "${{ steps.cfg.outputs.team }}" ] && TEAM_ARG="--team \"${{ steps.cfg.outputs.team }}\""

          CONF_ARG=""
          [ -n "${{ steps.cfg.outputs.conf }}" ] && CONF_ARG="--conf \"${{ steps.cfg.outputs.conf }}\""

          echo "Angle: ${{ steps.cfg.outputs.angle }}"
          echo "Count: ${{ steps.cfg.outputs.count }}"
          echo "Offset: ${{ steps.cfg.outputs.offset }}"

          node scripts/post-preseason.js \
            --angle "${{ steps.cfg.outputs.angle }}" \
            --count "${{ steps.cfg.outputs.count }}" \
            --offset "${{ steps.cfg.outputs.offset }}" \
            $TEAM_ARG \
            $CONF_ARG \
            $DRY

      - name: Update refresh token
        if: steps.cfg.outputs.dry != 'true' && success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_PAT }}
        run: |
          if [ -f /tmp/new_refresh_token ]; then
            NEW_TOKEN=$(cat /tmp/new_refresh_token)
            gh secret set X_OAUTH2_REFRESH_TOKEN --body "$NEW_TOKEN" --repo rfisher55/the-bet
            echo "✅ Refresh token updated"
          fi
