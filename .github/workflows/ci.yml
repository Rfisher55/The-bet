name: CI

on:
  push:
    branches: [main, 'claude/d1-football-predictor-rkApg']
  pull_request:
    branches: [main, 'claude/d1-football-predictor-rkApg']

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install dependencies
        run: npm install
        working-directory: scripts
      - name: Validate JSON data files
        run: |
          for f in data/*.json; do
            node -e "JSON.parse(require('fs').readFileSync('$f','utf8'))" && echo "✅ $f" || { echo "❌ $f is invalid JSON"; exit 1; }
          done
      - name: Run test suite
        run: node scripts/run-tests.js
