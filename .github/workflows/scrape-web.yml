name: Scrape Web Intelligence

# Runs independently of the CFBD data refresh so betting%, news, and Reddit
# can update 2-4x more often without burning CFBD API quota.
#
# Schedule:
#   Weekdays:  every 2 hours
#   Saturday:  every 20 minutes (game day — live betting shifts constantly)
#   Sunday:    every 1 hour

on:
  schedule:
    - cron: "0 */2 * * 1-5"        # weekdays: every 2 h
    - cron: "*/20 12-23 * * 6"     # Saturday: every 20 min (8am–7pm ET)
    - cron: "*/20 0-5 * * 0"       # Sat night/Sun early: every 20 min
    - cron: "0 * * * 0"            # Sunday: every 1 h
  workflow_dispatch:               # manual trigger anytime

permissions:
  contents: write

concurrency:
  group: scrape-web-intel-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install dependencies
        run: npm install
        working-directory: scripts

      - name: Run web scraper
        run: node scripts/scrape-web.mjs

      - name: Commit web-intel.json if changed
        run: |
          git config user.name  "Web Scraper Bot"
          git config user.email "bot@thebetcfb.com"
          git add data/web-intel.json
          if git diff --staged --quiet; then
            echo "No scrape changes — skipping commit"
          else
            ALERTS=$(node -e "try{const d=JSON.parse(require('fs').readFileSync('data/web-intel.json','utf8'));console.log(d.criticalAlerts?.length||0)}catch{console.log(0)}" 2>/dev/null || echo "0")
            git commit -m "scrape: web-intel update $(date -u '+%H:%M UTC') — ${ALERTS} alerts [skip ci]"
            CURRENT_BRANCH=$(git rev-parse --abbrev-ref HEAD)
            if [ "$CURRENT_BRANCH" = "main" ]; then
              git pull --rebase origin main 2>/dev/null || { echo "⚠️ Rebase conflict — skipping push"; exit 0; }
              git push origin HEAD:main
            fi
          fi
