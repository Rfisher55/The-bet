name: Deploy Cloudflare Worker

on:
  push:
    branches: [main, claude/d1-football-predictor-rkApg]
    paths:
      - 'worker/**'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy Twitter Proxy Worker
    env:
      ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      TWITTER_TOKEN: ${{ secrets.TWITTER_BEARER_TOKEN }}
      SCRIPT_NAME: the-bet-proxy

    steps:
      - uses: actions/checkout@v4

      - name: Deploy Worker script via Cloudflare API
        run: |
          echo "Deploying worker script..."
          RESPONSE=$(curl -s -w "\nHTTP_STATUS:%{http_code}" \
            -X PUT "https://api.cloudflare.com/client/v4/accounts/${ACCOUNT_ID}/workers/scripts/${SCRIPT_NAME}" \
            -H "Authorization: Bearer ${CF_TOKEN}" \
            -F 'metadata={"main_module":"worker.js","compatibility_date":"2024-01-01"};type=application/json' \
            -F "worker.js=@worker/index.js;type=application/javascript+module")

          HTTP_STATUS=$(echo "$RESPONSE" | grep "HTTP_STATUS:" | cut -d: -f2)
          BODY=$(echo "$RESPONSE" | grep -v "HTTP_STATUS:")

          echo "Status: $HTTP_STATUS"
          echo "Response: $BODY"

          if [ "$HTTP_STATUS" != "200" ]; then
            echo "Deploy failed with status $HTTP_STATUS"
            exit 1
          fi
          echo "Worker deployed successfully"

      - name: Set Twitter Bearer Token secret
        run: |
          echo "Setting TWITTER_BEARER_TOKEN secret..."
          RESPONSE=$(curl -s -w "\nHTTP_STATUS:%{http_code}" \
            -X PUT "https://api.cloudflare.com/client/v4/accounts/${ACCOUNT_ID}/workers/scripts/${SCRIPT_NAME}/secrets" \
            -H "Authorization: Bearer ${CF_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "{\"name\":\"TWITTER_BEARER_TOKEN\",\"text\":\"${TWITTER_TOKEN}\",\"type\":\"secret_text\"}")

          HTTP_STATUS=$(echo "$RESPONSE" | grep "HTTP_STATUS:" | cut -d: -f2)
          BODY=$(echo "$RESPONSE" | grep -v "HTTP_STATUS:")

          echo "Status: $HTTP_STATUS"
          echo "Response: $BODY"

          if [ "$HTTP_STATUS" != "200" ]; then
            echo "Secret upload failed with status $HTTP_STATUS"
            exit 1
          fi
          echo "Secret set successfully"

      - name: Print Worker URL
        run: |
          echo "========================================"
          echo "Worker deployed at:"
          echo "https://${SCRIPT_NAME}.${ACCOUNT_ID}.workers.dev"
          echo "========================================"
