name: Deploy Cloudflare Worker

on:
  push:
    branches: [main]
    paths:
      - 'worker/**'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy Twitter Proxy Worker

    steps:
      - uses: actions/checkout@v4

      - name: Deploy with Wrangler
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: worker

      - name: Set Twitter Bearer Token secret
        env:
          ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          TWITTER_TOKEN: ${{ secrets.TWITTER_BEARER_TOKEN }}
          SCRIPT_NAME: the-bet-proxy
        run: |
          echo "Setting TWITTER_BEARER_TOKEN secret..."
          RESPONSE=$(curl -s -w "\nHTTP_STATUS:%{http_code}" \
            -X PUT "https://api.cloudflare.com/client/v4/accounts/${ACCOUNT_ID}/workers/scripts/${SCRIPT_NAME}/secrets" \
            -H "Authorization: Bearer ${CF_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "{\"name\":\"TWITTER_BEARER_TOKEN\",\"text\":\"${TWITTER_TOKEN}\",\"type\":\"secret_text\"}")

          HTTP_STATUS=$(echo "$RESPONSE" | grep "HTTP_STATUS:" | cut -d: -f2)
          BODY=$(echo "$RESPONSE" | grep -v "HTTP_STATUS:")

          echo "Status: $HTTP_STATUS"
          echo "Response: $BODY"

          if [ "$HTTP_STATUS" != "200" ]; then
            echo "Secret upload failed — continuing anyway (secret may already be set)"
          else
            echo "Secret set successfully"
          fi

      - name: Print Worker URL
        run: |
          echo "========================================"
          echo "Worker URL: https://the-bet-proxy.${{ secrets.CLOUDFLARE_ACCOUNT_ID }}.workers.dev"
          echo "========================================"
