name: Keepalive

# GitHub auto-disables scheduled workflows on repos with no commits in 60 days.
# This workflow runs on the 1st of every month and re-enables any disabled workflows
# via the GitHub API — no dummy commits, no noise in git history.

on:
  schedule:
    - cron: '0 12 1 * *'   # 1st of every month at noon UTC
  workflow_dispatch:        # can also be triggered manually

jobs:
  keepalive:
    runs-on: ubuntu-latest
    permissions:
      actions: write   # required to re-enable workflows via API
    steps:
      - uses: actions/checkout@v4
      - uses: liskin/gh-workflow-keepalive@v1
