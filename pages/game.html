  /* 16 — Live News + Social Intel (ESPN news + Reddit r/CFB) */
  function renderSocial() {
    const newsByTeam = window.__espnNewsByTeam || {};
    const redditByTeam = window.__redditByTeam || {};
    const portalIn  = window.__portalIn  || {};
    const portalOut = window.__portalOut || {};

    function espnNewsBlock(team) {
      const articles = (newsByTeam[team.name] || []).slice(0, 3);
      if (!articles.length) return "";
      return articles.map(a => {
        const ago = a.published
          ? (() => {
              const diff = Date.now() - new Date(a.published).getTime();
              const h = Math.round(diff / 36e5);
              return h < 1 ? "just now" : h < 24 ? `${h}h ago` : `${Math.floor(h/24)}d ago`;
            })()
          : "";
        return `
          <a href="${a.url || "#"}" target="_blank" rel="noopener" style="display:block;text-decoration:none;padding:8px 10px;margin-bottom:6px;background:var(--surface);border:1px solid var(--border);border-radius:6px">
            <div style="font-size:.72rem;font-weight:700;color:var(--text);line-height:1.3;margin-bottom:3px">${a.headline}</div>
            ${a.description ? `<div style="font-size:.65rem;color:var(--muted);line-height:1.4">${a.description.slice(0, 100)}${a.description.length > 100 ? "…" : ""}</div>` : ""}
            <div style="font-size:.6rem;color:var(--muted);margin-top:4px">ESPN${ago ? " · " + ago : ""}</div>
          </a>`;
      }).join("");
    }

    function redditBlock(team) {
      const posts = (redditByTeam[team.id] || []).sort((a, b) => b.score - a.score).slice(0, 3);
      if (!posts.length) return "";
      return posts.map(p => {
        const sentColor = p.upvoteRatio >= 0.85 ? "var(--primary)" : p.upvoteRatio >= 0.7 ? "var(--gold)" : "var(--muted)";
        const ago = p.created
          ? (() => {
              const diff = Date.now() - p.created * 1000;
              const h = Math.round(diff / 36e5);
              return h < 1 ? "just now" : h < 24 ? `${h}h ago` : `${Math.floor(h/24)}d ago`;
            })()
          : "";
        return `
          <a href="${p.url}" target="_blank" rel="noopener" style="display:block;text-decoration:none;padding:8px 10px;margin-bottom:6px;background:var(--surface);border:1px solid var(--border);border-radius:6px">
            <div style="font-size:.7rem;font-weight:600;color:var(--text);line-height:1.3;margin-bottom:3px">${p.title.slice(0, 100)}${p.title.length > 100 ? "…" : ""}</div>
            <div style="display:flex;gap:8px;align-items:center;font-size:.6rem;color:var(--muted)">
              <span style="color:${sentColor};font-weight:700">▲ ${p.score}</span>
              <span>${p.comments} comments</span>
              ${ago ? `<span>${ago}</span>` : ""}
              <span style="margin-left:auto">r/CFB</span>
            </div>
          </a>`;
      }).join("");
    }

    function portalBlock(team) {
      const ins  = (portalIn[team.name]  || []).slice(0, 3);
      const outs = (portalOut[team.name] || []).slice(0, 3);
      if (!ins.length && !outs.length) return "";
      const row = (p, dir) => {
        const stars = p.stars ? "★".repeat(Math.round(p.stars)) + "☆".repeat(5 - Math.round(p.stars)) : "";
        return `<div style="font-size:.68rem;padding:4px 0;border-bottom:1px solid var(--border);display:flex;gap:6px;align-items:center">
          <span style="color:${dir === "in" ? "var(--primary)" : "var(--danger)"};font-weight:800;font-size:.6rem">${dir === "in" ? "IN" : "OUT"}</span>
          <span style="font-weight:700;color:var(--text)">${p.firstName || ""} ${p.lastName || ""}</span>
          <span style="color:var(--muted)">${p.position || ""}</span>
          ${stars ? `<span style="color:var(--gold);font-size:.55rem;margin-left:auto">${stars}</span>` : ""}
          ${dir === "in" && p.origin      ? `<span style="color:var(--muted);font-size:.6rem;margin-left:auto">from ${p.origin}</span>`       : ""}
          ${dir === "out" && p.destination ? `<span style="color:var(--muted);font-size:.6rem;margin-left:auto">to ${p.destination}</span>` : ""}
        </div>`;
      };
      return `
        <div style="margin-bottom:8px;padding:8px 10px;background:var(--surface);border:1px solid var(--border);border-radius:6px">
          <div style="font-size:.6rem;font-weight:800;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted-l);margin-bottom:6px">2026 TRANSFER PORTAL</div>
          ${ins.map(p => row(p, "in")).join("")}
          ${outs.map(p => row(p, "out")).join("")}
        </div>`;
    }

    const homeNews    = espnNewsBlock(home);
    const awayNews    = espnNewsBlock(away);
    const homeReddit  = redditBlock(home);
    const awayReddit  = redditBlock(away);
    const homePortal  = portalBlock(home);
    const awayPortal  = portalBlock(away);
    const hasAnyLive  = homeNews || awayNews || homeReddit || awayReddit || homePortal || awayPortal;

    return `
      <div class="card card-p mb-5">
        <div class="section-label">Live Intel — News &amp; Social</div>
        <div style="font-size:.62rem;color:var(--muted);margin-bottom:12px">Real-time data from ESPN, Reddit r/CFB, and CFBD transfer portal</div>

        ${hasAnyLive ? `
          ${(homeNews || homeReddit || homePortal) ? `
            <div style="font-size:.6rem;font-weight:800;letter-spacing:1.5px;text-transform:uppercase;color:${home.color};margin-bottom:6px">${home.name}</div>
            ${homePortal}${homeNews}${homeReddit}` : ""}
          ${(awayNews || awayReddit || awayPortal) ? `
            <div style="font-size:.6rem;font-weight:800;letter-spacing:1.5px;text-transform:uppercase;color:${away.color};margin:10px 0 6px">${away.name}</div>
            ${awayPortal}${awayNews}${awayReddit}` : ""}
        ` : `
          <div style="font-size:.75rem;color:var(--muted);padding:12px 0;text-align:center">
            No recent news found — data updates every 30 minutes
          </div>
        `}
      </div>`;
  }

  /* 17 — 7-Signal Model Breakdown (RIGHT column) */
  function renderBreakdown() {
    const edge = pred.overallEdge || null;
    const eb = edge ? edge.breakdown : null;
    const WEIGHTS = { baseModel:30, playerImpact:20, situational:15, weather:10, coachingEdge:10, programMomentum:8, sharpMoney:7 };

    // Build signal rows with actual point contributions
    const SIG_ICONS = { baseModel: "⚡", playerImpact: "🏃", situational: "📍", weather: "🌤", coachingEdge: "🧠", programMomentum: "📈", sharpMoney: "💵" };
    const signals = [
      {
        key: "baseModel", label: "Stats Engine", icon: SIG_ICONS.baseModel, weight: WEIGHTS.baseModel,
        edge: eb ? eb.baseModelEdge : null,
        desc: "Offense vs defense matchup, SP+, scoring margins, yards, efficiency metrics",
        color: "var(--accent)",
      },
      {
        key: "playerImpact", label: "Player Intelligence", icon: SIG_ICONS.playerImpact, weight: WEIGHTS.playerImpact,
        edge: eb ? eb.playerImpactEdge : null,
        desc: "Key player ratings, injury status, cold-weather ratings, matchup-specific grades",
        color: "var(--primary)",
      },
      {
        key: "situational", label: "Situational Analysis", icon: SIG_ICONS.situational, weight: WEIGHTS.situational,
        edge: eb ? eb.situationalEdge : null,
        desc: "Trap game risk, lookahead spots, travel burden, emotional momentum, rest advantage",
        color: "#34d399",
      },
      {
        key: "weather", label: "Weather Impact", icon: SIG_ICONS.weather, weight: WEIGHTS.weather,
        edge: eb ? eb.weatherEdge : null,
        desc: "Temperature, wind, precipitation — suppresses scoring and favors run-first teams",
        color: "#38bdf8",
      },
      {
        key: "coachingEdge", label: "Coaching Edge", icon: SIG_ICONS.coachingEdge, weight: WEIGHTS.coachingEdge,
        edge: eb ? eb.coachingEdgePts : null,
        desc: "ATS record as favorite/underdog, halftime adjustment rating, big-spot performance",
        color: "#c084fc",
      },
      {
        key: "programMomentum", label: "Program Momentum", icon: SIG_ICONS.programMomentum, weight: WEIGHTS.programMomentum,
        edge: eb ? eb.programMomentumEdge : null,
        desc: "NIL strength, transfer portal grade, recruiting trajectory, locker room cohesion",
        color: "var(--gold)",
      },
      {
        key: "sharpMoney", label: "Sharp Money / Lines", icon: SIG_ICONS.sharpMoney, weight: WEIGHTS.sharpMoney,
        edge: eb ? eb.sharpMoneyEdge : null,
        desc: "Line movement, reverse line movement, steam moves, sharp action vs public betting",
        color: "#f472b6",
      },
    ];

    const totalWeight = Object.values(WEIGHTS).reduce((a,b)=>a+b,0);
    const favoredName = (e) => {
      if (e === null || e === undefined || Math.abs(e) < 0.1) return "EVEN";
      return e > 0 ? home.abbreviation : away.abbreviation;
    };
    const edgeColor = (e) => {
      if (e === null || e === undefined || Math.abs(e) < 0.1) return "var(--muted)";
      return e > 0 ? home.color : away.color;
    };

    return `
      <div class="card card-p mb-5" id="section-signals">
        <div class="section-label">7-Signal Model Breakdown</div>
        <div style="font-size:.72rem;color:var(--muted-l);margin-bottom:14px;line-height:1.55">
          Each signal is weighted and combined to produce the final spread prediction. Edge shown is points favoring ${home.abbreviation} (positive) or ${away.abbreviation} (negative).
        </div>

        ${signals.map(sig => {
          const eVal = sig.edge !== null && sig.edge !== undefined ? sig.edge : null;
          const eAbs = eVal !== null ? Math.abs(eVal) : 0;
          const barWidth = Math.min(100, eAbs * 12); // scale for visual
          const wPct = Math.round((sig.weight / totalWeight) * 100);
          // Fill ratio for the circle: based on weight allocation
          const fillRatio = Math.min(1, sig.weight / 30);
          return `
            <div style="margin-bottom:12px;padding-bottom:12px;border-bottom:1px solid var(--border)">
              <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;gap:6px;flex-wrap:wrap">
                <div style="display:flex;align-items:center;gap:8px">
                  <!-- Signal icon circle -->
                  <div class="sig-icon-circle" style="background:${sig.color}18;border-color:${sig.color}40">
                    <span style="font-size:.88rem">${sig.icon}</span>
                  </div>
                  <!-- Fill circle indicating weight -->
                  <div class="sig-fill-circle" style="background:${sig.color};border-color:${sig.color};opacity:${0.4 + fillRatio * 0.6}"></div>
                  <div>
                    <span style="font-size:.78rem;font-weight:800;color:var(--text)">${sig.label}</span>
                    <span style="font-size:.58rem;padding:1px 6px;border-radius:6px;background:var(--surface);border:1px solid var(--border);color:var(--muted);font-weight:700;margin-left:4px">${sig.weight}%</span>
                  </div>
                </div>
                <div style="display:flex;align-items:center;gap:6px">
                  ${eVal !== null ? `
                    <span style="font-size:.7rem;font-weight:900;color:${edgeColor(eVal)}">${favoredName(eVal)}</span>
                    <span style="font-size:.78rem;font-weight:700;color:${edgeColor(eVal)}">${eAbs < 0.1 ? "—" : (eVal > 0 ? "+" : "") + eVal.toFixed(1) + " pts"}</span>
                  ` : `<span style="font-size:.7rem;color:var(--muted)">—</span>`}
                </div>
              </div>
              ${eVal !== null && eAbs >= 0.1 ? `
                <div style="display:flex;align-items:center;gap:6px;margin-bottom:4px;padding-left:52px">
                  <div style="flex:1;height:6px;border-radius:3px;background:var(--border);overflow:hidden">
                    <div style="height:100%;width:${barWidth}%;background:${sig.color};border-radius:3px;transition:width .5s ease;box-shadow:0 0 6px ${sig.color}55"></div>
                  </div>
                </div>` : `<div style="height:6px;border-radius:3px;background:var(--border);margin-bottom:4px;margin-left:52px"></div>`}
              <div style="font-size:.65rem;color:var(--muted);line-height:1.45;padding-left:52px">${sig.desc}</div>
            </div>`;
        }).join("")}

        <div style="padding:10px 14px;border-radius:var(--radius);background:var(--surface);border:1px solid var(--border);margin-top:4px">
          <div style="display:flex;justify-content:space-between;align-items:center">
            <span style="font-size:.7rem;font-weight:800;color:var(--muted-l);letter-spacing:1px;text-transform:uppercase">Combined Model Edge</span>
            <span style="font-size:1rem;font-weight:900;color:${pred.predictedSpread > 0 ? home.color : away.color}">
              ${pred.predictedSpread > 0 ? home.abbreviation : away.abbreviation} ${Math.abs(pred.predictedSpread).toFixed(1)} pts
            </span>
          </div>
          <div style="font-size:.65rem;color:var(--muted);margin-top:4px">Predicted total: ${pred.homeExpected !== undefined ? pred.homeExpected.toFixed(0) : "—"}-${pred.awayExpected !== undefined ? pred.awayExpected.toFixed(0) : "—"} · Vegas line: ${game.bettingLines ? fmtSpread(game.bettingLines.spread) : "N/A"}</div>
        </div>
      </div>`;
  }

  /* ── FINAL RENDER ─────────────────────────────────── */
  document.getElementById("content").innerHTML = `
    <a class="back-link" href="games.html">← Back to Games</a>

    ${renderAlertBanner()}

    <!-- MATCHUP HEADER -->
    <div class="matchup-header mb-5" style="background:linear-gradient(135deg,${home.color}12 0%,var(--card) 40%,${away.color}12 100%)">
      <div class="flex items-center justify-between mb-5" style="flex-wrap:wrap;gap:8px">
        <div class="flex items-center gap-2 flex-wrap">
          <span class="text-xs text-muted">${fmtDate(game.date)} · ${game.time} ET</span>
          <span class="text-xs text-muted">·</span>
          <span class="text-xs text-muted">${game.venue}${game.venueCity ? ", " + game.venueCity : ""}</span>
          <span class="text-xs text-muted">·</span>
          <span class="text-xs text-muted">${game.network}</span>
          ${game.isConferenceGame ? '<span class="badge badge-conf">CONF GAME</span>' : ""}
        </div>
        <span class="badge ${confCls}">${confLbl}</span>
      </div>
      <div class="matchup-teams">
        <div class="team-chip">
          <div class="team-logo team-logo-lg" style="background:${away.color};flex-shrink:0">${away.abbreviation.slice(0, 3)}</div>
          <div style="min-width:0;overflow:hidden">
            <div style="font-size:clamp(.82rem,3vw,1.1rem);font-weight:800;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${away.name}</div>
            <div class="text-xs text-muted" style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${away.mascot} · Away</div>
            <div class="text-xs text-muted">${away.conference}</div>
          </div>
        </div>
        <div class="matchup-vs">
          <div class="matchup-vs-txt">VS</div>
          <div class="matchup-vs-wk" style="white-space:nowrap">Wk ${game.week}</div>
          ${game.bettingLines ? `<div class="text-xs text-muted mt-1" style="white-space:nowrap">${fmtSpread(game.bettingLines.spread)}</div><div class="text-xs text-muted" style="white-space:nowrap">O/U ${game.bettingLines.total}</div>` : ""}
        </div>
        <div class="team-chip team-chip-r">
          <div style="min-width:0;overflow:hidden">
            <div style="font-size:clamp(.82rem,3vw,1.1rem);font-weight:800;color:var(--text);text-align:right;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${home.name}</div>
            <div class="text-xs text-muted text-right" style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">Home · ${home.mascot}</div>
            <div class="text-xs text-muted text-right">${home.conference}</div>
          </div>
          <div class="team-logo team-logo-lg" style="background:${home.color};flex-shrink:0">${home.abbreviation.slice(0, 3)}</div>
        </div>
      </div>
    </div>

    ${(() => {
      // Quick Decision Strip — immediately visible after header
      const gp2 = game.gamePreview;
      const tp2 = gp2 && gp2.thePick;
      const sp2 = pred.spreadPick || {};
      const tp2Pick = tp2 && tp2.team;
      const tp2Conf = tp2 && tp2.confidence ? tp2.confidence.toUpperCase() : null;
      const tp2Units = tp2 && tp2.unit ? tp2.unit : (tp2Conf === "ELITE" ? 2 : tp2Conf === "HIGH" ? 1.5 : 1);
      const tp2Line = tp2 && tp2.line ? tp2.line : null;
      const hasPick2 = tp2Pick || (sp2.side && sp2.side !== "no-bet");
      const pickTeam2 = tp2Pick || sp2.team;
      const pickConf2 = tp2Conf || (sp2.side !== "no-bet" ? (pred.confidence || "medium").toUpperCase() : null);
      const isNoBet = sp2.side === "no-bet" && !tp2Pick;
      const confColors2 = { ELITE:"var(--primary)", HIGH:"var(--primary)", MEDIUM:"var(--gold)", LOW:"var(--muted-l)" };
      const cColor2 = confColors2[pickConf2] || "var(--muted)";
      const isElite = pickConf2 === "ELITE";
      const sm2 = pred.sharpMoneySignal || {};
      const pickTeam2IsHome = pickTeam2 && (pickTeam2.toLowerCase() === (home.name||"").toLowerCase() || pickTeam2.toLowerCase() === (home.abbreviation||"").toLowerCase());
      const sharpAgrees = sm2.strength >= 6 && sm2.side !== "neutral" &&
        ((sm2.side === "home" && pickTeam2IsHome) || (sm2.side === "away" && !pickTeam2IsHome));

      // EV calculation — model's estimated win probability vs -110 standard odds
      const spConf2 = sp2.confidence || 0; // 51-95 range (model's cover probability %)
      const evWinProb = spConf2 > 0 ? spConf2 / 100 : 0.525; // fallback ~52.5%
      const evWin = evWinProb * (100 / 110);    // win $90.91 per $100 risked at -110
      const evLoss = (1 - evWinProb) * 1;       // lose $1 per $1 risked
      const evPct = ((evWin - evLoss) * 100).toFixed(1); // EV% per dollar
      const evPositive = parseFloat(evPct) > 0;
      const evColor = evPositive ? "var(--primary)" : "var(--danger)";

      // Best Bet Score — composite signal strength
      const confBonus2 = { ELITE: 35, HIGH: 25, MEDIUM: 15, LOW: 5 };
      let betScore = (confBonus2[pickConf2] || 0)
        + Math.min((sp2.edge || 0) * 4, 20)
        + (pred.winProbability >= 65 ? 18 : pred.winProbability >= 58 ? 10 : pred.winProbability >= 52 ? 4 : 0)
        + (sm2.strength === "strong" ? 14 : sm2.strength === "moderate" ? 8 : 0)
        + (sharpAgrees ? 8 : 0)
        + (evPositive ? 5 : 0);
      betScore = Math.min(Math.max(betScore, 0), 100);
      const betScoreColor = betScore >= 70 ? "var(--primary)" : betScore >= 50 ? "var(--gold)" : betScore >= 35 ? "#f97316" : "var(--danger)";
      const betScoreLabel = betScore >= 70 ? "Strong" : betScore >= 50 ? "Moderate" : betScore >= 35 ? "Marginal" : "Weak";

      if (!hasPick2 && !isNoBet) return "";
      return `
      <div style="margin-bottom:16px;padding:12px 16px;border-radius:var(--radius-lg);background:${isNoBet ? "rgba(255,255,255,.02)" : isElite ? "rgba(16,185,129,.08)" : "rgba(255,255,255,.03)"};border:1px solid ${isNoBet ? "var(--border)" : isElite ? "rgba(16,185,129,.35)" : "rgba(255,255,255,.1)"};display:flex;align-items:center;gap:12px;flex-wrap:wrap">
        <div style="font-size:.55rem;font-weight:900;letter-spacing:2px;text-transform:uppercase;color:${isNoBet?"var(--muted)":"var(--primary)"};flex-shrink:0">${isNoBet ? "⏸ PASS" : "✅ BET"}</div>
        <div style="width:1px;height:24px;background:var(--border);flex-shrink:0"></div>
        ${hasPick2 && pickTeam2 ? `
        <div style="flex:1;min-width:0">
          <span style="font-size:.92rem;font-weight:900;color:var(--text)">${esc(pickTeam2)} covers</span>
          ${tp2Line ? `<span style="font-size:.72rem;color:var(--muted-l);margin-left:6px">${esc(tp2Line)}</span>` : ""}
        </div>
        <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;flex-shrink:0">
          ${pickConf2 ? `<span style="font-size:.6rem;font-weight:900;padding:3px 8px;border-radius:5px;background:${cColor2}20;border:1px solid ${cColor2}40;color:${cColor2}">${pickConf2}</span>` : ""}
          <span style="font-size:.6rem;font-weight:800;color:var(--muted-l)">${tp2Units}u</span>
          ${sp2.edge >= 1 ? `<span style="font-size:.6rem;font-weight:700;color:var(--primary)">+${sp2.edge} pts edge</span>` : ""}
          ${spConf2 > 0 ? `<span style="font-size:.6rem;font-weight:800;padding:2px 6px;border-radius:4px;background:${evPositive?"rgba(16,185,129,.1)":"rgba(239,68,68,.08)"};color:${evColor};border:1px solid ${evColor}40">EV ${evPct.startsWith("-")?"":"+"}${evPct}%</span>` : ""}
          ${sharpAgrees ? `<span style="font-size:.6rem;font-weight:700;color:var(--primary)">💰 Sharps agree</span>` : ""}
          <div style="display:flex;align-items:center;gap:5px;padding:2px 8px;border-radius:6px;background:${betScoreColor}15;border:1px solid ${betScoreColor}35">
            <div style="font-size:.55rem;font-weight:900;color:var(--muted);letter-spacing:.5px">SCORE</div>
            <div style="font-size:.72rem;font-weight:900;color:${betScoreColor}">${betScore}</div>
            <div style="font-size:.55rem;color:${betScoreColor}">${betScoreLabel}</div>
          </div>
        </div>` : `<div style="flex:1;font-size:.82rem;color:var(--muted)">No edge vs Vegas — skip this game</div>`}
        <a href="#section-picks" style="font-size:.65rem;font-weight:700;color:var(--primary);text-decoration:none;flex-shrink:0;white-space:nowrap">Full Analysis ↓</a>
      </div>`;
    })()}

    ${safe(renderPreGameReport, "")}

    ${(() => {
      // ── Key Numbers Alert ────────────────────────────────────
      const kn_bl = game.bettingLines;
      if (!kn_bl || kn_bl.spread == null) return "";
      const KEY_NUMS = [3, 3.5, 7, 7.5, 10, 10.5, 14];
      const absSpread = Math.abs(kn_bl.spread);
      const closest = KEY_NUMS.reduce(function(best, kn) {
        return Math.abs(kn - absSpread) < Math.abs(best - absSpread) ? kn : best;
      }, KEY_NUMS[0]);
      const distFromKey = Math.abs(closest - absSpread);
      if (distFromKey > 1) return ""; // only show if within 1 pt of a key number

      const isOnKey = distFromKey < 0.1;
      const keyMsgs = {
        3:    "3 points is the most significant key number in football — games are decided by a field goal 15% of the time. Shop for -2.5 if you can.",
        3.5:  "3 is the #1 key number nearby — line at 3.5 means you lose by 3 on a push. Consider if the hook is worth it.",
        7:    "7 is the #2 key number — TD+PAT games. At exactly 7, consider betting the money line if the pick is a favorite.",
        7.5:  "7 is one step away — you have the hook. Line at 7.5 means you survive a 7-point loss vs the alternative.",
        10:   "10-point spreads historically push at a high rate. The range 9.5–10.5 is a key zone.",
        10.5: "10 is a key number nearby — at 10.5 you have a half-point of protection over the key.",
        14:   "Two-touchdown spreads historically hit at elevated rates. Shop for the best number in the 13.5–14.5 range.",
      };
      const msg = keyMsgs[closest] || ("Spread is near a key number (" + closest + ")");
      const color = isOnKey ? "var(--gold)" : "var(--muted-l)";
      return `
      <div style="margin-bottom:16px;padding:10px 14px;border-radius:var(--radius);background:rgba(245,158,11,.05);border:1px solid rgba(245,158,11,.2);display:flex;align-items:center;gap:10px">
        <div style="flex-shrink:0;font-size:1rem">🔢</div>
        <div style="flex:1;min-width:0">
          <div style="font-size:.6rem;font-weight:900;letter-spacing:1.5px;text-transform:uppercase;color:var(--gold);margin-bottom:3px">KEY NUMBER ${isOnKey ? "— RIGHT ON IT" : "— NEARBY (" + distFromKey.toFixed(1) + " PTS AWAY)"}</div>
          <div style="font-size:.72rem;color:var(--text-soft);line-height:1.5">${msg}</div>
        </div>
      </div>`;
    })()}

    ${safe(renderKeyInsight, "")}

    ${safe(renderGamePreview, "")}

    ${safe(renderFullRoster, "")}

    ${safe(renderPositionMatchups, "")}

    ${safe(renderXFactors, "")}

    <!-- MAIN DETAIL GRID -->
    <div class="detail-grid">

      <!-- ─── LEFT COLUMN ─── -->
      <div>
        ${safe(renderModelGrade, "")}
        ${safe(renderPicks, "")}
        ${safe(renderFactors, "")}
        ${safe(renderStats, "")}
        ${safe(renderVegas, "")}
      </div>

      <!-- ─── RIGHT COLUMN ─── -->
      <div>
        ${safe(renderSharpMoney, "")}
        ${safe(renderWeather, "")}
        ${safe(renderSituational, "")}
        ${safe(renderCoaching, "")}
        ${safe(renderProgramHealth, "")}
        ${safe(renderBreakdown, "")}
      </div>

    </div><!-- /detail-grid -->

    ${safe(renderSocialHub, "")}

    ${(() => {
      // Prop Bet Radar — uses key player data to surface notable prop angles
      const propPlayers = allPlayers.filter(p => p.position && p.stats);
      if (!propPlayers.length) return "";

      const props = [];

      propPlayers.forEach(p => {
        const st = p.stats;
        const isHome = p.teamId === home.id;
        const teamName = isHome ? home.name : away.name;
        const injuryStatus = p.injury && p.injury.status ? p.injury.status : "active";
        if (injuryStatus === "out" || injuryStatus === "doubtful") return;
        const inj = injuryStatus === "questionable" ? " ⚠ Q" : injuryStatus === "limited" ? " ⚠ LTD" : "";
        const pos = (p.position || "").toUpperCase();

        // QB passing yards — flat over/under suggestion
        if ((pos === "QB" || pos.includes("QB")) && st.passingYardsPerGame) {
          const pyg = st.passingYardsPerGame;
          const mMatchup = isHome ? (away.stats && away.stats.yardsAllowedPerGame) : (home.stats && home.stats.yardsAllowedPerGame);
          if (mMatchup && mMatchup < 280 && pyg >= 250) {
            props.push({ icon: "🏈", name: p.name + inj, team: teamName, pos, stat: "Passing Yards", val: pyg.toFixed(0) + " avg/g", angle: "UNDER lean — tough D allows " + mMatchup.toFixed(0) + " yds/g", dir: "under" });
          } else if (mMatchup && mMatchup >= 330 && pyg >= 230) {
            props.push({ icon: "🔥", name: p.name + inj, team: teamName, pos, stat: "Passing Yards", val: pyg.toFixed(0) + " avg/g", angle: "OVER lean — soft D gives up " + mMatchup.toFixed(0) + " yds/g", dir: "over" });
          }
        }

        // RB rushing yards
        if ((pos === "RB" || pos.includes("RB")) && st.rushingYardsPerGame) {
          const ryg = st.rushingYardsPerGame;
          const oppRushDef = isHome ? (away.stats && away.stats.yardsAllowedPerGame) : (home.stats && home.stats.yardsAllowedPerGame);
          if (oppRushDef && oppRushDef < 280 && ryg >= 90) {
            props.push({ icon: "🛡", name: p.name + inj, team: teamName, pos, stat: "Rushing Yards", val: ryg.toFixed(0) + " avg/g", angle: "UNDER lean — matchup tough", dir: "under" });
          } else if (oppRushDef && oppRushDef >= 340 && ryg >= 75) {
            props.push({ icon: "🔥", name: p.name + inj, team: teamName, pos, stat: "Rushing Yards", val: ryg.toFixed(0) + " avg/g", angle: "Game script favors this back", dir: "over" });
          }
        }

        // High-impact injuries that affect game
        if (p.injury && (p.injury.status === "questionable" || p.injury.status === "limited") && p.impactRating >= 8) {
          props.push({ icon: "🩹", name: p.name, team: teamName, pos, stat: "Status Alert", val: p.injury.status.toUpperCase(), angle: "Monitor final injury report — if active, they play through it", dir: "watch" });
        }
      });

      if (!props.length) return "";

      return `
      <div class="card card-p mb-5" id="section-props">
        <div class="section-label">Prop Bet Radar</div>
        <div style="font-size:.68rem;color:var(--muted);margin-bottom:12px">Matchup-based prop angles derived from player stats vs opponent defense. Always verify actual lines at your sportsbook.</div>
        <div style="display:flex;flex-direction:column;gap:8px">
          ${props.slice(0, 6).map(pr => {
            const dc = pr.dir === "over" ? "var(--primary)" : pr.dir === "under" ? "var(--danger)" : "var(--gold)";
            const db = pr.dir === "over" ? "rgba(16,185,129,.06)" : pr.dir === "under" ? "rgba(239,68,68,.06)" : "rgba(245,158,11,.06)";
            return `<div style="display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:var(--radius);background:${db};border:1px solid ${dc}20">
              <span style="font-size:1rem;flex-shrink:0">${pr.icon}</span>
              <div style="flex:1;min-width:0">
                <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:2px">
                  <strong style="font-size:.8rem;color:var(--text)">${esc(pr.name)}</strong>
                  <span style="font-size:.58rem;padding:1px 5px;border-radius:3px;background:rgba(255,255,255,.06);color:var(--muted)">${esc(pr.pos)} · ${esc(pr.team)}</span>
                  <span style="font-size:.62rem;font-weight:700;color:var(--muted-l)">${esc(pr.stat)}: ${esc(pr.val)}</span>
                </div>
                <div style="font-size:.7rem;color:var(--text-soft)">${esc(pr.angle)}</div>
              </div>
              <span style="font-size:.62rem;font-weight:900;padding:3px 8px;border-radius:5px;background:${dc}20;border:1px solid ${dc}40;color:${dc};flex-shrink:0">${pr.dir.toUpperCase()}</span>
            </div>`;
          }).join("")}
        </div>
        <div style="margin-top:10px;font-size:.62rem;color:var(--muted);font-style:italic">Prop picks are model-based angles, not official picks. Injuries and line availability vary by sportsbook.</div>
      </div>`;
    })()}

    <!-- DISCLAIMER -->
    <div style="margin-top:24px;padding:16px 20px;border-radius:var(--radius-lg);background:rgba(16,185,129,.04);border:1px solid rgba(16,185,129,.15);display:flex;gap:14px;align-items:flex-start">
      <span style="color:var(--primary);font-size:1rem;flex-shrink:0;margin-top:2px">ℹ</span>
      <div>
        <div style="font-size:.875rem;font-weight:700;color:var(--text);margin-bottom:4px">Disclaimer</div>
        <div style="font-size:.78rem;color:var(--muted-l);line-height:1.6">
          Predictions generated by The Bet AI Model v2.0 using SP+, EPA, recruiting, situational, weather, sharp money, and player intelligence signals.
          All picks are <strong style="color:var(--primary)">for entertainment purposes only</strong>. Past performance does not guarantee future results.
          Never bet more than you can afford to lose. If you or someone you know has a gambling problem,
          call the National Problem Gambling Helpline: <strong style="color:var(--text)">1-800-522-4700</strong>.
        </div>
      </div>
    </div>
  `;

  document.title = `${away.name} @ ${home.name} — The Bet`;

  window._gamePick = {
    gameId: game.id,
    homeTeam: home.name,
    awayTeam: away.name,
    pickTeam: officialPickTeam,
    pickConf: (game.gamePreview && game.gamePreview.thePick && game.gamePreview.thePick.confidence) || (pred && pred.confidence) || "medium",
    pickLine: (game.gamePreview && game.gamePreview.thePick && game.gamePreview.thePick.line) || (game.bettingLines && game.bettingLines.spread != null ? fmtSpread(game.bettingLines.spread) : ""),
    pickSide: officialPickIsHome ? "home" : "away",
    gameWeek: game.week || null,
    gameDate: game.date || null,
  };

  /* ── Section TOC (sticky right nav, desktop only) ── */
  const tocSections = [
    { id: "section-picks",      label: "Picks" },
    { id: "section-roster",     label: "Roster" },
    { id: "section-xfactors",   label: "X-Factors" },
    { id: "section-sharp",      label: "Sharp $" },
    { id: "section-weather",    label: "Weather" },
    { id: "section-situational",label: "Situational" },
    { id: "section-coaching",   label: "Coaching" },
    { id: "section-program",    label: "Prog. Health" },
    { id: "section-signals",    label: "7-Signals" },
    { id: "section-props",      label: "Props" },
    { id: "section-social",     label: "Social" },
  ];
  const tocEl = document.createElement("nav");
  tocEl.className = "section-toc";
  tocEl.setAttribute("aria-label", "Page sections");
  tocEl.innerHTML = tocSections.map(s => `
    <div class="section-toc-item" onclick="(function(){var el=document.getElementById('${s.id}');if(el)el.scrollIntoView({behavior:'smooth',block:'start'});})()">
      ${s.label}
    </div>`).join("");
  document.body.appendChild(tocEl);
  // Expose roster re-renderer so boot() can refresh the section after live data
  window._gameRosterRenderer = function() {
    const liveAllPlayers = (typeof KEY_PLAYERS !== "undefined" ? KEY_PLAYERS : [])
      .filter(p => p.teamId === home.id || p.teamId === away.id);
    if (liveAllPlayers.length <= allPlayers.length) return null; // nothing new
    // Patch allPlayers in-place so renderFullRoster closure picks up new entries
    liveAllPlayers.forEach(p => { if (!allPlayers.find(x => x.id === p.id)) allPlayers.push(p); });
    return safe(renderFullRoster, null);
  };

  } catch(err) {
    document.getElementById("content").innerHTML = `
      <div class="empty">
        <div class="empty-icon">⚠️</div>
        <div class="empty-title">Error loading game</div>
        <div class="empty-sub" style="font-family:monospace;font-size:.75rem;color:var(--danger);max-width:90%;word-break:break-all;margin-top:8px">${err && err.message ? err.message : String(err)}</div>
        <a href="games.html" class="btn btn-primary" style="margin-top:16px;display:inline-flex">← Back to Games</a>
      </div>`;
    console.error("Game render error:", err);
  }
}

// ── Quick Pick Tracker ──────────────────────────────────
window.addCurrentPickToTracker = function() {
  var dp = window._gamePick;
  if (!dp || !dp.pickTeam) return;
  var LS_KEY = 'theBet_myPicks';
  var btn = document.getElementById("quick-add-btn");
  var picks = JSON.parse(localStorage.getItem(LS_KEY) || '[]');
  if (picks.some(function(p) { return p.gameId === dp.gameId; })) {
    if (btn) { btn.textContent = "✓ Already Tracked"; btn.style.opacity = ".6"; }
    return;
  }
  picks.unshift({
    id: Date.now().toString(),
    date: dp.gameDate || new Date().toISOString().slice(0,10),
    game: dp.awayTeam + " @ " + dp.homeTeam,
    pick: dp.pickTeam + " covers" + (dp.pickLine ? " " + dp.pickLine : ""),
    odds: -110,
    wager: 100,
    result: "pending",
    notes: "Added from game page · " + (dp.pickConf || "").toUpperCase() + " confidence",
    addedAt: new Date().toISOString(),
    gameId: dp.gameId,
    pickSide: dp.pickSide,
    pickLine: parseFloat(dp.pickLine) || null,
    pickType: "spread",
    gameWeek: dp.gameWeek || null,
    homeTeam: dp.homeTeam,
    awayTeam: dp.awayTeam,
  });
  localStorage.setItem(LS_KEY, JSON.stringify(picks));
  if (btn) {
    btn.textContent = "✅ Added to My Picks!";
    btn.style.background = "rgba(16,185,129,.25)";
    btn.style.borderColor = "var(--primary)";
    setTimeout(function() {
      btn.textContent = "📋 Track This Pick";
      btn.style.background = "rgba(16,185,129,.12)";
      btn.style.borderColor = "rgba(16,185,129,.3)";
    }, 2500);
  }
};

// ── Boot: find game now, or wait for live data ──────────
(function boot() {
  function tryRender() {
    const found = GAMES.find(g => g.id === gameId);
    if (found) { renderGamePage(found); return true; }
    return false;
  }

  // Static data has it — render immediately
  if (tryRender()) return;

  // Show spinner
  document.getElementById("content").innerHTML = `
    <div style="padding:48px 24px;text-align:center">
      <div style="font-size:2rem;margin-bottom:12px">⏳</div>
      <div style="font-size:1rem;font-weight:700;color:var(--text);margin-bottom:6px">Loading game data…</div>
      <div style="font-size:.8rem;color:var(--muted)">Fetching live schedule — this takes a few seconds.</div>
    </div>`;

  function showNotFound() {
    document.getElementById("content").innerHTML = `
      <div class="empty-card">
        <div class="empty-card-icon">🏈</div>
        <div class="empty-card-title">Game Not Found</div>
        <div class="empty-card-sub">
          We couldn't find the game you're looking for. The game ID may be incorrect or this matchup may not exist in our 2026 schedule yet.
          <br><br>Try browsing all available games on the schedule page to find what you're looking for.
        </div>
        <a href="games.html" class="btn btn-primary" style="display:inline-flex;align-items:center;gap:6px;margin-bottom:10px">← Back to Schedule</a>
        <div style="font-size:.72rem;color:var(--muted);margin-top:8px">ID searched: <code style="color:var(--text-soft)">${gameId || "(none)"}</code></div>
      </div>`;
  }

  // If live data already loaded (e.g. user navigated here from another page),
  // the event already fired — check the flag and try now, don't wait forever.
  if (window.__liveDataReady) {
    if (!tryRender()) showNotFound();
    return;
  }

  window.addEventListener("liveDataReady", function onLiveReady() {
    window.removeEventListener("liveDataReady", onLiveReady);
    if (!tryRender()) showNotFound();
  });

  // After pregen fires and renders the page quickly, live data may arrive later
  // with richer KEY_PLAYERS (from CFBD API). Re-render just the player section.
  window.addEventListener("liveDataReady", function onLivePlayerRefresh(e) {
    if (!e.detail || e.detail._fromPregen) return; // skip pregen events
    const rosterEl = document.getElementById("section-roster");
    if (!rosterEl || !window._gameRosterRenderer) return;
    try {
      const fresh = window._gameRosterRenderer();
      if (fresh) rosterEl.outerHTML = fresh;
    } catch {}
  });
})();
</script>
<script src="../js/config.js"></script>
<script src="../js/live.js"></script>
</body>
</html>
