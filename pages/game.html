          <button id="share-pick-btn" class="share-pick-btn" onclick="window.__sharePick()">&#128228; Share Pick</button>
        </div>
        ${safe(renderWinGauge, "")}
        <div class="grid-3 mb-4">
          <!-- ATS — curated pick overrides model when available so the two sections always agree -->
          ${(function() {
            const curatedPick = game.gamePreview && game.gamePreview.thePick && game.gamePreview.thePick.team
              ? game.gamePreview.thePick : null;
            const curatedTeam = curatedPick ? curatedPick.team : null;
            const curatedLine = curatedPick ? curatedPick.line : null;
            const curatedConf = curatedPick ? curatedPick.confidence : null;
            // Determine home/away side using same matcher as the top-level code (avoids Iowa/Iowa-State ambiguity)
            const curatedSide = curatedTeam
              ? (_teamMatchesCurated(home, curatedTeam) && !_teamMatchesCurated(away, curatedTeam) ? "home"
                : _teamMatchesCurated(away, curatedTeam) ? "away"
                : null) : null;
            // Resolve to display pick: curated wins; fall back to model
            const hasPick = curatedSide || (pred.spreadPick && pred.spreadPick.side !== "no-bet");
            const displaySide = curatedSide || (pred.spreadPick ? pred.spreadPick.side : null);
            const displayTeam = curatedTeam || (pred.spreadPick ? pred.spreadPick.team : "");
            const displayLine = curatedLine || (game.bettingLines && pred.spreadPick && pred.spreadPick.side !== "no-bet"
              ? fmtSpread(pred.spreadPick.side === "home" ? game.bettingLines.spread : -game.bettingLines.spread) : "");
            const confColors = { HIGH: "var(--primary)", MEDIUM: "var(--gold)", LOW: "var(--muted-l)" };
            const dispConfColor = confColors[curatedConf] || (displaySide === "home" ? "var(--accent)" : "var(--gold)");
            const borderColor = hasPick ? (displaySide === "home" ? "rgba(99,102,241,.5)" : "rgba(245,158,11,.5)") : "var(--border)";
            const bgColor    = hasPick ? (displaySide === "home" ? "rgba(99,102,241,.1)" : "rgba(245,158,11,.1)") : "var(--surface)";
            return `<div style="border-radius:12px;padding:16px;text-align:center;border:2px solid ${borderColor};background:${bgColor}">
              <div class="text-xs text-muted mb-2" style="text-transform:uppercase;letter-spacing:.5px">Spread Pick</div>
              ${hasPick
                ? `<div style="font-size:.95rem;font-weight:800;color:${dispConfColor}">Will cover spread</div>
                   <div class="text-xs text-muted mt-1">${displayTeam}${displayLine ? ' · ' + displayLine : ''}</div>
                   ${curatedPick ? '<div class="text-xs mt-1" style="color:var(--muted);font-style:italic">From analysis</div>'
                                 : `<div class="text-xs text-muted mt-1">Edge +${pred.spreadPick.edge} pts</div>`}
                   ${pred.spreadPick && pred.spreadPick.keyNumber ? `<div class="text-xs mt-1" style="color:var(--gold);font-weight:700">⚠ Near key # ${pred.spreadPick.keyNumber}</div>` : ""}`
                : `<div style="font-size:.95rem;font-weight:700;color:var(--muted)">No Bet</div>
                   <div class="text-xs text-muted mt-1">No significant edge</div>`}
            </div>`;
          })()}
          <!-- Total -->
          ${(() => {
            const tp2 = pred.totalPick || {};
            const hasTotalPick = tp2.side && tp2.side !== "no-bet";
            const isOver = tp2.side === "over";
            const totalEdge = (tp2.edge || 0).toFixed(1);
            const border2 = hasTotalPick ? (isOver ? "rgba(16,185,129,.5)" : "rgba(239,68,68,.5)") : "var(--border)";
            const bg2    = hasTotalPick ? (isOver ? "rgba(16,185,129,.1)" : "rgba(239,68,68,.1)") : "var(--surface)";
            const c2     = hasTotalPick ? (isOver ? "var(--primary)" : "var(--danger)") : "var(--muted)";
            // O/U context
            const vegasTotal  = game.bettingLines && game.bettingLines.total;
            const modelTotal  = pred.predictedTotal;
            const totalDiff   = modelTotal && vegasTotal ? (modelTotal - vegasTotal).toFixed(1) : null;
            // Pace factor
            const hPPG = home.stats && home.stats.pointsPerGame || 0;
            const aPPG = away.stats && away.stats.pointsPerGame || 0;
            const hDef = home.stats && home.stats.pointsAllowedPerGame || 0;
            const aDef = away.stats && away.stats.pointsAllowedPerGame || 0;
            const projTotalSimple = ((hPPG + aDef) / 2) + ((aPPG + hDef) / 2);
            const isHighScoring = (hPPG + aPPG) / 2 >= 30;
            const bothGoodDef = hDef <= 20 && aDef <= 20;
            return `<div style="border-radius:12px;padding:16px;text-align:center;border:2px solid ${border2};background:${bg2}">
              <div class="text-xs text-muted mb-2" style="text-transform:uppercase;letter-spacing:.5px">Total Pick</div>
              ${hasTotalPick
                ? `<div style="font-size:1.6rem;font-weight:900;color:${c2}">${tp2.side.toUpperCase()}</div>
                   <div class="text-xs mt-1" style="color:var(--muted)">${vegasTotal ? `O/U ${vegasTotal}` : ""}${totalDiff ? ` · Model: ${modelTotal.toFixed(1)}` : ""}</div>
                   <div class="text-xs mt-1" style="color:${c2};font-weight:700">Edge: +${totalEdge} pts</div>
                   ${tp2.confidence ? `<div class="text-xs mt-1" style="color:var(--muted)">${tp2.confidence}% conf</div>` : ""}`
                : `<div style="font-size:.95rem;font-weight:700;color:var(--muted)">No Edge</div>
                   <div class="text-xs text-muted mt-1">${vegasTotal ? `O/U ${vegasTotal}` : ""}${modelTotal ? ` · Model: ${modelTotal.toFixed(1)}` : ""}</div>
                   <div class="text-xs text-muted mt-1">&lt; 3 pt edge on total</div>`}
            </div>`;
          })()}
          <!-- Score -->
          <div style="border-radius:12px;padding:16px;text-align:center;border:2px solid var(--border);background:var(--surface)">
            <div class="text-xs text-muted mb-2" style="text-transform:uppercase;letter-spacing:.5px">Projected Score</div>
            <div style="font-size:1.3rem;font-weight:900;color:var(--text)">${Math.round(homeScore)}&ndash;${Math.round(awayScore)}</div>
            <div class="text-xs text-muted mt-1">${home.abbreviation} vs ${away.abbreviation}</div>
            ${pred.predictedTotal ? `<div class="text-xs mt-1" style="color:var(--muted)">Total: <strong style="color:var(--text)">${pred.predictedTotal.toFixed(1)}</strong></div>` : ""}
          </div>
        </div>

        ${(() => {
          // O/U deep analysis section
          const vegasTotal = game.bettingLines && game.bettingLines.total;
          const modelTotal = pred.predictedTotal;
          if (!vegasTotal && !modelTotal) return "";
          const tp2 = pred.totalPick || {};
          const hasTotalPick = tp2.side && tp2.side !== "no-bet";
          const isOver = tp2.side === "over";
          // Scoring pace
          const hPPG = home.stats && home.stats.pointsPerGame || 0;
          const aPPG = away.stats && away.stats.pointsPerGame || 0;
          const hDef = home.stats && home.stats.pointsAllowedPerGame || 0;
          const aDef = away.stats && away.stats.pointsAllowedPerGame || 0;
          const hYPG = home.stats && home.stats.yardsPerGame || 0;
          const aYPG = away.stats && away.stats.yardsPerGame || 0;
          const hYAP = home.stats && home.stats.yardsAllowedPerGame || 0;
          const aYAP = away.stats && away.stats.yardsAllowedPerGame || 0;
          // Weather impact on total
          const wi = pred.weatherImpact || {};
          const wxAdj = wi.totalAdj || 0;
          // Key signals
          const factors2 = [];
          const avgOff = (hPPG + aPPG) / 2;
          const avgDef = (hDef + aDef) / 2;
          if (avgOff >= 32) factors2.push({ icon: "🔥", label: "Both offenses elite scoring", impact: "OVER", note: `Avg ${avgOff.toFixed(0)} pts/g` });
          else if (avgOff <= 22) factors2.push({ icon: "🛡", label: "Both offenses struggle to score", impact: "UNDER", note: `Avg ${avgOff.toFixed(0)} pts/g` });
          if (avgDef <= 18) factors2.push({ icon: "🛡", label: "Elite defenses on both sides", impact: "UNDER", note: `Avg ${avgDef.toFixed(0)} pts allowed/g` });
          else if (avgDef >= 30) factors2.push({ icon: "🔥", label: "Both defenses allow big scores", impact: "OVER", note: `Avg ${avgDef.toFixed(0)} pts allowed/g` });
          if (Math.abs(wxAdj) >= 2) factors2.push({ icon: "🌧", label: "Weather suppresses scoring", impact: wxAdj < 0 ? "UNDER" : "OVER", note: `${wxAdj} pt adj` });
          const isPrimetime = /pm|night|evening/i.test(game.time || "");
          if (isPrimetime && avgOff >= 28) factors2.push({ icon: "🌙", label: "Night game + two high offenses", impact: "OVER", note: "Night games average +3 pts total" });
          if (home.stats && home.stats.thirdDownPct >= 0.46 && away.stats && away.stats.thirdDownPct >= 0.46) factors2.push({ icon: "✅", label: "Both teams efficient on 3rd down", impact: "OVER", note: "Drives extend → more scoring" });
          if (home.stats && home.stats.turnoversPerGame + away.stats.turnoversPerGame >= 4) factors2.push({ icon: "💀", label: "Both teams turnover-prone", impact: "UNDER", note: "Turnovers kill drives" });
          const situational = game.situational || {};
          if (situational.rivalryGame || game.isRivalryGame) factors2.push({ icon: "⚔️", label: "Rivalry game — defenses elevate", impact: "UNDER", note: "Rivals hold 3–7 pts below avg" });
          if (!factors2.length && !hasTotalPick) return "";
          const overCnt  = factors2.filter(f => f.impact === "OVER").length;
          const underCnt = factors2.filter(f => f.impact === "UNDER").length;
          const tDiff = modelTotal && vegasTotal ? Math.abs(modelTotal - vegasTotal).toFixed(1) : null;
          return `
          <div style="margin-top:14px;padding:14px;border-radius:var(--radius);background:rgba(255,255,255,.02);border:1px solid var(--border)">
            <div style="font-size:.55rem;font-weight:900;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted);margin-bottom:10px">📊 OVER/UNDER BREAKDOWN</div>
            <div style="display:flex;gap:10px;flex-wrap:wrap;margin-bottom:10px">
              ${vegasTotal ? `<div style="padding:8px 12px;border-radius:var(--radius);background:rgba(255,255,255,.03);border:1px solid var(--border);text-align:center">
                <div style="font-size:.55rem;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--muted);margin-bottom:3px">Vegas Total</div>
                <div style="font-size:1.1rem;font-weight:900;color:var(--text)">${vegasTotal}</div>
              </div>` : ""}
              ${modelTotal ? `<div style="padding:8px 12px;border-radius:var(--radius);background:rgba(255,255,255,.03);border:1px solid var(--border);text-align:center">
                <div style="font-size:.55rem;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--muted);margin-bottom:3px">Model Projects</div>
                <div style="font-size:1.1rem;font-weight:900;color:var(--primary)">${modelTotal.toFixed(1)}</div>
              </div>` : ""}
              ${tDiff ? `<div style="padding:8px 12px;border-radius:var(--radius);background:${hasTotalPick ? (isOver ? "rgba(16,185,129,.08)" : "rgba(239,68,68,.08)") : "rgba(255,255,255,.02)"};border:1px solid ${hasTotalPick ? (isOver ? "rgba(16,185,129,.3)" : "rgba(239,68,68,.3)") : "var(--border)"};text-align:center">
                <div style="font-size:.55rem;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--muted);margin-bottom:3px">Difference</div>
                <div style="font-size:1.1rem;font-weight:900;color:${hasTotalPick ? (isOver ? "var(--primary)" : "var(--danger)") : "var(--muted)"}">${isOver ? "+" : "-"}${tDiff}</div>
              </div>` : ""}
              <div style="padding:8px 12px;border-radius:var(--radius);background:rgba(255,255,255,.03);border:1px solid var(--border);text-align:center">
                <div style="font-size:.55rem;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--muted);margin-bottom:3px">Proj. Score</div>
                <div style="font-size:.85rem;font-weight:900;color:var(--text)">${Math.round(homeScore)}–${Math.round(awayScore)}</div>
              </div>
            </div>
            ${factors2.length ? `<div style="display:flex;flex-direction:column;gap:6px">
              ${factors2.map(f => {
                const fc = f.impact === "OVER" ? "var(--primary)" : "var(--danger)";
                const fb = f.impact === "OVER" ? "rgba(16,185,129,.06)" : "rgba(239,68,68,.06)";
                return `<div style="display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:8px;background:${fb}">
                  <span style="font-size:.85rem;flex-shrink:0">${f.icon}</span>
                  <span style="flex:1;font-size:.75rem;color:var(--text-soft)">${f.label} <span style="color:var(--muted)">${f.note}</span></span>
                  <span style="font-size:.62rem;font-weight:800;letter-spacing:1px;color:${fc};background:${fb};border:1px solid ${fc}40;padding:2px 6px;border-radius:4px">${f.impact}</span>
                </div>`;
              }).join("")}
            </div>` : ""}
            ${hasTotalPick ? `<div style="margin-top:10px;padding:8px 12px;border-radius:var(--radius);background:${isOver ? "rgba(16,185,129,.08)" : "rgba(239,68,68,.08)"};border:1px solid ${isOver ? "rgba(16,185,129,.3)" : "rgba(239,68,68,.3)"};font-size:.73rem;color:var(--text-soft)">
              <strong style="color:${isOver ? "var(--primary)" : "var(--danger)"}">${isOver ? "▲ OVER" : "▼ UNDER"} ${vegasTotal || ""}:</strong>
              Model projects ${modelTotal ? modelTotal.toFixed(1) : "—"} — ${(tp2.edge || 0).toFixed(1)} pts ${isOver ? "above" : "below"} Vegas line.
              ${overCnt > underCnt ? "Multiple factors push toward a higher-scoring game." : underCnt > overCnt ? "Multiple factors favor defensive game." : "Mixed signals — edge is based primarily on scoring pace vs Vegas number."}
            </div>` : ""}
          </div>`;
        })()}
        ${adjRows.length || coachEdge ? `
        <div style="border-top:1px solid var(--border);padding-top:14px">
          <div class="text-xs text-muted mb-3" style="letter-spacing:1px;text-transform:uppercase">Line Shift Breakdown (vs Raw Model)</div>
          ${adjRows.map(r => `
            <div class="flex justify-between items-center mb-2 text-xs">
              <span style="color:var(--muted-l)">${r.label}</span>
              <div class="flex gap-3">
                <span style="color:${r.h >= 0 ? "var(--primary)" : "var(--danger)"};font-weight:700">${home.abbreviation}: ${r.h >= 0 ? "+" : ""}${r.h}</span>
                <span style="color:${r.a >= 0 ? "var(--primary)" : "var(--danger)"};font-weight:700">${away.abbreviation}: ${r.a >= 0 ? "+" : ""}${r.a}</span>
              </div>
            </div>`).join("")}
          ${coachEdge ? `
            <div class="flex justify-between items-center mb-2 text-xs">
              <span style="color:var(--muted-l)">Coaching Edge</span>
              <span style="color:var(--accent);font-weight:700">${coachEdge.winner === "home" ? home.name : coachEdge.winner === "away" ? away.name : "Neutral"} ${coachEdge.pts ? `+${coachEdge.pts} pts` : ""}</span>
            </div>
            ${coachEdge.note ? `<div class="text-xs text-muted" style="margin-top:4px;font-style:italic">${coachEdge.note}</div>` : ""}` : ""}
        </div>` : ""}
      </div>`;
  }

  /* 7 — Sharp Money Report (RIGHT column) */
  function renderSharpMoney() {
    const sm = pred.sharpMoneySignal || null;
    const si = game.socialIntel || {};
    const lmArray = si.lineMovement || [];
    const lmOpen  = lmArray.length > 0 ? lmArray[0] : null;
    const lmCur   = lmArray.length > 1 ? lmArray[lmArray.length - 1] : lmOpen;
    const hasLM   = lmArray.length >= 2;
    const lineChanged = hasLM && lmOpen && lmCur && lmOpen.spread !== lmCur.spread;
    const lineMoveDiff = lineChanged ? (lmCur.spread - lmOpen.spread) : 0;
    // Reverse line movement: public on one side, line moves other
    const pb = si.publicBetting || {};
    const pubHome = pb.homePct || 50;
    const rlmDetected = hasLM && lmOpen && lmCur && (
      (lineMoveDiff < -0.5 && pubHome < 45) ||  // line moved toward home but public on away
      (lineMoveDiff > 0.5  && pubHome > 55)      // line moved toward away but public on home
    );
    return `
      <div class="card card-p mb-5" id="section-sharp">
        <div class="section-label">Sharp Money Report</div>

        ${rlmDetected ? `
        <div style="padding:10px 14px;border-radius:var(--radius);background:rgba(239,68,68,.08);border:1px solid rgba(239,68,68,.3);margin-bottom:12px;display:flex;align-items:flex-start;gap:10px">
          <span style="font-size:1rem;flex-shrink:0">⚡</span>
          <div>
            <div style="font-size:.58rem;font-weight:900;letter-spacing:1.5px;text-transform:uppercase;color:#f87171;margin-bottom:2px">REVERSE LINE MOVEMENT ALERT</div>
            <div style="font-size:.72rem;color:var(--text-soft);line-height:1.5">
              Public betting ${pubHome < 50 ? Math.round(100-pubHome) : Math.round(pubHome)}% on ${pubHome < 50 ? home.name : away.name}
              but line moved ${lineMoveDiff < 0 ? 'toward' : 'away from'} home — sharp money is fading the public.
            </div>
          </div>
        </div>` : ""}

        ${sm && sm.side !== "neutral" ? `
          <div style="padding:14px;border-radius:var(--radius);background:${sm.side === "home" ? `${home.color}15` : `${away.color}15`};border:1px solid ${sm.side === "home" ? `${home.color}40` : `${away.color}40`};margin-bottom:14px">
            <div class="flex items-center gap-3 mb-2">
              <span class="sharp-arrow" style="color:${readableOnDark(sm.side === "home" ? home.color : away.color)}">→</span>
              <div>
                <div style="font-size:.7rem;font-weight:800;letter-spacing:1px;text-transform:uppercase;color:var(--muted)">Smart Money On</div>
                <div style="font-size:1.1rem;font-weight:900;color:var(--text)">${sm.side === "home" ? home.name : away.name}</div>
              </div>
              <div style="margin-left:auto;text-align:right">
                <div class="text-xs text-muted">Strength</div>
                <div style="font-size:.85rem;font-weight:700;color:${readableOnDark(sm.side === "home" ? home.color : away.color)}">${strengIcon(sm.strength)} ${sm.strength || "—"}</div>
              </div>
            </div>
            ${sm.note ? `<div class="text-xs text-muted" style="font-style:italic;line-height:1.5">${sm.note}</div>` : ""}
          </div>` : `
          <div style="padding:12px;border-radius:var(--radius);background:var(--surface);border:1px solid var(--border);margin-bottom:14px;text-align:center">
            <div style="color:var(--muted);font-size:.82rem">No significant sharp money detected — monitor for late movement</div>
          </div>`}

        ${hasLM ? `
          <div class="text-xs text-muted mb-2" style="letter-spacing:1px;text-transform:uppercase">Line Movement History</div>
          <div style="display:flex;justify-content:space-between;font-size:.78rem;margin-bottom:6px">
            <span style="color:var(--muted-l)">Open: <strong style="color:var(--text)">${lmOpen ? fmtSpread(lmOpen.spread) : "—"}</strong></span>
            <span style="color:var(--muted-l)">Current: <strong style="color:${lineChanged ? "var(--primary)" : "var(--text)"}">${lmCur ? fmtSpread(lmCur.spread) : "—"}</strong>
              ${lineChanged ? `<span style="font-size:.6rem;color:${lineMoveDiff < 0 ? "var(--primary)" : "var(--danger)"}"> (${lineMoveDiff > 0 ? "+" : ""}${lineMoveDiff.toFixed(1)})</span>` : ""}
            </span>
          </div>
          ${(() => {
            // Sparkline SVG of spread history
            if (lmArray.length < 2) return "";
            const W = 280, H = 44, PAD = 4;
            const spreads = lmArray.map(h => h.spread);
            const minS = Math.min(...spreads) - 0.5;
            const maxS = Math.max(...spreads) + 0.5;
            const range = maxS - minS || 1;
            const pts = spreads.map((s, i) => {
              const x = PAD + (i / (spreads.length - 1)) * (W - PAD*2);
              const y = PAD + ((maxS - s) / range) * (H - PAD*2);
              return x.toFixed(1) + "," + y.toFixed(1);
            });
            const polyline = pts.join(" ");
            const trend = spreads[spreads.length-1] - spreads[0];
            const trendColor = trend < -0.1 ? "#10b981" : trend > 0.1 ? "#6366f1" : "#555";
            return `<div style="margin-bottom:10px;padding:8px;border-radius:8px;background:rgba(255,255,255,.02);border:1px solid var(--border)">
              <div style="font-size:.55rem;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--muted);margin-bottom:4px">Spread Trend</div>
              <svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" style="overflow:visible;display:block;width:100%;max-width:${W}px">
                <polyline points="${polyline}" fill="none" stroke="${trendColor}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                ${pts.map((pt, i) => {
                  const [x, y] = pt.split(",");
                  return `<circle cx="${x}" cy="${y}" r="3" fill="${i === pts.length-1 ? trendColor : "#555"}" opacity="${i === pts.length-1 ? 1 : 0.5}"/>`;
                }).join("")}
              </svg>
              <div style="display:flex;justify-content:space-between;font-size:.58rem;color:var(--muted);margin-top:2px">
                <span>${lmArray[0].time || "Open"}</span>
                <span>${lmArray[lmArray.length-1].time || "Current"}</span>
              </div>
            </div>`;
          })()}
          ${lineChanged ? `
          <div class="line-move-track" style="height:6px;background:var(--border);border-radius:3px;position:relative;margin:8px 0">
            <div style="height:6px;border-radius:3px;background:linear-gradient(90deg,var(--accent),var(--primary));width:${Math.min(100, Math.abs(lineMoveDiff) * 20)}%;${lineMoveDiff > 0 ? "margin-left:auto" : ""}"></div>
          </div>` : ""}
          <div style="margin-top:10px;display:flex;flex-direction:column;gap:6px">
            ${lmArray.map(h => `
              <div style="display:flex;justify-content:space-between;align-items:flex-start;padding:7px 10px;border-radius:6px;background:rgba(255,255,255,.02);border:1px solid var(--border)">
                <span style="font-size:.65rem;font-weight:700;color:var(--muted-l)">${esc(h.time || "")}</span>
                <div style="text-align:right">
                  <div style="font-size:.7rem;font-weight:800;color:var(--text)">${fmtSpread(h.spread)} &nbsp; <span style="color:var(--muted)">O/U ${h.total || "—"}</span></div>
                  ${h.note ? `<div style="font-size:.58rem;color:var(--muted);line-height:1.4;max-width:220px;margin-top:2px">${esc(h.note)}</div>` : ""}
                </div>
              </div>`).join("")}
          </div>` : `
          <div style="font-size:.72rem;color:var(--muted);padding:8px 0">Line data not yet available for this game.</div>`}

        <!-- Public % breakdown -->
        ${lm && (lm.homeTickets !== undefined || lm.homeMoney !== undefined) ? `
          <hr class="sec-divider" />
          <div class="text-xs text-muted mb-3" style="letter-spacing:1px;text-transform:uppercase">Public Betting %</div>
          ${lm.homeTickets !== undefined ? `
            <div class="text-xs text-muted mb-1">Ticket Split</div>
            <div style="display:flex;height:16px;border-radius:8px;overflow:hidden;margin-bottom:6px">
              <div style="width:${lm.homeTickets}%;background:${home.color};display:flex;align-items:center;justify-content:center;font-size:.6rem;font-weight:700;color:#fff">${lm.homeTickets}%</div>
              <div style="width:${100 - lm.homeTickets}%;background:${away.color};display:flex;align-items:center;justify-content:center;font-size:.6rem;font-weight:700;color:#fff">${100 - lm.homeTickets}%</div>
            </div>
            <div class="flex justify-between text-xxs text-muted mb-2"><span>${home.abbreviation}</span><span>${away.abbreviation}</span></div>` : ""}
          ${lm.homeMoney !== undefined ? `
            <div class="text-xs text-muted mb-1">Money Split</div>
            <div style="display:flex;height:16px;border-radius:8px;overflow:hidden;margin-bottom:6px">
              <div style="width:${lm.homeMoney}%;background:${home.color}cc;display:flex;align-items:center;justify-content:center;font-size:.6rem;font-weight:700;color:#fff">${lm.homeMoney}%</div>
              <div style="width:${100 - lm.homeMoney}%;background:${away.color}cc;display:flex;align-items:center;justify-content:center;font-size:.6rem;font-weight:700;color:#fff">${100 - lm.homeMoney}%</div>
            </div>
            <div class="flex justify-between text-xxs text-muted"><span>${home.abbreviation}</span><span>${away.abbreviation}</span></div>` : ""}` : ""}

        <!-- Smart money summary -->
        ${sm ? `
          <hr class="sec-divider" />
          <div style="padding:10px;border-radius:var(--radius);background:rgba(16,185,129,.06);border:1px solid rgba(16,185,129,.2)">
            <div class="text-xs text-muted mb-1" style="font-weight:700;letter-spacing:1px">SMART MONEY SAYS...</div>
            <div class="text-xs" style="color:var(--text-soft);line-height:1.55">
              Fade the public and follow the sharp action on <strong style="color:${sm.side === "home" ? home.color : away.color}">${sm.side === "home" ? home.name : sm.side === "away" ? away.name : "—"}</strong>.
              ${sm.note || "Professionals are positioning themselves with conviction."}
            </div>
          </div>` : ""}
      </div>`;
  }

  /* 8 — Weather Intel (RIGHT column) */
  function renderWeather() {
    const wx = game.weather || null;
    const wi = pred.weatherImpact || null;
    const homeWp = safe(() => home.weatherProfile, null);
    const awayWp = safe(() => away.weatherProfile, null);

    if (!wx && !wi) return "";

    const tempF = wx ? wx.tempF : null;
    const windMph = wx ? wx.windMph : null;
    const humidity = wx ? wx.humidity : null;
    const condition = wx ? wx.condition : "Clear";
    const indoors = wx ? wx.indoors : false;

    const condEmoji = indoors ? "🏟️"
      : condition && condition.toLowerCase().includes("snow") ? "❄️"
      : condition && condition.toLowerCase().includes("rain") ? "🌧️"
      : windMph >= 20 ? "💨"
      : tempF >= 88 ? "🌡️"
      : tempF <= 38 ? "🥶"
      : "☀️";

    const wxImpactColor = wi && Math.abs(wi.totalAdj||0) >= 3 ? "var(--danger)" : wi && Math.abs(wi.totalAdj||0) >= 1 ? "var(--gold)" : "var(--primary)";

    return `
      <div class="card card-p mb-5" id="section-weather">
        <div class="section-label">Weather Intel</div>
        ${wx ? `
          <div style="display:grid;grid-template-columns:repeat(${indoors?1:3},1fr);gap:8px;margin-bottom:12px">
            ${indoors ? `
              <div style="text-align:center;padding:14px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius)">
                <div style="font-size:1.5rem">🏟️</div>
                <div style="font-size:.95rem;font-weight:800;color:var(--text);margin-top:4px">Dome Game</div>
                <div class="text-xs text-muted">Weather not a factor</div>
              </div>` : `
              <div style="text-align:center;padding:10px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius)">
                <div style="font-size:1.2rem">${condEmoji}</div>
                <div style="font-size:1.1rem;font-weight:800;color:var(--text);margin-top:4px">${tempF !== null ? tempF + "°F" : "—"}</div>
                <div class="text-xs text-muted">${condition || "Clear"}</div>
              </div>
              <div style="text-align:center;padding:10px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius)">
                <div style="font-size:1.2rem">💨</div>
                <div style="font-size:1.1rem;font-weight:800;color:var(--text);margin-top:4px">${windMph !== null ? windMph + " mph" : "—"}</div>
                <div class="text-xs text-muted">Wind</div>
              </div>
              <div style="text-align:center;padding:10px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius)">
                <div style="font-size:1.2rem">💧</div>
                <div style="font-size:1.1rem;font-weight:800;color:var(--text);margin-top:4px">${humidity !== null ? humidity + "%" : "—"}</div>
                <div class="text-xs text-muted">Humidity</div>
              </div>`}
          </div>` : ""}
        ${wi && (Math.abs(wi.totalAdj||0) > 0.1 || wi.note) ? `
          <div style="padding:12px;background:rgba(239,68,68,.05);border:1px solid rgba(239,68,68,.2);border-radius:var(--radius);margin-bottom:10px">
            <div style="font-size:.65rem;font-weight:900;letter-spacing:1.5px;color:var(--danger);text-transform:uppercase;margin-bottom:8px">Weather Impact on Scoring</div>
            <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:8px">
              <div style="text-align:center">
                <div style="font-size:.58rem;color:var(--muted);font-weight:700;text-transform:uppercase;margin-bottom:2px">Total Adj</div>
                <div style="font-size:1rem;font-weight:900;color:${(wi.totalAdj||0) < 0 ? "var(--danger)" : "var(--primary)"}">${(wi.totalAdj||0) >= 0 ? "+" : ""}${wi.totalAdj||0}</div>
              </div>
              <div style="text-align:center">
                <div style="font-size:.58rem;color:var(--muted);font-weight:700;text-transform:uppercase;margin-bottom:2px">${home.abbreviation} Adj</div>
                <div style="font-size:1rem;font-weight:900;color:${(wi.homeAdj||0) < 0 ? "var(--danger)" : "var(--primary)"}">${(wi.homeAdj||0) >= 0 ? "+" : ""}${wi.homeAdj||0}</div>
              </div>
              <div style="text-align:center">
                <div style="font-size:.58rem;color:var(--muted);font-weight:700;text-transform:uppercase;margin-bottom:2px">${away.abbreviation} Adj</div>
                <div style="font-size:1rem;font-weight:900;color:${(wi.awayAdj||0) < 0 ? "var(--danger)" : "var(--primary)"}">${(wi.awayAdj||0) >= 0 ? "+" : ""}${wi.awayAdj||0}</div>
              </div>
            </div>
            ${wi.note ? `<div class="text-xs text-muted" style="font-style:italic;border-top:1px solid rgba(239,68,68,.15);padding-top:8px">${wi.note}</div>` : ""}
            ${(() => {
              const ta = wi.totalAdj || 0;
              const ha = wi.homeAdj || 0;
              const aa = wi.awayAdj || 0;
              const msgs = [];
              if (Math.abs(ta) >= 4) msgs.push(`<strong>Total:</strong> Extreme weather is worth ~${Math.abs(ta)} pts — lean heavily ${ta < 0 ? "UNDER" : "OVER"} if you're playing the total.`);
              else if (Math.abs(ta) >= 2) msgs.push(`<strong>Total:</strong> Weather shaves ~${Math.abs(ta)} pts off scoring — modest ${ta < 0 ? "UNDER" : "OVER"} lean.`);
              if (Math.abs(ha) >= 2 && ha < aa) msgs.push(`<strong>Spread:</strong> Weather hurts ${home.abbreviation} offense more (${ha} vs ${aa} adj) — slight edge to ${away.abbreviation} covers.`);
              else if (Math.abs(aa) >= 2 && aa < ha) msgs.push(`<strong>Spread:</strong> Weather hurts ${away.abbreviation} more (${aa} vs ${ha} adj) — slight edge to ${home.abbreviation} covers.`);
              if (!msgs.length) return "";
              return `<div style="margin-top:8px;padding:8px 10px;border-radius:6px;background:rgba(239,68,68,.06);font-size:.72rem;color:var(--text-soft);line-height:1.55">
                🎯 <strong style="color:var(--text)">Betting Implication:</strong> ${msgs.join(" ")}
              </div>`;
            })()}
          </div>` : `
          <div style="padding:10px;background:rgba(16,185,129,.05);border:1px solid rgba(16,185,129,.15);border-radius:var(--radius);margin-bottom:10px">
            <div class="text-xs text-muted" style="font-style:italic">Weather conditions are favorable — no significant impact on scoring projections.</div>
          </div>`}
        ${(homeWp || awayWp) && !indoors ? `
          <div class="text-xs" style="color:var(--muted-l);font-weight:700;letter-spacing:1px;text-transform:uppercase;margin-bottom:6px">Team Weather Profiles</div>
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">
            ${homeWp ? `
              <div style="padding:8px;background:var(--surface);border:1px solid ${home.color}30;border-radius:var(--radius)">
                <div class="text-xs text-muted mb-1">${home.abbreviation}</div>
                <div class="text-xs" style="color:var(--text-soft)">${homeWp.coldWeatherRecord || homeWp.rainRecord || "Standard profile"}</div>
              </div>` : ""}
            ${awayWp ? `
              <div style="padding:8px;background:var(--surface);border:1px solid ${away.color}30;border-radius:var(--radius)">
                <div class="text-xs text-muted mb-1">${away.abbreviation}</div>
                <div class="text-xs" style="color:var(--text-soft)">${awayWp.coldWeatherRecord || awayWp.rainRecord || "Standard profile"}</div>
              </div>` : ""}
          </div>` : ""}
      </div>`;
  }

  /* 9 — Situational Analysis (RIGHT column) */
  function renderSituational() {
    const sitG  = game.situational || null;
    const sitH  = safe(() => home.situational, null);
    const sitA  = safe(() => away.situational, null);
    const hAts  = safe(() => home.atsRecord, null);
    const aAts  = safe(() => away.atsRecord, null);
    const hSch  = safe(() => home.schedule, null);
    const aSch  = safe(() => away.schedule, null);
    const trap  = safe(() => sitG && sitG.trapGameRating, null) || (pred.trapGameAlert ? 7 : 3);

    return `
      <div class="card card-p mb-5" id="section-situational">
        <div class="section-label">Situational Analysis</div>

        <!-- Trap game meter -->
        <div style="margin-bottom:14px">
          <div class="flex justify-between text-xs mb-2">
            <span class="text-muted">Trap Game Risk</span>
            <span style="font-weight:800;color:${trap >= 7 ? "var(--danger)" : trap >= 5 ? "var(--gold)" : "var(--primary)"}">${trap}/10</span>
          </div>
          <div style="height:12px;border-radius:6px;overflow:hidden;position:relative;background:linear-gradient(90deg,#22c55e,#f59e0b 40%,#ef4444 80%,#991b1b)">
            <div style="position:absolute;top:-3px;left:${(trap / 10) * 100}%;transform:translateX(-50%);width:4px;height:18px;background:#fff;border-radius:2px;box-shadow:0 0 6px rgba(0,0,0,.5)"></div>
          </div>
          <div class="flex justify-between text-xxs text-muted mt-1"><span>Low</span><span>Moderate</span><span>High</span></div>
        </div>

        ${sitG || sitH || sitA ? `
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px">
          ${sitH && sitH.emotionalSpot ? `
            <div style="padding:10px;background:${home.color}10;border:1px solid ${home.color}30;border-radius:var(--radius)">
              <div class="text-xs text-muted mb-1">${home.abbreviation} Emotional Spot</div>
              <div class="text-xs" style="color:var(--text-soft);font-weight:600">${sitH.emotionalSpot}</div>
            </div>` : ""}
          ${sitA && sitA.emotionalSpot ? `
            <div style="padding:10px;background:${away.color}10;border:1px solid ${away.color}30;border-radius:var(--radius)">
              <div class="text-xs text-muted mb-1">${away.abbreviation} Emotional Spot</div>
              <div class="text-xs" style="color:var(--text-soft);font-weight:600">${sitA.emotionalSpot}</div>
            </div>` : ""}
        </div>` : ""}

        ${sitG && (sitG.awayTravelMiles !== undefined || sitG.timeZoneShift !== undefined) ? `
          <div style="padding:10px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);margin-bottom:10px">
            <div class="text-xs text-muted mb-2" style="font-weight:700">✈️ Travel Burden</div>
            ${sitG.awayTravelMiles !== undefined ? `<div class="flex justify-between text-xs mb-1"><span class="text-muted">Away travel</span><span style="color:var(--text-soft)">${sitG.awayTravelMiles.toLocaleString()} miles</span></div>` : ""}
            ${sitG.timeZoneShift !== undefined ? `<div class="flex justify-between text-xs mb-1"><span class="text-muted">Time zone shift</span><span style="color:${Math.abs(sitG.timeZoneShift) >= 2 ? "var(--gold)" : "var(--text-soft)"}">${sitG.timeZoneShift >= 0 ? "+" : ""}${sitG.timeZoneShift} hrs</span></div>` : ""}
          </div>` : ""}

        ${sitG && (sitG.homeRestDays !== undefined || sitG.awayRestDays !== undefined) ? `
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px">
            ${sitG.homeRestDays !== undefined ? `
              <div style="text-align:center;padding:8px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius)">
                <div class="text-xs text-muted">Home Rest</div>
                <div style="font-size:1.3rem;font-weight:900;color:${sitG.homeRestDays >= 10 ? "var(--primary)" : sitG.homeRestDays <= 6 ? "var(--danger)" : "var(--text)"}">${sitG.homeRestDays}d</div>
              </div>` : ""}
            ${sitG.awayRestDays !== undefined ? `
              <div style="text-align:center;padding:8px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius)">
                <div class="text-xs text-muted">Away Rest</div>
                <div style="font-size:1.3rem;font-weight:900;color:${sitG.awayRestDays >= 10 ? "var(--primary)" : sitG.awayRestDays <= 6 ? "var(--danger)" : "var(--text)"}">${sitG.awayRestDays}d</div>
              </div>` : ""}
          </div>` : ""}

        ${sitG && sitG.rivalryGame ? `
          <div style="padding:8px 12px;border-radius:var(--radius);background:rgba(245,158,11,.08);border:1px solid rgba(245,158,11,.25);margin-bottom:10px;font-size:.78rem;color:var(--gold);font-weight:700">
            ⚔️ RIVALRY GAME — Historical emotions run high, records go out the window
          </div>` : ""}

        <!-- ATS Records in situation -->
        ${hAts || aAts ? `
          <div class="text-xs text-muted mb-2" style="letter-spacing:1px;text-transform:uppercase">Situational ATS Records</div>
          <div style="display:grid;gap:6px">
            ${hAts ? Object.entries(hAts).slice(0, 4).map(([k, v]) => `
              <div class="flex justify-between text-xs">
                <span class="text-muted">${home.abbreviation} ${k.replace(/([A-Z])/g, " $1").replace(/_/g, " ")}</span>
                <span style="font-weight:700;color:${(parseInt(v) > 0.5 || (v && v.toString().startsWith("+") )) ? "var(--primary)" : "var(--muted)"}">${v}</span>
              </div>`).join("") : ""}
            ${aAts ? Object.entries(aAts).slice(0, 4).map(([k, v]) => `
              <div class="flex justify-between text-xs">
                <span class="text-muted">${away.abbreviation} ${k.replace(/([A-Z])/g, " $1").replace(/_/g, " ")}</span>
                <span style="font-weight:700;color:${(parseInt(v) > 0.5 || (v && v.toString().startsWith("+"))) ? "var(--primary)" : "var(--muted)"}">${v}</span>
              </div>`).join("") : ""}
          </div>` : ""}
      </div>`;
  }

  /* 10 — Player Intelligence (LEFT column) */
  function renderPlayerIntelligence() {
    if (!allPlayers.length) return "";

    function playerCard(p) {
      const teamColor = p.teamId === home.id ? home.color : away.color;
      const teamName  = p.teamId === home.id ? home.name  : away.name;
      const teamAbbr  = p.teamId === home.id ? home.abbreviation : away.abbreviation;
      const pm  = p.performanceMetrics || null;
      const pf  = p.personalFlags || null;
      const ih  = p.injuryHistory || null;
      const sr  = p.scoutReport || null;
      const ps  = p.practiceStatus || null;
      const hw  = p.heightWeight || null;
      const ht  = p.hometown || null;
      const nfl = p.nflDraftStatus || null;
      const nil = p.nilSatisfaction || null;

      const distLevel = pf ? (pf.distractionLevel || 0) : 0;
      const distColor = distLevel <= 3 ? "var(--primary)" : distLevel <= 6 ? "var(--gold)" : distLevel <= 8 ? "#f97316" : "var(--danger)";

      return `
        <div style="background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:16px;cursor:pointer" onclick="togglePlayerCard('pc-${p.id}')">
          <!-- Header — always visible -->
          <div class="flex items-center gap-3" style="margin-bottom:0">
            <div class="player-avatar" style="background:${teamColor};width:44px;height:44px;font-size:.85rem">#${p.number || "—"}</div>
            <div style="flex:1">
              <div style="font-size:1rem;font-weight:800;color:var(--text)">${p.name}</div>
              <div class="text-xs text-muted">${p.position} · ${p.year || "—"} · ${teamName}</div>
              ${hw ? `<div class="text-xs text-muted">${hw}</div>` : ""}
              ${ht ? `<div class="text-xs text-muted">📍 ${ht}</div>` : ""}
            </div>
            <div style="text-align:right">
              ${p.injuryStatus && p.injuryStatus !== "healthy"
                ? `<span class="badge badge-danger">${p.injuryStatus.toUpperCase()}</span>
                   ${(() => { const w = whyNotActive(p); return w ? `<div class="text-xxs" style="color:#f87171;margin-top:3px;font-weight:700">${w}</div>` : ""; })()}`
                : '<span class="badge badge-ok">ACTIVE</span>'}
              ${ps ? `<div class="text-xxs text-muted mt-1">${ps}</div>` : ""}
            </div>
            <span id="pc-${p.id}-chev" style="font-size:.85rem;color:var(--muted);margin-left:6px;flex-shrink:0">▸</span>
          </div>

          <!-- Expandable detail — collapsed by default -->
          <div id="pc-${p.id}" style="display:none;margin-top:12px">

          ${nfl ? `<div style="margin-bottom:10px"><span style="font-size:.65rem;font-weight:800;letter-spacing:1px;text-transform:uppercase;padding:3px 8px;border-radius:10px;border:1px solid rgba(245,158,11,.4);background:rgba(245,158,11,.1);color:var(--gold)">🏆 ${nfl}</span></div>` : ""}

          <!-- Injury history timeline -->
          ${ih && ih.length ? `
            <div style="margin-bottom:12px;padding:10px;background:rgba(239,68,68,.05);border:1px solid rgba(239,68,68,.15);border-radius:var(--radius)">
              <div class="text-xs text-muted mb-2" style="font-weight:700;letter-spacing:1px">INJURY HISTORY</div>
              ${ih.map(ev => `
                <div class="timeline-item">
                  <div class="tl-dot" style="background:${ev.impact === "high" ? "var(--danger)" : ev.impact === "medium" ? "var(--gold)" : "var(--muted)"}"></div>
                  <div>
                    <span style="color:var(--muted-l);font-weight:600">${ev.year || ""} ${ev.type || ""}</span>
                    ${ev.impact ? `<span style="margin-left:6px;font-size:.65rem;font-weight:700;text-transform:uppercase;color:${ev.impact === "high" ? "var(--danger)" : ev.impact === "medium" ? "var(--gold)" : "var(--muted)"}">[${ev.impact}]</span>` : ""}
                    ${ev.note ? `<div style="font-size:.72rem;color:var(--muted);margin-top:1px">${ev.note}</div>` : ""}
                  </div>
                </div>`).join("")}
            </div>` : ""}

          <!-- Personal flags / Insider intel -->
          ${pf ? `
            <div class="insider-intel-box mb-3" style="margin-top:4px">
              <div style="margin-top:6px">
                ${pf.distractionType ? `<div class="flex items-center gap-2 mb-2"><span style="font-size:.65rem;font-weight:800;letter-spacing:1px;padding:2px 8px;border-radius:8px;border:1px solid rgba(239,68,68,.35);background:rgba(239,68,68,.1);color:#f87171;text-transform:uppercase">${pf.distractionType}</span></div>` : ""}
                ${distLevel > 0 ? `
                  <div class="flex items-center gap-2 mb-2">
                    <span class="text-xs text-muted" style="width:100px;flex-shrink:0">Distraction ${distLevel}/10</span>
                    <div style="flex:1;height:6px;background:var(--border);border-radius:3px;overflow:hidden">
                      <div style="width:${distLevel * 10}%;height:100%;border-radius:3px;background:${distColor}"></div>
                    </div>
                  </div>` : ""}
                ${pf.distractionNote ? `<div class="text-xs" style="color:var(--text-soft);line-height:1.55;font-style:italic">"${pf.distractionNote}"</div>` : ""}
                ${pf.socialMediaPattern ? `<div class="text-xxs text-muted mt-2">Social chatter: <strong style="color:var(--muted-l)">${pf.socialMediaPattern}</strong></div>` : ""}
              </div>
            </div>` : ""}

          <!-- Performance metrics radar -->
          ${pm ? `
            <div style="margin-bottom:12px">
              <div class="text-xs text-muted mb-2" style="letter-spacing:1px;text-transform:uppercase">Performance Metrics</div>
              ${pm.clutchRating      !== undefined ? radarBar("Clutch",      pm.clutchRating,      "#f59e0b") : ""}
              ${pm.bigGameRating     !== undefined ? radarBar("Big Game",    pm.bigGameRating,     "#f97316") : ""}
              ${pm.coldWeatherRating !== undefined ? radarBar("Cold Wx",     pm.coldWeatherRating, "#38bdf8") : ""}
              ${pm.roadGameRating    !== undefined ? radarBar("Road",        pm.roadGameRating,    "#a78bfa") : ""}
              ${pm.primeTimeRating   !== undefined ? radarBar("Primetime",   pm.primeTimeRating,   "#ec4899") : ""}
              ${pm.consistencyRating !== undefined ? radarBar("Consistency", pm.consistencyRating, "var(--primary)") : ""}
              ${pm.pressureRating    !== undefined ? radarBar("Pressure",    pm.pressureRating,    "var(--gold)") : ""}
            </div>` : ""}

          <!-- Season stats -->
          ${p.stats ? `
            <div style="display:grid;grid-template-columns:repeat(2,1fr);gap:4px 12px;font-size:.72rem;margin-bottom:12px;padding:10px;background:var(--card);border:1px solid var(--border);border-radius:var(--radius)">
              ${p.stats.passingYards  !== undefined ? `<div class="flex justify-between"><span class="text-muted">Pass Yds</span><span style="font-weight:700;color:var(--text)">${p.stats.passingYards}</span></div>` : ""}
              ${p.stats.passingTDs    !== undefined ? `<div class="flex justify-between"><span class="text-muted">Pass TDs</span><span style="font-weight:700;color:var(--text)">${p.stats.passingTDs}</span></div>` : ""}
              ${p.stats.interceptions !== undefined ? `<div class="flex justify-between"><span class="text-muted">INT</span><span style="font-weight:700;color:${p.stats.interceptions > 8 ? "var(--danger)" : "var(--text)"}">${p.stats.interceptions}</span></div>` : ""}
              ${p.stats.completionPct !== undefined ? `<div class="flex justify-between"><span class="text-muted">Comp%</span><span style="font-weight:700;color:var(--text)">${p.stats.completionPct}%</span></div>` : ""}
              ${p.stats.qbr          !== undefined ? `<div class="flex justify-between"><span class="text-muted">QBR</span><span style="font-weight:700;color:var(--primary)">${p.stats.qbr}</span></div>` : ""}
              ${p.stats.rushingYards  !== undefined ? `<div class="flex justify-between"><span class="text-muted">Rush Yds</span><span style="font-weight:700;color:var(--text)">${p.stats.rushingYards}</span></div>` : ""}
              ${p.stats.rushingTDs    !== undefined ? `<div class="flex justify-between"><span class="text-muted">Rush TDs</span><span style="font-weight:700;color:var(--text)">${p.stats.rushingTDs}</span></div>` : ""}
              ${p.stats.receivingYards!== undefined ? `<div class="flex justify-between"><span class="text-muted">Rec Yds</span><span style="font-weight:700;color:var(--text)">${p.stats.receivingYards}</span></div>` : ""}
              ${p.stats.receptions    !== undefined ? `<div class="flex justify-between"><span class="text-muted">Receptions</span><span style="font-weight:700;color:var(--text)">${p.stats.receptions}</span></div>` : ""}
              ${p.stats.tackles       !== undefined ? `<div class="flex justify-between"><span class="text-muted">Tackles</span><span style="font-weight:700;color:var(--text)">${p.stats.tackles}</span></div>` : ""}
              ${p.stats.sacks         !== undefined ? `<div class="flex justify-between"><span class="text-muted">Sacks</span><span style="font-weight:700;color:var(--text)">${p.stats.sacks}</span></div>` : ""}
              ${p.stats.interceptionsDef !== undefined ? `<div class="flex justify-between"><span class="text-muted">INT (Def)</span><span style="font-weight:700;color:var(--primary)">${p.stats.interceptionsDef}</span></div>` : ""}
            </div>` : ""}

          <!-- Scout report -->
          ${sr ? `
            <div style="padding:10px 12px;border-radius:var(--radius);background:rgba(99,102,241,.06);border:1px solid rgba(99,102,241,.2);position:relative;margin-bottom:10px">
              <div style="position:absolute;top:-1px;left:12px;font-size:.6rem;font-weight:800;letter-spacing:1.5px;text-transform:uppercase;color:var(--accent);background:var(--surface);padding:0 6px;transform:translateY(-50%)">SCOUT REPORT</div>
              <div style="font-size:.78rem;color:var(--text-soft);line-height:1.6;margin-top:4px;font-style:italic">"${typeof sr === "string" ? sr : sr.summary || ""}"</div>
              ${sr.grade ? `<div class="text-xs text-muted mt-2">Grade: <strong style="color:var(--accent)">${sr.grade}</strong></div>` : ""}
            </div>` : ""}

          <!-- NIL satisfaction -->
          ${nil !== null && nil !== undefined ? `
            <div class="flex items-center gap-2">
              <span class="text-xs text-muted">NIL Satisfaction:</span>
              <div style="flex:1;height:5px;background:var(--border);border-radius:3px;overflow:hidden">
                <div style="width:${nil}%;height:100%;border-radius:3px;background:${nil >= 70 ? "var(--primary)" : nil >= 40 ? "var(--gold)" : "var(--danger)"}"></div>
              </div>
              <span class="text-xs" style="font-weight:700;color:${nil >= 70 ? "var(--primary)" : nil >= 40 ? "var(--gold)" : "var(--danger)"}">${nil}/100</span>
            </div>` : ""}
          </div><!-- /expandable -->
        </div>`;
    }

    return `
      <div class="card card-p mb-5">
        <div class="section-label">Player Intelligence <span style="font-size:.65rem;color:var(--muted);font-weight:400">· tap any card to expand</span></div>
        <div class="player-exp-grid">
          ${allPlayers.map(p => playerCard(p)).join("")}
        </div>
      </div>`;
  }

  /* 11 — Prediction Factors (LEFT, enhanced) */
  function renderFactors() {
    return `
      <div class="card card-p mb-5">
        <div class="section-label">Prediction Factors</div>
        ${(pred.factors || []).map(f => `
          <div class="factor">
            <div class="factor-top">
              <div class="factor-name">
                <span style="color:${fColor(f.impact)};margin-right:6px;font-size:1rem">${fIcon(f.impact)}</span>${f.name}
              </div>
              <div class="factor-meta">
                ${f.favoredTeam && f.favoredTeam !== "neither"
                  ? `<span style="font-size:.72rem;padding:2px 8px;border-radius:12px;border:1px solid ${(f.favoredTeam === "home" ? home.color : away.color) + "50"};background:${(f.favoredTeam === "home" ? home.color : away.color) + "18"};color:${f.favoredTeam === "home" ? home.color : away.color}">${f.favoredTeam === "home" ? home.abbreviation : away.abbreviation}</span>`
                  : ""}
                <span class="text-xs text-muted">Mag: ${f.magnitude}/10</span>
              </div>
            </div>
            <div class="factor-desc">${f.description}</div>
            <div style="display:flex;align-items:center;gap:8px">
              <div class="factor-bar" style="flex:1"><div class="factor-bar-fill" style="width:${(f.magnitude || 0) * 10}%;background:${fColor(f.impact)}"></div></div>
              <span style="font-size:.68rem;font-weight:700;color:${fColor(f.impact)}">${(f.magnitude || 0) * 10}%</span>
            </div>
          </div>`).join("")}
      </div>`;
  }

  /* 12 — Head-to-Head Stats (LEFT) */
  function renderStats() {
    return `
      <div class="card card-p mb-5">
        <div class="section-label">Head-to-Head Stats <span style="font-size:.65rem;color:var(--muted);font-weight:400">(2025 — prediction basis)</span></div>
        <div class="flex justify-between text-xs text-muted mb-4">
          <div class="flex items-center gap-2"><div style="width:10px;height:10px;border-radius:50%;background:${home.color}"></div>${home.name}</div>
          <div class="flex items-center gap-2">${away.name}<div style="width:10px;height:10px;border-radius:50%;background:${away.color}"></div></div>
        </div>
        ${statRows.map(row => {
          const hWins = row.hib ? row.hv > row.av : row.hv < row.av;
          const aWins = row.hib ? row.av > row.hv : row.av < row.hv;
          const mx = Math.max(Math.abs(row.hv), Math.abs(row.av), 1);
          const hp = Math.min(100, Math.abs(row.hv) / mx * 100);
          const ap = Math.min(100, Math.abs(row.av) / mx * 100);
          return `
            <div class="stat-comp-row">
              <div class="stat-comp-labels">
                <span style="color:${hWins ? home.color : "var(--muted)"};font-weight:${hWins ? "700" : "400"}">${row.fmt(row.hv)}</span>
                <span class="text-muted">${row.label}</span>
                <span style="color:${aWins ? away.color : "var(--muted)"};font-weight:${aWins ? "700" : "400"}">${row.fmt(row.av)}</span>
              </div>
              <div class="stat-comp-bars">
                <div class="stat-comp-bar-l"><div class="stat-comp-fill" style="width:${hp}%;background:${hWins ? home.color : "#334155"}"></div></div>
                <div class="stat-comp-bar-r"><div class="stat-comp-fill" style="width:${ap}%;background:${aWins ? away.color : "#334155"}"></div></div>
              </div>
            </div>`;
        }).join("")}
      </div>`;
  }

  /* 13 — Vegas Lines vs Model (LEFT) */
  function renderVegas() {
    if (!game.bettingLines) return "";
    const bl = game.bettingLines;
    const composite = pred.compositeScore || null;
    return `
      <div class="card card-p mb-5">
        <div class="section-label">Vegas Lines vs Model</div>
        <div class="vegas-grid">
          <div class="vegas-cell">
            <div class="vegas-label">Vegas Spread</div>
            <div class="vegas-val">${fmtSpread(bl.spread)}</div>
            <div class="vegas-sub">${bl.spread < 0 ? home.abbreviation : away.abbreviation} favored</div>
          </div>
          <div class="vegas-cell">
            <div class="vegas-label">Model Spread</div>
            <div class="vegas-val" style="color:var(--accent)">${fmtSpread(-pred.predictedSpread)}</div>
            <div class="vegas-sub">${pred.predictedSpread >= 0 ? home.abbreviation : away.abbreviation} favored</div>
          </div>
          <div class="vegas-cell">
            <div class="vegas-label">Vegas Total</div>
            <div class="vegas-val">${bl.total}</div>
            <div class="vegas-sub">${bl.provider}</div>
          </div>
          <div class="vegas-cell">
            <div class="vegas-label">Model Total</div>
            <div class="vegas-val" style="color:var(--accent)">${pred.predictedTotal ? pred.predictedTotal.toFixed(1) : "—"}</div>
            <div class="vegas-sub">${pred.predictedTotal && pred.predictedTotal > bl.total ? `+${(pred.predictedTotal - bl.total).toFixed(1)} over` : pred.predictedTotal ? `${(pred.predictedTotal - bl.total).toFixed(1)} under` : "—"}</div>
          </div>
        </div>
        <div class="ml-grid">
          <div class="ml-cell">
            <div><div class="text-xs text-muted mb-1">${home.name} ML</div><div style="font-size:1.2rem;font-weight:800;color:var(--text)">${fmtML(bl.moneylineHome || bl.homeMoneyline)}</div></div>
            ${pred.moneylineValue === "home" ? '<span class="badge badge-elite">VALUE</span>' : ""}
          </div>
          <div class="ml-cell">
            <div><div class="text-xs text-muted mb-1">${away.name} ML</div><div style="font-size:1.2rem;font-weight:800;color:var(--text)">${fmtML(bl.moneylineAway || bl.awayMoneyline)}</div></div>
            ${pred.moneylineValue === "away" ? '<span class="badge badge-elite">VALUE</span>' : ""}
          </div>
        </div>
        ${composite ? `
          <div style="margin-top:12px;padding:12px;border-radius:var(--radius);background:var(--surface);border:1px solid var(--border)">
            <div class="text-xs text-muted mb-2" style="letter-spacing:1px;text-transform:uppercase">Composite Model Adjustment Breakdown</div>
            ${[
              pred.playerImpactAdj   ? { label: "Player Impact",      h: pred.playerImpactAdj.home,   a: pred.playerImpactAdj.away }   : null,
              pred.situationalAdj    ? { label: "Situational",         h: pred.situationalAdj.home,    a: pred.situationalAdj.away }    : null,
              pred.weatherImpact     ? { label: "Weather",             h: pred.weatherImpact.homeAdj,  a: pred.weatherImpact.awayAdj }  : null,
              pred.programMomentumAdj? { label: "Program Momentum",   h: pred.programMomentumAdj.home,a: pred.programMomentumAdj.away }: null,
            ].filter(Boolean).map(r => `
              <div class="flex justify-between text-xs mb-1">
                <span class="text-muted">${r.label}</span>
                <div class="flex gap-3">
                  <span style="color:${r.h >= 0 ? "var(--primary)" : "var(--danger)"};font-weight:700">${home.abbreviation}: ${r.h >= 0 ? "+" : ""}${r.h}</span>
                  <span style="color:${r.a >= 0 ? "var(--primary)" : "var(--danger)"};font-weight:700">${away.abbreviation}: ${r.a >= 0 ? "+" : ""}${r.a}</span>
                </div>
              </div>`).join("")}
          </div>` : ""}
        ${(() => {
          // ATS Context from team data
          const homeTeamData = (typeof TEAMS !== "undefined") ? (TEAMS[game.homeTeamId] || TEAMS[home.id] || null) : null;
          const awayTeamData = (typeof TEAMS !== "undefined") ? (TEAMS[game.awayTeamId] || TEAMS[away.id] || null) : null;
          const homeSit = homeTeamData ? homeTeamData.situational : null;
          const awaySit = awayTeamData ? awayTeamData.situational : null;
          if (!homeSit && !awaySit) return "";

          const homeIsFav = bl.spread <= 0;
          const homeAtsCtx = homeSit ? (homeIsFav ? homeSit.atsFavorite : homeSit.atsUnderdog) : null;
          const awayAtsCtx = awaySit ? (!homeIsFav ? awaySit.atsFavorite : awaySit.atsUnderdog) : null;
          const homeHomeAts = homeSit ? homeSit.atsHome : null;
          const awayAwayAts = awaySit ? awaySit.atsAway : null;

          function atsColor(pct) {
            if (!pct && pct !== 0) return "var(--muted)";
            if (pct >= 0.60) return "var(--primary)";
            if (pct >= 0.52) return "var(--gold)";
            return "var(--danger)";
          }
          function atsFmt(ctx) {
            if (!ctx) return "—";
            return ctx.wins + "-" + ctx.losses + " (" + Math.round((ctx.pct || 0) * 100) + "%)";
          }

          return `<div style="margin-top:14px;padding:12px;border-radius:var(--radius);background:rgba(99,102,241,.05);border:1px solid rgba(99,102,241,.2)">
            <div style="font-size:.6rem;font-weight:900;letter-spacing:1.5px;text-transform:uppercase;color:var(--accent);margin-bottom:10px">ATS Team Tendencies — Relevant to This Game</div>
            <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">
              <div style="padding:10px;border-radius:8px;background:var(--surface);border:1px solid var(--border)">
                <div style="font-size:.62rem;font-weight:800;color:var(--muted);letter-spacing:.5px;text-transform:uppercase;margin-bottom:6px">${home.abbreviation} — Home Team</div>
                ${homeAtsCtx ? `<div style="font-size:.72rem;color:var(--muted);display:flex;justify-content:space-between;margin-bottom:3px"><span>ATS as ${homeIsFav ? "Fav" : "Dog"}</span><span style="font-weight:800;color:${atsColor(homeAtsCtx.pct)}">${atsFmt(homeAtsCtx)}</span></div>` : ""}
                ${homeHomeAts ? `<div style="font-size:.72rem;color:var(--muted);display:flex;justify-content:space-between;margin-bottom:3px"><span>ATS at Home</span><span style="font-weight:800;color:${atsColor(homeHomeAts.pct)}">${atsFmt(homeHomeAts)}</span></div>` : ""}
                ${homeAtsCtx && homeAtsCtx.pct >= 0.60 ? `<div style="font-size:.65rem;font-weight:700;color:var(--primary);margin-top:4px">✓ Strong cover rate in this role</div>` : ""}
                ${homeAtsCtx && homeAtsCtx.pct <= 0.48 ? `<div style="font-size:.65rem;font-weight:700;color:var(--danger);margin-top:4px">⚠ Poor ATS tendency in this role</div>` : ""}
              </div>
              <div style="padding:10px;border-radius:8px;background:var(--surface);border:1px solid var(--border)">
                <div style="font-size:.62rem;font-weight:800;color:var(--muted);letter-spacing:.5px;text-transform:uppercase;margin-bottom:6px">${away.abbreviation} — Away Team</div>
                ${awayAtsCtx ? `<div style="font-size:.72rem;color:var(--muted);display:flex;justify-content:space-between;margin-bottom:3px"><span>ATS as ${!homeIsFav ? "Fav" : "Dog"}</span><span style="font-weight:800;color:${atsColor(awayAtsCtx.pct)}">${atsFmt(awayAtsCtx)}</span></div>` : ""}
                ${awayAwayAts ? `<div style="font-size:.72rem;color:var(--muted);display:flex;justify-content:space-between;margin-bottom:3px"><span>ATS on Road</span><span style="font-weight:800;color:${atsColor(awayAwayAts.pct)}">${atsFmt(awayAwayAts)}</span></div>` : ""}
                ${awayAtsCtx && awayAtsCtx.pct >= 0.60 ? `<div style="font-size:.65rem;font-weight:700;color:var(--primary);margin-top:4px">✓ Strong cover rate in this role</div>` : ""}
                ${awayAtsCtx && awayAtsCtx.pct <= 0.48 ? `<div style="font-size:.65rem;font-weight:700;color:var(--danger);margin-top:4px">⚠ Poor ATS tendency in this role</div>` : ""}
              </div>
            </div>
          </div>`;
        })()}
      </div>`;
  }

  /* 14 — Coaching Tendencies Matchup (RIGHT column) */
  function renderCoaching() {
    const hcp = safe(() => home.coachingProfile, null);
    const acp = safe(() => away.coachingProfile, null);
    const ce  = pred.coachingEdge || null;

    function coachSide(team, cp, side) {
      const hotSeat = cp ? (cp.hotSeatLevel || 0) : 0;
      return `
        <div style="padding:14px;border-radius:var(--radius);border:1px solid ${team.color}30;background:${team.color}08;margin-bottom:10px">
          <div class="flex items-center gap-2 mb-3">
            <div class="team-logo team-logo-sm" style="background:${team.color}">${team.abbreviation.slice(0, 2)}</div>
            <div>
              <div style="font-size:.875rem;font-weight:800;color:var(--text)">${team.coachName}</div>
              <div class="text-xs text-muted">${side} · ${team.name}</div>
            </div>
            ${hotSeat >= 4 ? `<div style="margin-left:auto">${flames(hotSeat)}</div>` : ""}
          </div>
          <div style="font-size:.78rem;color:var(--muted);display:grid;gap:5px">
            <div class="flex justify-between"><span>Overall Record</span><span style="color:var(--text)">${team.coachRecord}</span></div>
            ${cp && cp.atsRecord ? `<div class="flex justify-between"><span>Coach ATS</span><span style="color:var(--primary);font-weight:700">${cp.atsRecord}</span></div>` : ""}
            ${cp && cp.closeGameRecord ? `<div class="flex justify-between"><span>Close Games</span><span style="color:var(--text-soft)">${cp.closeGameRecord}</span></div>` : ""}
            <div class="flex justify-between"><span>Recruiting</span><span style="color:var(--primary)">#${team.recruitingRank} nationally</span></div>
            ${hotSeat >= 4 ? `<div style="margin-top:4px;padding:6px 8px;border-radius:6px;background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.2);color:#f87171;font-size:.72rem;font-weight:700">HOT SEAT — Job security pressure affects game-day decisions</div>` : ""}
          </div>
          <details class="coach-details" style="margin-top:6px">
            <summary><span class="coach-chevron">▸</span> Model Record &amp; Tendencies</summary>
            <div style="font-size:.78rem;color:var(--muted);display:grid;gap:5px;padding-top:6px">
              ${cp && cp.atsRecord         ? `<div class="flex justify-between"><span>ATS as HC</span><span style="color:var(--text-soft)">${cp.atsRecord}</span></div>` : ""}
              ${cp && cp.closeGameRecord   ? `<div class="flex justify-between"><span>Close Games</span><span style="color:var(--text-soft)">${cp.closeGameRecord}</span></div>` : ""}
              ${cp && cp.halfTimeAdjRating !== undefined ? `
                <div>
                  <div class="flex justify-between mb-1"><span>Halftime Adj</span><span style="color:var(--text-soft)">${cp.halfTimeAdjRating}/10</span></div>
                  ${meterBar(cp.halfTimeAdjRating, 10, "var(--accent)", 4)}
                </div>` : ""}
              ${cp && cp.aggressiveness !== undefined ? `
                <div>
                  <div class="flex justify-between mb-1"><span>Aggressiveness</span><span style="color:var(--text-soft)">${cp.aggressiveness}/10</span></div>
                  ${meterBar(cp.aggressiveness, 10, "#f97316", 4)}
                </div>` : ""}
              ${cp && cp.blitzRate !== undefined ? `<div class="flex justify-between"><span>Blitz Rate</span><span style="color:var(--text-soft)">${typeof cp.blitzRate === "number" && cp.blitzRate <= 10 ? cp.blitzRate + "/10" : cp.blitzRate}</span></div>` : ""}
              ${cp && cp.pressureRate ? `<div class="flex justify-between"><span>Pressure Rate</span><span style="color:var(--text-soft)">${cp.pressureRate}</span></div>` : ""}
              ${cp && cp.bigSpotRecord ? `<div class="flex justify-between"><span>Big Games ATS</span><span style="color:var(--text-soft)">${cp.bigSpotRecord}</span></div>` : ""}
              ${cp && cp.staffStability ? `<div class="flex justify-between"><span>Staff Stability</span><span style="color:${cp.staffStability === "stable" ? "var(--primary)" : "var(--gold)"}">${cp.staffStability}</span></div>` : ""}
            </div>
          </details>
          <!-- Run/Pass ratio bar -->
          ${cp && cp.runRatio !== undefined ? `
            <div style="margin-top:10px">
              <div class="flex justify-between text-xxs text-muted mb-1"><span>Run</span><span>Pass</span></div>
              <div style="display:flex;height:10px;border-radius:5px;overflow:hidden">
                <div style="width:${(cp.runRatio || 0.45) * 100}%;background:var(--accent)"></div>
                <div style="flex:1;background:#38bdf8"></div>
              </div>
              <div class="flex justify-between text-xxs text-muted mt-1">
                <span>${((cp.runRatio || 0.45) * 100).toFixed(0)}%</span>
                <span>${((1 - (cp.runRatio || 0.45)) * 100).toFixed(0)}%</span>
              </div>
            </div>` : ""}
          ${cp && cp.schemeMismatch ? `
            <div style="margin-top:8px;padding:7px;background:rgba(99,102,241,.08);border:1px solid rgba(99,102,241,.2);border-radius:6px;font-size:.72rem;color:var(--text-soft);font-style:italic">${cp.schemeMismatch}</div>` : ""}
        </div>`;
    }

    return `
      <div class="card card-p mb-5" id="section-coaching">
        <div class="section-label">Coaching Tendencies</div>
        ${ce && ce.winner !== "neutral" ? `
          <div style="padding:8px 12px;border-radius:var(--radius);background:rgba(99,102,241,.08);border:1px solid rgba(99,102,241,.2);margin-bottom:12px;font-size:.78rem">
            <span class="text-muted">Coaching Edge: </span>
            <strong style="color:var(--accent)">${ce.winner === "home" ? home.name : away.name} +${ce.pts || ""} pts</strong>
            ${ce.note ? `<span class="text-muted"> — ${ce.note}</span>` : ""}

        ${coachSide(home, hcp, "Home")}

  /* 15 — Program Health Dashboard (RIGHT column) */
  function renderProgramHealth() {
    const hph = safe(() => home.programHealth, null);
    const aph = safe(() => away.programHealth, null);
    if (!hph && !aph) return "";

    function phCard(team, ph) {
      if (!ph) return "";
      const mom = ph.programMomentum || ph.momentum || "";
      const hs  = ph.coachHotSeat || ph.hotSeatLevel || 0;
      return `
        <div style="padding:12px;border-radius:var(--radius);border:1px solid ${team.color}25;background:${team.color}06;margin-bottom:10px">

              ${hs >= 4 ? flames(hs) : ""}

          </div>
          <div style="display:grid;gap:7px;font-size:.75rem">
            ${ph.nilStrength !== undefined ? `
              <div>
                <div class="flex justify-between mb-1"><span class="text-muted">NIL Strength</span><span style="color:${ph.nilStrength >= 70 ? "var(--primary)" : ph.nilStrength >= 40 ? "var(--gold)" : "var(--danger)"}">${ph.nilStrength}/100</span></div>
                ${meterBar(ph.nilStrength, 100, ph.nilStrength >= 70 ? "var(--primary)" : ph.nilStrength >= 40 ? "var(--gold)" : "var(--danger)", 6)}

            ${ph.transferPortalRating !== undefined ? `
              <div>
                <div class="flex justify-between mb-1"><span class="text-muted">Transfer Portal</span><span style="color:${ph.transferPortalRating >= 70 ? "var(--primary)" : ph.transferPortalRating >= 50 ? "var(--gold)" : "var(--danger)"}">${ph.transferPortalRating}/100</span></div>

              </div>` : ""}
            ${ph.fanMorale !== undefined ? `
              <div>
                <div class="flex justify-between mb-1"><span class="text-muted">Fan Morale</span><span style="color:var(--text-soft)">${ph.fanMorale}/100</span></div>
                ${meterBar(ph.fanMorale, 100, "#f472b6", 5)}

            ${ph.lockerRoomCohesion !== undefined ? `
              <div>
                <div class="flex justify-between mb-1"><span class="text-muted">Locker Room</span><span style="color:${ph.lockerRoomCohesion >= 70 ? "var(--primary)" : ph.lockerRoomCohesion >= 40 ? "var(--gold)" : "var(--danger)"}">${ph.lockerRoomCohesion}/100</span></div>
                ${meterBar(ph.lockerRoomCohesion, 100, ph.lockerRoomCohesion >= 70 ? "var(--primary)" : "var(--gold)", 5)}
              </div>` : ""}
            ${ph.depthChartStability !== undefined ? `
              <div>
                <div class="flex justify-between mb-1"><span class="text-muted">Depth Stability</span><span style="color:var(--text-soft)">${ph.depthChartStability}/100</span></div>
                ${meterBar(ph.depthChartStability, 100, "#38bdf8", 5)}
              </div>` : ""}
            ${mom ? `<div class="flex justify-between"><span class="text-muted">Momentum</span><span style="color:${mom==="rising"?"var(--primary)":mom==="declining"?"var(--danger)":"var(--gold)"};font-weight:700">${mom.charAt(0).toUpperCase()+mom.slice(1)}</span></div>` : ""}
            ${hs ? `<div class="flex justify-between"><span class="text-muted">Coach Hot Seat</span><span>${flames(hs)} <span class="text-muted" style="font-size:.65rem">(${hs}/10)</span></span></div>` : ""}

    return `
      <div class="card card-p mb-5" id="section-program">

        ${phCard(away, aph)}
      </div>`;
