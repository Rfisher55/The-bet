          <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px">
            ${sitG.homeRestDays !== undefined ? `
              <div style="text-align:center;padding:8px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius)">
                <div class="text-xs text-muted">Home Rest</div>
                <div style="font-size:1.3rem;font-weight:900;color:${sitG.homeRestDays >= 10 ? "var(--primary)" : sitG.homeRestDays <= 6 ? "var(--danger)" : "var(--text)"}">${sitG.homeRestDays}d</div>
              </div>` : ""}
            ${sitG.awayRestDays !== undefined ? `
              <div style="text-align:center;padding:8px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius)">
                <div class="text-xs text-muted">Away Rest</div>
                <div style="font-size:1.3rem;font-weight:900;color:${sitG.awayRestDays >= 10 ? "var(--primary)" : sitG.awayRestDays <= 6 ? "var(--danger)" : "var(--text)"}">${sitG.awayRestDays}d</div>
              </div>` : ""}
          </div>` : ""}

        ${sitG && sitG.rivalryGame ? `
          <div style="padding:8px 12px;border-radius:var(--radius);background:rgba(245,158,11,.08);border:1px solid rgba(245,158,11,.25);margin-bottom:10px;font-size:.78rem;color:var(--gold);font-weight:700">
            ⚔️ RIVALRY GAME — Historical emotions run high, records go out the window
          </div>` : ""}

        <!-- ATS Records in situation -->
        ${hAts || aAts ? `
          <div class="text-xs text-muted mb-2" style="letter-spacing:1px;text-transform:uppercase">Situational ATS Records</div>
          <div style="display:grid;gap:6px">
            ${hAts ? Object.entries(hAts).slice(0, 4).map(([k, v]) => `
              <div class="flex justify-between text-xs">
                <span class="text-muted">${home.abbreviation} ${k.replace(/([A-Z])/g, " $1").replace(/_/g, " ")}</span>
                <span style="font-weight:700;color:${(parseInt(v) > 0.5 || (v && v.toString().startsWith("+") )) ? "var(--primary)" : "var(--muted)"}">${v}</span>
              </div>`).join("") : ""}
            ${aAts ? Object.entries(aAts).slice(0, 4).map(([k, v]) => `
              <div class="flex justify-between text-xs">
                <span class="text-muted">${away.abbreviation} ${k.replace(/([A-Z])/g, " $1").replace(/_/g, " ")}</span>
                <span style="font-weight:700;color:${(parseInt(v) > 0.5 || (v && v.toString().startsWith("+"))) ? "var(--primary)" : "var(--muted)"}">${v}</span>
              </div>`).join("") : ""}
          </div>` : ""}
      </div>`;
  }

  /* 10 — Player Intelligence (LEFT column) */
  function renderPlayerIntelligence() {
    if (!allPlayers.length) return "";

    function playerCard(p) {
      const teamColor = p.teamId === home.id ? home.color : away.color;
      const teamName  = p.teamId === home.id ? home.name  : away.name;
      const teamAbbr  = p.teamId === home.id ? home.abbreviation : away.abbreviation;
      const pm  = p.performanceMetrics || null;
      const pf  = p.personalFlags || null;
      const ih  = p.injuryHistory || null;
      const sr  = p.scoutReport || null;
      const ps  = p.practiceStatus || null;
      const hw  = p.heightWeight || null;
      const ht  = p.hometown || null;
      const nfl = p.nflDraftStatus || null;
      const nil = p.nilSatisfaction || null;

      const distLevel = pf ? (pf.distractionLevel || 0) : 0;
      const distColor = distLevel <= 3 ? "var(--primary)" : distLevel <= 6 ? "var(--gold)" : distLevel <= 8 ? "#f97316" : "var(--danger)";

      return `
        <div style="background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:16px">
          <!-- Header -->
          <div class="flex items-center gap-3 mb-3">
            <div class="player-avatar" style="background:${teamColor};width:44px;height:44px;font-size:.85rem">#${p.number || "—"}</div>
            <div style="flex:1">
              <div style="font-size:1rem;font-weight:800;color:var(--text)">${p.name}</div>
              <div class="text-xs text-muted">${p.position} · ${p.year || "—"} · ${teamName}</div>
              ${hw ? `<div class="text-xs text-muted">${hw}</div>` : ""}
              ${ht ? `<div class="text-xs text-muted">📍 ${ht}</div>` : ""}
            </div>
            <div style="text-align:right">
              ${p.injuryStatus && p.injuryStatus !== "healthy"
                ? `<span class="badge badge-danger">${p.injuryStatus.toUpperCase()}</span>`
                : '<span class="badge badge-ok">ACTIVE</span>'}
              ${ps ? `<div class="text-xxs text-muted mt-1">${ps}</div>` : ""}
            </div>
          </div>

          ${nfl ? `<div style="margin-bottom:10px"><span style="font-size:.65rem;font-weight:800;letter-spacing:1px;text-transform:uppercase;padding:3px 8px;border-radius:10px;border:1px solid rgba(245,158,11,.4);background:rgba(245,158,11,.1);color:var(--gold)">🏆 ${nfl}</span></div>` : ""}

          <!-- Injury history timeline -->
          ${ih && ih.length ? `
            <div style="margin-bottom:12px;padding:10px;background:rgba(239,68,68,.05);border:1px solid rgba(239,68,68,.15);border-radius:var(--radius)">
              <div class="text-xs text-muted mb-2" style="font-weight:700;letter-spacing:1px">INJURY HISTORY</div>
              ${ih.map(ev => `
                <div class="timeline-item">
                  <div class="tl-dot" style="background:${ev.impact === "high" ? "var(--danger)" : ev.impact === "medium" ? "var(--gold)" : "var(--muted)"}"></div>
                  <div>
                    <span style="color:var(--muted-l);font-weight:600">${ev.year || ""} ${ev.type || ""}</span>
                    ${ev.impact ? `<span style="margin-left:6px;font-size:.65rem;font-weight:700;text-transform:uppercase;color:${ev.impact === "high" ? "var(--danger)" : ev.impact === "medium" ? "var(--gold)" : "var(--muted)"}">[${ev.impact}]</span>` : ""}
                    ${ev.note ? `<div style="font-size:.72rem;color:var(--muted);margin-top:1px">${ev.note}</div>` : ""}
                  </div>
                </div>`).join("")}
            </div>` : ""}

          <!-- Personal flags / Insider intel -->
          ${pf ? `
            <div class="insider-intel-box mb-3" style="margin-top:4px">
              <div style="margin-top:6px">
                ${pf.distractionType ? `<div class="flex items-center gap-2 mb-2"><span style="font-size:.65rem;font-weight:800;letter-spacing:1px;padding:2px 8px;border-radius:8px;border:1px solid rgba(239,68,68,.35);background:rgba(239,68,68,.1);color:#f87171;text-transform:uppercase">${pf.distractionType}</span></div>` : ""}
                ${distLevel > 0 ? `
                  <div class="flex items-center gap-2 mb-2">
                    <span class="text-xs text-muted" style="width:100px;flex-shrink:0">Distraction ${distLevel}/10</span>
                    <div style="flex:1;height:6px;background:var(--border);border-radius:3px;overflow:hidden">
                      <div style="width:${distLevel * 10}%;height:100%;border-radius:3px;background:${distColor}"></div>
                    </div>
                  </div>` : ""}
                ${pf.insiderNote ? `<div class="text-xs" style="color:var(--text-soft);line-height:1.55;font-style:italic">"${pf.insiderNote}"</div>` : ""}
                ${pf.socialChatter ? `<div class="text-xxs text-muted mt-2">Social chatter: <strong style="color:var(--muted-l)">${pf.socialChatter}</strong></div>` : ""}
              </div>
            </div>` : ""}

          <!-- Performance metrics radar -->
          ${pm ? `
            <div style="margin-bottom:12px">
              <div class="text-xs text-muted mb-2" style="letter-spacing:1px;text-transform:uppercase">Performance Metrics</div>
              ${pm.clutch     !== undefined ? radarBar("Clutch",      pm.clutch,     "#f59e0b") : ""}
              ${pm.bigGame    !== undefined ? radarBar("Big Game",    pm.bigGame,    "#f97316") : ""}
              ${pm.coldWeather!== undefined ? radarBar("Cold Wx",     pm.coldWeather,"#38bdf8") : ""}
              ${pm.road       !== undefined ? radarBar("Road",        pm.road,       "#a78bfa") : ""}
              ${pm.primetime  !== undefined ? radarBar("Primetime",   pm.primetime,  "#ec4899") : ""}
              ${pm.consistency!== undefined ? radarBar("Consistency", pm.consistency,"var(--primary)") : ""}
              ${pm.pressureRating !== undefined ? radarBar("Pressure",pm.pressureRating, "var(--gold)") : ""}
            </div>` : ""}

          <!-- Season stats -->
          ${p.stats ? `
            <div style="display:grid;grid-template-columns:repeat(2,1fr);gap:4px 12px;font-size:.72rem;margin-bottom:12px;padding:10px;background:var(--card);border:1px solid var(--border);border-radius:var(--radius)">
              ${p.stats.passingYards  !== undefined ? `<div class="flex justify-between"><span class="text-muted">Pass Yds</span><span style="font-weight:700;color:var(--text)">${p.stats.passingYards}</span></div>` : ""}
              ${p.stats.passingTDs    !== undefined ? `<div class="flex justify-between"><span class="text-muted">Pass TDs</span><span style="font-weight:700;color:var(--text)">${p.stats.passingTDs}</span></div>` : ""}
              ${p.stats.interceptions !== undefined ? `<div class="flex justify-between"><span class="text-muted">INT</span><span style="font-weight:700;color:${p.stats.interceptions > 8 ? "var(--danger)" : "var(--text)"}">${p.stats.interceptions}</span></div>` : ""}
              ${p.stats.completionPct !== undefined ? `<div class="flex justify-between"><span class="text-muted">Comp%</span><span style="font-weight:700;color:var(--text)">${p.stats.completionPct}%</span></div>` : ""}
              ${p.stats.qbr          !== undefined ? `<div class="flex justify-between"><span class="text-muted">QBR</span><span style="font-weight:700;color:var(--primary)">${p.stats.qbr}</span></div>` : ""}
              ${p.stats.rushingYards  !== undefined ? `<div class="flex justify-between"><span class="text-muted">Rush Yds</span><span style="font-weight:700;color:var(--text)">${p.stats.rushingYards}</span></div>` : ""}
              ${p.stats.rushingTDs    !== undefined ? `<div class="flex justify-between"><span class="text-muted">Rush TDs</span><span style="font-weight:700;color:var(--text)">${p.stats.rushingTDs}</span></div>` : ""}
              ${p.stats.receivingYards!== undefined ? `<div class="flex justify-between"><span class="text-muted">Rec Yds</span><span style="font-weight:700;color:var(--text)">${p.stats.receivingYards}</span></div>` : ""}
              ${p.stats.receptions    !== undefined ? `<div class="flex justify-between"><span class="text-muted">Receptions</span><span style="font-weight:700;color:var(--text)">${p.stats.receptions}</span></div>` : ""}
              ${p.stats.tackles       !== undefined ? `<div class="flex justify-between"><span class="text-muted">Tackles</span><span style="font-weight:700;color:var(--text)">${p.stats.tackles}</span></div>` : ""}
              ${p.stats.sacks         !== undefined ? `<div class="flex justify-between"><span class="text-muted">Sacks</span><span style="font-weight:700;color:var(--text)">${p.stats.sacks}</span></div>` : ""}
              ${p.stats.interceptionsDef !== undefined ? `<div class="flex justify-between"><span class="text-muted">INT (Def)</span><span style="font-weight:700;color:var(--primary)">${p.stats.interceptionsDef}</span></div>` : ""}
            </div>` : ""}

          <!-- Scout report -->
          ${sr ? `
            <div style="padding:10px 12px;border-radius:var(--radius);background:rgba(99,102,241,.06);border:1px solid rgba(99,102,241,.2);position:relative;margin-bottom:10px">
              <div style="position:absolute;top:-1px;left:12px;font-size:.6rem;font-weight:800;letter-spacing:1.5px;text-transform:uppercase;color:var(--accent);background:var(--surface);padding:0 6px;transform:translateY(-50%)">SCOUT REPORT</div>
              <div style="font-size:.78rem;color:var(--text-soft);line-height:1.6;margin-top:4px;font-style:italic">"${typeof sr === "string" ? sr : sr.summary || ""}"</div>
              ${sr.grade ? `<div class="text-xs text-muted mt-2">Grade: <strong style="color:var(--accent)">${sr.grade}</strong></div>` : ""}
            </div>` : ""}

          <!-- NIL satisfaction -->
          ${nil !== null && nil !== undefined ? `
            <div class="flex items-center gap-2">
              <span class="text-xs text-muted">NIL Satisfaction:</span>
              <div style="flex:1;height:5px;background:var(--border);border-radius:3px;overflow:hidden">
                <div style="width:${nil}%;height:100%;border-radius:3px;background:${nil >= 70 ? "var(--primary)" : nil >= 40 ? "var(--gold)" : "var(--danger)"}"></div>
              </div>
              <span class="text-xs" style="font-weight:700;color:${nil >= 70 ? "var(--primary)" : nil >= 40 ? "var(--gold)" : "var(--danger)"}">${nil}/100</span>
            </div>` : ""}
        </div>`;
    }

    return `
      <div class="card card-p mb-5">
        <div class="section-label">🎯 Player Intelligence <span style="font-size:.65rem;color:var(--muted);font-weight:400">(2025 stats · 2026 roster)</span></div>
        <div class="player-exp-grid">
          ${allPlayers.map(p => playerCard(p)).join("")}
        </div>
      </div>`;
  }

  /* 11 — Prediction Factors (LEFT, enhanced) */
  function renderFactors() {
    return `
      <div class="card card-p mb-5">
        <div class="section-label">Prediction Factors</div>
        ${(pred.factors || []).map(f => `
          <div class="factor">
            <div class="factor-top">
              <div class="factor-name">
                <span style="color:${fColor(f.impact)};margin-right:6px;font-size:1rem">${fIcon(f.impact)}</span>${f.name}
              </div>
              <div class="factor-meta">
                ${f.favoredTeam && f.favoredTeam !== "neither"
                  ? `<span style="font-size:.72rem;padding:2px 8px;border-radius:12px;border:1px solid ${(f.favoredTeam === "home" ? home.color : away.color) + "50"};background:${(f.favoredTeam === "home" ? home.color : away.color) + "18"};color:${f.favoredTeam === "home" ? home.color : away.color}">${f.favoredTeam === "home" ? home.abbreviation : away.abbreviation}</span>`
                  : ""}
                <span class="text-xs text-muted">Mag: ${f.magnitude}/10</span>
              </div>
            </div>
            <div class="factor-desc">${f.description}</div>
            <div style="display:flex;align-items:center;gap:8px">
              <div class="factor-bar" style="flex:1"><div class="factor-bar-fill" style="width:${(f.magnitude || 0) * 10}%;background:${fColor(f.impact)}"></div></div>
              <span style="font-size:.68rem;font-weight:700;color:${fColor(f.impact)}">${(f.magnitude || 0) * 10}%</span>
            </div>
          </div>`).join("")}
      </div>`;
  }

  /* 12 — Head-to-Head Stats (LEFT) */
  function renderStats() {
    return `
      <div class="card card-p mb-5">
        <div class="section-label">Head-to-Head Stats <span style="font-size:.65rem;color:var(--muted);font-weight:400">(2025 — prediction basis)</span></div>
        <div class="flex justify-between text-xs text-muted mb-4">
          <div class="flex items-center gap-2"><div style="width:10px;height:10px;border-radius:50%;background:${home.color}"></div>${home.name}</div>
          <div class="flex items-center gap-2">${away.name}<div style="width:10px;height:10px;border-radius:50%;background:${away.color}"></div></div>
        </div>
        ${statRows.map(row => {
          const hWins = row.hib ? row.hv > row.av : row.hv < row.av;
          const aWins = row.hib ? row.av > row.hv : row.av < row.hv;
          const mx = Math.max(Math.abs(row.hv), Math.abs(row.av), 1);
          const hp = Math.min(100, Math.abs(row.hv) / mx * 100);
          const ap = Math.min(100, Math.abs(row.av) / mx * 100);
          return `
            <div class="stat-comp-row">
              <div class="stat-comp-labels">
                <span style="color:${hWins ? home.color : "var(--muted)"};font-weight:${hWins ? "700" : "400"}">${row.fmt(row.hv)}</span>
                <span class="text-muted">${row.label}</span>
                <span style="color:${aWins ? away.color : "var(--muted)"};font-weight:${aWins ? "700" : "400"}">${row.fmt(row.av)}</span>
              </div>
              <div class="stat-comp-bars">
                <div class="stat-comp-bar-l"><div class="stat-comp-fill" style="width:${hp}%;background:${hWins ? home.color : "#334155"}"></div></div>
                <div class="stat-comp-bar-r"><div class="stat-comp-fill" style="width:${ap}%;background:${aWins ? away.color : "#334155"}"></div></div>
              </div>
            </div>`;
        }).join("")}
      </div>`;
  }

  /* 13 — Vegas Lines vs Model (LEFT) */
  function renderVegas() {
    if (!game.bettingLines) return "";
    const bl = game.bettingLines;
    const composite = pred.compositeScore || null;
    return `
      <div class="card card-p mb-5">
        <div class="section-label">Vegas Lines vs Model</div>
        <div class="vegas-grid">
          <div class="vegas-cell">
            <div class="vegas-label">Vegas Spread</div>
            <div class="vegas-val">${fmtSpread(bl.spread)}</div>
            <div class="vegas-sub">${bl.spread < 0 ? home.abbreviation : away.abbreviation} favored</div>
          </div>
          <div class="vegas-cell">
            <div class="vegas-label">Model Spread</div>
            <div class="vegas-val" style="color:var(--accent)">${fmtSpread(-pred.predictedSpread)}</div>
            <div class="vegas-sub">${pred.predictedSpread >= 0 ? home.abbreviation : away.abbreviation} favored</div>
          </div>
          <div class="vegas-cell">
            <div class="vegas-label">Vegas Total</div>
            <div class="vegas-val">${bl.total}</div>
            <div class="vegas-sub">${bl.provider}</div>
          </div>
          <div class="vegas-cell">
            <div class="vegas-label">Model Total</div>
            <div class="vegas-val" style="color:var(--accent)">${pred.predictedTotal ? pred.predictedTotal.toFixed(1) : "—"}</div>
            <div class="vegas-sub">${pred.predictedTotal && pred.predictedTotal > bl.total ? `+${(pred.predictedTotal - bl.total).toFixed(1)} over` : pred.predictedTotal ? `${(pred.predictedTotal - bl.total).toFixed(1)} under` : "—"}</div>
          </div>
        </div>
        <div class="ml-grid">
          <div class="ml-cell">
            <div><div class="text-xs text-muted mb-1">${home.name} ML</div><div style="font-size:1.2rem;font-weight:800;color:var(--text)">${fmtML(bl.homeMoneyline)}</div></div>
            ${pred.moneylineValue === "home" ? '<span class="badge badge-elite">VALUE</span>' : ""}
          </div>
          <div class="ml-cell">
            <div><div class="text-xs text-muted mb-1">${away.name} ML</div><div style="font-size:1.2rem;font-weight:800;color:var(--text)">${fmtML(bl.awayMoneyline)}</div></div>
            ${pred.moneylineValue === "away" ? '<span class="badge badge-elite">VALUE</span>' : ""}
          </div>
        </div>
        ${composite ? `
          <div style="margin-top:12px;padding:12px;border-radius:var(--radius);background:var(--surface);border:1px solid var(--border)">
            <div class="text-xs text-muted mb-2" style="letter-spacing:1px;text-transform:uppercase">Composite Model Adjustment Breakdown</div>
            ${[
              pred.playerImpactAdj   ? { label: "Player Impact",      h: pred.playerImpactAdj.home,   a: pred.playerImpactAdj.away }   : null,
              pred.situationalAdj    ? { label: "Situational",         h: pred.situationalAdj.home,    a: pred.situationalAdj.away }    : null,
              pred.weatherImpact     ? { label: "Weather",             h: pred.weatherImpact.homeAdj,  a: pred.weatherImpact.awayAdj }  : null,
              pred.programMomentumAdj? { label: "Program Momentum",   h: pred.programMomentumAdj.home,a: pred.programMomentumAdj.away }: null,
            ].filter(Boolean).map(r => `
              <div class="flex justify-between text-xs mb-1">
                <span class="text-muted">${r.label}</span>
                <div class="flex gap-3">
                  <span style="color:${r.h >= 0 ? "var(--primary)" : "var(--danger)"};font-weight:700">${home.abbreviation}: ${r.h >= 0 ? "+" : ""}${r.h}</span>
                  <span style="color:${r.a >= 0 ? "var(--primary)" : "var(--danger)"};font-weight:700">${away.abbreviation}: ${r.a >= 0 ? "+" : ""}${r.a}</span>
                </div>
              </div>`).join("")}
          </div>` : ""}
      </div>`;
  }

  /* 14 — Coaching Tendencies Matchup (RIGHT column) */
  function renderCoaching() {
    const hcp = safe(() => home.coachingProfile, null);
    const acp = safe(() => away.coachingProfile, null);
    const ce  = pred.coachingEdge || null;

    function coachSide(team, cp, side) {
      const hotSeat = cp ? (cp.hotSeatLevel || 0) : 0;
      return `
        <div style="padding:14px;border-radius:var(--radius);border:1px solid ${team.color}30;background:${team.color}08;margin-bottom:10px">
          <div class="flex items-center gap-2 mb-3">
            <div class="team-logo team-logo-sm" style="background:${team.color}">${team.abbreviation.slice(0, 2)}</div>
            <div>
              <div style="font-size:.875rem;font-weight:800;color:var(--text)">${team.coachName}</div>
              <div class="text-xs text-muted">${side} · ${team.name}</div>
            </div>
            ${hotSeat >= 4 ? `<div style="margin-left:auto">${flames(hotSeat)}</div>` : ""}
          </div>
          <div style="font-size:.78rem;color:var(--muted);display:grid;gap:5px">
            <div class="flex justify-between"><span>Overall Record</span><span style="color:var(--text)">${team.coachRecord}</span></div>
            <div class="flex justify-between"><span>Recruiting</span><span style="color:var(--primary)">#${team.recruitingRank} nationally</span></div>
            ${cp && cp.atsRecord         ? `<div class="flex justify-between"><span>ATS as HC</span><span style="color:var(--text-soft)">${cp.atsRecord}</span></div>` : ""}
            ${cp && cp.closeGameRecord   ? `<div class="flex justify-between"><span>Close Games</span><span style="color:var(--text-soft)">${cp.closeGameRecord}</span></div>` : ""}
            ${cp && cp.halfTimeAdjRating !== undefined ? `
              <div>
                <div class="flex justify-between mb-1"><span>Halftime Adj</span><span style="color:var(--text-soft)">${cp.halfTimeAdjRating}/10</span></div>
                ${meterBar(cp.halfTimeAdjRating, 10, "var(--accent)", 4)}
              </div>` : ""}
            ${cp && cp.aggressiveness !== undefined ? `
              <div>
                <div class="flex justify-between mb-1"><span>Aggressiveness</span><span style="color:var(--text-soft)">${cp.aggressiveness}/10</span></div>
                ${meterBar(cp.aggressiveness, 10, "#f97316", 4)}
              </div>` : ""}
            ${cp && cp.blitzRate !== undefined ? `<div class="flex justify-between"><span>Blitz Rate</span><span style="color:var(--text-soft)">${(cp.blitzRate * 100).toFixed(0)}%</span></div>` : ""}
            ${cp && cp.staffStability ? `<div class="flex justify-between"><span>Staff Stability</span><span style="color:${cp.staffStability === "stable" ? "var(--primary)" : "var(--gold)"}">${cp.staffStability}</span></div>` : ""}
            ${hotSeat >= 4 ? `<div style="margin-top:4px;padding:6px 8px;border-radius:6px;background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.2);color:#f87171;font-size:.72rem;font-weight:700">🔥 HOT SEAT — Job security pressure affects game-day decisions</div>` : ""}
          </div>
          <!-- Run/Pass ratio bar -->
          ${cp && cp.runRatio !== undefined ? `
            <div style="margin-top:10px">
              <div class="flex justify-between text-xxs text-muted mb-1"><span>Run</span><span>Pass</span></div>
              <div style="display:flex;height:10px;border-radius:5px;overflow:hidden">
                <div style="width:${(cp.runRatio || 0.45) * 100}%;background:var(--accent)"></div>
                <div style="flex:1;background:#38bdf8"></div>
              </div>
              <div class="flex justify-between text-xxs text-muted mt-1">
                <span>${((cp.runRatio || 0.45) * 100).toFixed(0)}%</span>
                <span>${((1 - (cp.runRatio || 0.45)) * 100).toFixed(0)}%</span>
              </div>
            </div>` : ""}
          ${cp && cp.schemeMismatch ? `
            <div style="margin-top:8px;padding:7px;background:rgba(99,102,241,.08);border:1px solid rgba(99,102,241,.2);border-radius:6px;font-size:.72rem;color:var(--text-soft);font-style:italic">${cp.schemeMismatch}</div>` : ""}
        </div>`;
    }

    return `
      <div class="card card-p mb-5">
        <div class="section-label">🧠 Coaching Tendencies</div>
        ${ce && ce.winner !== "neutral" ? `
          <div style="padding:8px 12px;border-radius:var(--radius);background:rgba(99,102,241,.08);border:1px solid rgba(99,102,241,.2);margin-bottom:12px;font-size:.78rem">
            <span class="text-muted">Coaching Edge: </span>
            <strong style="color:var(--accent)">${ce.winner === "home" ? home.name : away.name} +${ce.pts || ""} pts</strong>
            ${ce.note ? `<span class="text-muted"> — ${ce.note}</span>` : ""}
          </div>` : ""}
        ${coachSide(home, hcp, "Home")}
        ${coachSide(away, acp, "Away")}
        ${hcp && acp && (hcp.blitzRate !== undefined && acp.blitzRate !== undefined) ? `
          <div style="padding:10px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);font-size:.75rem">
            <div class="text-muted mb-1" style="font-weight:700">Blitz vs Protection Matchup</div>
            <div style="color:var(--text-soft);line-height:1.5">
              ${home.name} blitzes at ${((hcp.blitzRate || 0) * 100).toFixed(0)}% vs
              ${away.name} blitzes at ${((acp.blitzRate || 0) * 100).toFixed(0)}%.
              ${hcp.blitzRate > acp.blitzRate
                ? `${home.name} will bring pressure — ${away.name}'s protection scheme is under scrutiny.`
                : `${away.name} is the more aggressive defensive unit.`}
            </div>
          </div>` : ""}
      </div>`;
  }

  /* 15 — Program Health Dashboard (RIGHT column) */
  function renderProgramHealth() {
    const hph = safe(() => home.programHealth, null);
    const aph = safe(() => away.programHealth, null);
    if (!hph && !aph) return "";

    function phCard(team, ph) {
      if (!ph) return "";
      const mom = ph.programMomentum || ph.momentum || "";
      const hs  = ph.coachHotSeat || ph.hotSeatLevel || 0;
      return `
        <div style="padding:12px;border-radius:var(--radius);border:1px solid ${team.color}25;background:${team.color}06;margin-bottom:10px">
          <div class="flex items-center gap-2 mb-3">
            <div class="team-logo team-logo-sm" style="background:${team.color}">${team.abbreviation.slice(0,2)}</div>
            <div style="font-size:.875rem;font-weight:700;color:var(--text)">${team.name}</div>
            <div style="margin-left:auto;display:flex;align-items:center;gap:6px">
              ${momArrow(mom)}
              ${hs >= 4 ? flames(hs) : ""}
            </div>
          </div>
          <div style="display:grid;gap:7px;font-size:.75rem">
            ${ph.nilStrength !== undefined ? `
              <div>
                <div class="flex justify-between mb-1"><span class="text-muted">NIL Strength</span><span style="color:${ph.nilStrength >= 70 ? "var(--primary)" : ph.nilStrength >= 40 ? "var(--gold)" : "var(--danger)"}">${ph.nilStrength}/100</span></div>
                ${meterBar(ph.nilStrength, 100, ph.nilStrength >= 70 ? "var(--primary)" : ph.nilStrength >= 40 ? "var(--gold)" : "var(--danger)", 6)}
              </div>` : ""}
            ${ph.transferPortalRating !== undefined ? `
              <div>
                <div class="flex justify-between mb-1"><span class="text-muted">Transfer Portal</span><span style="color:${ph.transferPortalRating >= 70 ? "var(--primary)" : ph.transferPortalRating >= 50 ? "var(--gold)" : "var(--danger)"}">${ph.transferPortalRating}/100</span></div>
                ${meterBar(ph.transferPortalRating, 100, ph.transferPortalRating >= 70 ? "var(--primary)" : "var(--accent)", 5)}
              </div>` : ""}
            ${ph.fanMorale !== undefined ? `
              <div>
                <div class="flex justify-between mb-1"><span class="text-muted">Fan Morale</span><span style="color:var(--text-soft)">${ph.fanMorale}/100</span></div>
                ${meterBar(ph.fanMorale, 100, "#f472b6", 5)}
              </div>` : ""}
            ${ph.lockerRoomCohesion !== undefined ? `
              <div>
                <div class="flex justify-between mb-1"><span class="text-muted">Locker Room</span><span style="color:${ph.lockerRoomCohesion >= 70 ? "var(--primary)" : ph.lockerRoomCohesion >= 40 ? "var(--gold)" : "var(--danger)"}">${ph.lockerRoomCohesion}/100</span></div>
                ${meterBar(ph.lockerRoomCohesion, 100, ph.lockerRoomCohesion >= 70 ? "var(--primary)" : "var(--gold)", 5)}
              </div>` : ""}
            ${ph.depthChartStability !== undefined ? `
              <div>
                <div class="flex justify-between mb-1"><span class="text-muted">Depth Stability</span><span style="color:var(--text-soft)">${ph.depthChartStability}/100</span></div>
                ${meterBar(ph.depthChartStability, 100, "#38bdf8", 5)}
              </div>` : ""}
            ${mom ? `<div class="flex justify-between"><span class="text-muted">Momentum</span><span style="color:${mom==="rising"?"var(--primary)":mom==="declining"?"var(--danger)":"var(--gold)"};font-weight:700">${mom.charAt(0).toUpperCase()+mom.slice(1)}</span></div>` : ""}
            ${hs ? `<div class="flex justify-between"><span class="text-muted">Coach Hot Seat</span><span>${flames(hs)} <span class="text-muted" style="font-size:.65rem">(${hs}/10)</span></span></div>` : ""}
          </div>
        </div>`;
    }

    return `
      <div class="card card-p mb-5">
        <div class="section-label">🏛️ Program Health Dashboard</div>
        ${phCard(home, hph)}
        ${phCard(away, aph)}
      </div>`;
  }

  /* 16 — Social Sentiment + Insider Intel (RIGHT column) */
  function renderSocial() {
    return `
      <div class="card card-p mb-5">
        <div class="section-label">Social Sentiment</div>
        <div class="social-grid">
          ${[{ team: home, key: "homeTeamBuzz" }, { team: away, key: "awayTeamBuzz" }].map(({ team, key }) => {
            const bz = buzz[key] || 0;
            return `
              <div class="social-card">
                <div class="text-xs text-muted mb-1">${team.name}</div>
                <div class="social-score">${bz}</div>
                <div class="text-xs text-muted">/ 100 buzz score</div>
                <div style="margin-top:8px;height:4px;background:var(--border);border-radius:2px;overflow:hidden">
                  <div style="width:${bz}%;height:100%;background:${team.id === home.id ? "var(--primary)" : "var(--accent)"}"></div>
                </div>
              </div>`;
          }).join("")}
        </div>

        <div class="section-label mt-4">Trending</div>
        <div class="trending-tags mb-4">
          ${(buzz.trendingTopics || []).map(t => `<div class="trending-tag">${t}</div>`).join("")}
        </div>

        ${(buzz.injuryAlerts || []).length ? `
          <div class="section-label">Injury Report</div>
          ${(buzz.injuryAlerts || []).map(a => `
            <div class="injury-card">
              <div class="injury-header">
                <span class="injury-icon">⚠</span>
                <span class="injury-name">${a.player}</span>
                <span class="injury-pos">${a.position}</span>
                <span class="badge badge-${a.impact === "high" ? "danger" : a.impact === "medium" ? "medium" : "low"}" style="margin-left:4px">${a.team}</span>
              </div>
              <div class="injury-meta">
                <span class="injury-status">${a.status}</span>
                <span class="text-muted">·</span>
                <span class="impact-${a.impact} fw-bold" style="font-size:.75rem;text-transform:uppercase">${a.impact} impact</span>
              </div>
              <div class="text-xs text-muted mt-1">${a.notes}</div>
            </div>`).join("")}` : ""}

        <div class="section-label mt-4">Insider Intel</div>
        ${(buzz.insiderTips || []).map(tip => `
          <div class="insider-card" style="border:1px solid var(--border-l)">
            <div class="insider-header">
              <span class="platform-badge ${platCls(tip.platform)}">${platLbl[tip.platform] || tip.platform}</span>
              <span class="fw-bold text-sm">${tip.source}</span>
              <span class="text-xs text-muted">${tip.handle}</span>
              <span class="text-xs text-muted ml-auto">${tip.timestamp}</span>
            </div>
            <div class="insider-content">${tip.content}</div>
            <div class="insider-footer">
              <span class="reliability">Reliability: <span>${"★".repeat(tip.reliability)}${"☆".repeat(5 - tip.reliability)}</span></span>
              ${(tip.tags || []).map(t => `<span style="font-size:.65rem;padding:2px 6px;border-radius:4px;background:var(--border);color:var(--muted)">${t}</span>`).join("")}
            </div>
          </div>`).join("")}
      </div>`;
  }

  /* 17 — Model Breakdown (RIGHT column) */
  function renderBreakdown() {
    return `
      <div class="card card-p mb-5">
        <div class="section-label">Model Breakdown</div>
        ${bdItems.map(item => `
          <div class="breakdown-row">
            <div class="breakdown-label">
              <span>${item.label}</span>
              <span style="font-weight:700;color:var(--text)">${item.value}%</span>
            </div>
            <div class="breakdown-bar"><div class="breakdown-fill" style="width:${Math.min(100, item.value)}%;background:${item.color}"></div></div>
          </div>`).join("")}
      </div>`;
  }

  /* ── FINAL RENDER ─────────────────────────────────── */
  document.getElementById("content").innerHTML = `
    <a class="back-link" href="games.html">← Back to Games</a>

    ${renderAlertBanner()}

    <!-- MATCHUP HEADER -->
    <div class="matchup-header mb-5" style="background:linear-gradient(135deg,${home.color}12 0%,var(--card) 40%,${away.color}12 100%)">
      <div class="flex items-center justify-between mb-5" style="flex-wrap:wrap;gap:8px">
        <div class="flex items-center gap-2 flex-wrap">
          <span class="text-xs text-muted">${fmtDate(game.date)} · ${game.time} ET</span>
          <span class="text-xs text-muted">·</span>
          <span class="text-xs text-muted">${game.venue}${game.venueCity ? ", " + game.venueCity : ""}</span>
          <span class="text-xs text-muted">·</span>
          <span class="text-xs text-muted">${game.network}</span>
          ${game.isConferenceGame ? '<span class="badge badge-conf">CONF GAME</span>' : ""}
        </div>
        <span class="badge ${confCls}">${confLbl}</span>
      </div>
      <div class="matchup-teams">
        <div class="team-chip">
          <div class="team-logo team-logo-lg" style="background:${away.color}">${away.abbreviation.slice(0, 3)}</div>
          <div>
            <div style="font-size:1.1rem;font-weight:800;color:var(--text)">${away.name}</div>
            <div class="text-xs text-muted">${away.mascot} · ${away.lastSeasonRecord||away.wins+'-'+away.losses+' (\'25)'} · Away</div>
            <div class="text-xs text-muted">${away.conference}</div>
          </div>
        </div>
        <div class="matchup-vs">
          <div class="matchup-vs-txt">VS</div>
          <div class="matchup-vs-wk">Week ${game.week}</div>
          ${game.bettingLines ? `<div class="text-xs text-muted mt-1">${fmtSpread(game.bettingLines.spread)} · O/U ${game.bettingLines.total}</div>` : ""}
        </div>
        <div class="team-chip team-chip-r">
          <div>
            <div style="font-size:1.1rem;font-weight:800;color:var(--text);text-align:right">${home.name}</div>
            <div class="text-xs text-muted text-right">${home.mascot} · ${home.lastSeasonRecord||home.wins+'-'+home.losses+' (\'25)'} · Home</div>
            <div class="text-xs text-muted text-right">${home.conference}</div>
          </div>
          <div class="team-logo team-logo-lg" style="background:${home.color}">${home.abbreviation.slice(0, 3)}</div>
        </div>
      </div>
    </div>

    ${safe(renderGamePreview, "")}

    ${safe(renderFullRoster, "")}

    ${safe(renderPositionMatchups, "")}

    ${safe(renderXFactors, "")}

    <!-- MAIN DETAIL GRID -->
    <div class="detail-grid">

      <!-- ─── LEFT COLUMN ─── -->
      <div>
        ${safe(renderModelGrade, "")}
        ${safe(renderPicks, "")}
        ${safe(renderFactors, "")}
        ${safe(renderStats, "")}
        ${safe(renderVegas, "")}
      </div>

      <!-- ─── RIGHT COLUMN ─── -->
      <div>
        ${safe(renderSharpMoney, "")}
        ${safe(renderWeather, "")}
        ${safe(renderSituational, "")}
        ${safe(renderCoaching, "")}
        ${safe(renderProgramHealth, "")}
        ${safe(renderBreakdown, "")}
      </div>

    </div><!-- /detail-grid -->

    ${safe(renderSocialHub, "")}

    <!-- DISCLAIMER -->
    <div style="margin-top:24px;padding:16px 20px;border-radius:var(--radius-lg);background:rgba(16,185,129,.04);border:1px solid rgba(16,185,129,.15);display:flex;gap:14px;align-items:flex-start">
      <span style="color:var(--primary);font-size:1rem;flex-shrink:0;margin-top:2px">ℹ</span>
      <div>
        <div style="font-size:.875rem;font-weight:700;color:var(--text);margin-bottom:4px">Disclaimer</div>
        <div style="font-size:.78rem;color:var(--muted-l);line-height:1.6">
          Predictions generated by The Bet AI Model v2.0 using SP+, EPA, recruiting, situational, weather, sharp money, and player intelligence signals.
          All picks are <strong style="color:var(--primary)">for entertainment purposes only</strong>. Past performance does not guarantee future results.
          Never bet more than you can afford to lose. If you or someone you know has a gambling problem,
          call the National Problem Gambling Helpline: <strong style="color:var(--text)">1-800-522-4700</strong>.
        </div>
      </div>
    </div>
  `;

  document.title = `${away.name} @ ${home.name} — The Bet`;
  } catch(err) {
    document.getElementById("content").innerHTML = `
      <div class="empty">
        <div class="empty-icon">⚠️</div>
        <div class="empty-title">Error loading game</div>
        <div class="empty-sub" style="font-family:monospace;font-size:.75rem;color:var(--danger);max-width:90%;word-break:break-all;margin-top:8px">${err && err.message ? err.message : String(err)}</div>
        <a href="games.html" class="btn btn-primary" style="margin-top:16px;display:inline-flex">← Back to Games</a>
      </div>`;
    console.error("Game render error:", err);
  }
}
</script>
</body>
</html>
