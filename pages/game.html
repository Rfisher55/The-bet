<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Game Analysis — The Bet</title>
  <link rel="stylesheet" href="../css/main.css" />
  <style>
    /* ── Meter bars ── */
    .meter-track { height: 8px; background: var(--border); border-radius: 4px; overflow: hidden; }
    .meter-fill  { height: 100%; border-radius: 4px; transition: width .6s ease; }
    /* ── Xfactor cards ── */
    .xf-critical { border-color: rgba(239,68,68,.6) !important; background: rgba(239,68,68,.06) !important; }
    .xf-high     { border-color: rgba(245,158,11,.55) !important; background: rgba(245,158,11,.06) !important; }
    .xf-medium   { border-color: rgba(251,191,36,.5) !important; background: rgba(251,191,36,.05) !important; }
    .xf-low      { border-color: rgba(100,116,139,.4) !important; background: rgba(100,116,139,.04) !important; }
    /* ── Grade ── */
    .model-grade {
      width: 88px; height: 88px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 2.4rem; font-weight: 900; flex-shrink: 0;
    }
    .grade-a-plus { background: rgba(16,185,129,.15); border: 3px solid var(--primary); color: var(--primary); box-shadow: var(--glow-green); }
    .grade-a      { background: rgba(16,185,129,.12); border: 3px solid #34d399; color: #34d399; }
    .grade-b      { background: rgba(99,102,241,.12); border: 3px solid var(--accent); color: var(--accent); }
    .grade-c      { background: rgba(245,158,11,.12); border: 3px solid var(--gold); color: var(--gold); }
    .grade-d      { background: rgba(239,68,68,.12); border: 3px solid var(--danger); color: var(--danger); }
    /* ── Distraction meter colors ── */
    .dist-low  { background: var(--primary); }
    .dist-mid  { background: var(--gold); }
    .dist-high { background: #f97316; }
    .dist-crit { background: var(--danger); }
    /* ── Perf bar colors ── */
    .perf-bar { height: 6px; border-radius: 3px; overflow: hidden; background: var(--border); }
    .perf-fill { height: 100%; border-radius: 3px; background: linear-gradient(90deg, var(--accent), var(--primary)); }
    /* ── Section divider ── */
    .sec-divider { border: none; border-top: 1px solid var(--border); margin: 20px 0; }
    /* ── Alert banner ── */
    .alert-banner {
      border-radius: var(--radius-lg); padding: 14px 20px; margin-bottom: 20px;
      display: flex; align-items: flex-start; gap: 14px;
      border: 1px solid;
    }
    .alert-trap { border-color: rgba(245,158,11,.5); background: rgba(245,158,11,.08); }
    .alert-injury { border-color: rgba(239,68,68,.5); background: rgba(239,68,68,.08); }
    .alert-sharp { border-color: rgba(16,185,129,.5); background: rgba(16,185,129,.08); }
    /* ── Pulse dot ── */
    .pulse-dot {
      width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; margin-top: 3px;
      animation: pulse 2s infinite;
    }
    /* ── Timeline ── */
    .timeline-item { display: flex; gap: 10px; align-items: flex-start; margin-bottom: 8px; font-size: .78rem; }
    .tl-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; margin-top: 4px; }
    /* ── Sharp arrow ── */
    .sharp-arrow { font-size: 1.8rem; font-weight: 900; line-height: 1; }
    /* ── Radar bars ── */
    .radar-row { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; font-size: .75rem; }
    .radar-label { width: 100px; color: var(--muted); flex-shrink: 0; cursor: pointer; display:flex; align-items:center; gap:3px; }
    .radar-label:hover { color: var(--muted-l); }
    .radar-track { flex: 1; min-width: 0; height: 6px; background: var(--border); border-radius: 3px; overflow: hidden; }
    .radar-fill { height: 100%; border-radius: 3px; }
    .radar-val { width: 28px; text-align: right; font-weight: 700; color: var(--text-soft); }
    /* ── Metric tooltip ── */
    .metric-tooltip-popup { position:fixed; z-index:10001; background:var(--card); border:1px solid var(--border-l); border-radius:10px; padding:10px 14px; font-size:.72rem; color:var(--text-soft); line-height:1.55; max-width:230px; box-shadow:0 8px 24px rgba(0,0,0,.6); display:none; }
    .metric-tooltip-popup .mtp-title { font-weight:800; color:var(--text); font-size:.75rem; margin-bottom:4px; }
    /* ── Coach collapsible ── */
    .coach-details summary { font-size:.72rem; color:var(--muted-l); cursor:pointer; padding:6px 0 2px; list-style:none; display:flex; align-items:center; gap:4px; }
    .coach-details summary::-webkit-details-marker { display:none; }
    .coach-details[open] summary .coach-chevron { transform:rotate(90deg); }
    .coach-chevron { transition:transform .2s; display:inline-block; }
    /* ── Overflow fixes ── */
    .flex.justify-between > * { min-width: 0; overflow-wrap: break-word; word-break: break-word; }
    .flex.justify-between > *:last-child { text-align: right; flex-shrink: 0; padding-left: 8px; }
    /* ── Hot seat flames ── */
    .flames { color: #ef4444; letter-spacing: -2px; font-size: .95rem; }
    /* ── Key Insight Box ── */
    .key-insight-box {
      border-radius: var(--radius-lg); padding: 18px 20px; margin-bottom: 20px;
      border: 1px solid rgba(16,185,129,.2);
      border-left-width: 4px;
      background: linear-gradient(135deg, rgba(16,185,129,.07) 0%, var(--card) 100%);
      position: relative;
    }
    .key-insight-badge {
      font-size: .6rem; font-weight: 900; letter-spacing: 2px; text-transform: uppercase;
      color: var(--primary); background: var(--card); padding: 0 8px;
      position: absolute; top: -1px; left: 14px; transform: translateY(-50%);
      border: 1px solid rgba(16,185,129,.3); border-radius: 10px;
    }
    .key-insight-pick {
      font-size: 1.25rem; font-weight: 900; color: var(--text); line-height: 1.2;
    }
    .key-insight-conf-elite  { color: var(--primary); }
    .key-insight-conf-high   { color: #34d399; }
    .key-insight-conf-medium { color: var(--gold); }
    .key-insight-conf-low    { color: var(--muted-l); }
    /* ── Win Gauge (SVG circle) ── */
    .win-gauge-wrap {
      display: flex; flex-direction: column; align-items: center; gap: 6px;
      padding: 16px 0 10px;
    }
    .win-gauge-svg { overflow: visible; }
    .win-gauge-bg  { fill: none; }
    .win-gauge-arc { fill: none; stroke-linecap: round; }
    .win-gauge-center { text-anchor: middle; dominant-baseline: central; }
    /* ── Share button ── */
    .share-pick-btn {
      display: inline-flex; align-items: center; gap: 6px;
      font-size: .72rem; font-weight: 700; padding: 6px 14px;
      border-radius: 20px; border: 1px solid var(--border-l);
      background: var(--surface); color: var(--muted-l); cursor: pointer;
      transition: background .15s, color .15s, border-color .15s;
    }
    .share-pick-btn:hover { background: var(--card); color: var(--text); border-color: var(--primary); }
    .share-pick-btn.copied { background: rgba(16,185,129,.12); color: var(--primary); border-color: var(--primary); }
    /* ── 7-signal icon circles ── */
    .sig-icon-circle {
      width: 28px; height: 28px; border-radius: 50%; flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      font-size: .88rem; background: var(--surface); border: 1px solid var(--border);
    }
    .sig-fill-circle {
      width: 12px; height: 12px; border-radius: 50%; flex-shrink: 0; border: 2px solid;
    }
    /* ── Section nav (sticky right TOC) ── */
    .section-toc {
      position: fixed; right: 16px; top: 50%; transform: translateY(-50%);
      z-index: 900; display: flex; flex-direction: column; gap: 4px;
      background: var(--card); border: 1px solid var(--border);
      border-radius: var(--radius-lg); padding: 8px 6px;
      box-shadow: 0 4px 20px rgba(0,0,0,.4);
    }
    .section-toc-item {
      font-size: .6rem; font-weight: 700; letter-spacing: .5px;
      color: var(--muted); cursor: pointer; padding: 4px 8px;
      border-radius: 6px; white-space: nowrap; text-align: center;
      transition: background .15s, color .15s;
    }
    .section-toc-item:hover { background: var(--surface); color: var(--primary); }
    @media (max-width: 1100px) { .section-toc { display: none; } }
    /* ── Improved empty state ── */
    .empty-card {
      max-width: 480px; margin: 60px auto; padding: 40px 32px;
      background: var(--card); border: 1px solid var(--border);
      border-radius: var(--radius-lg); text-align: center;
    }
    .empty-card-icon { font-size: 3rem; margin-bottom: 16px; }
    .empty-card-title { font-size: 1.4rem; font-weight: 900; color: var(--text); margin-bottom: 8px; }
    .empty-card-sub   { font-size: .875rem; color: var(--muted-l); line-height: 1.65; margin-bottom: 20px; }
    /* ── Momentum arrow ── */
    .mom-up    { color: var(--primary); font-size: 1.4rem; font-weight: 900; }
    .mom-stable{ color: var(--gold);    font-size: 1.4rem; font-weight: 900; }
    .mom-down  { color: var(--danger);  font-size: 1.4rem; font-weight: 900; }
    /* ── Responsive player grid ── */
    .player-exp-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    @media (max-width: 800px) { .player-exp-grid { grid-template-columns: 1fr; } }
    /* ── Insider intel box ── */
    .insider-intel-box {
      border: 1px solid rgba(16,185,129,.35);
      background: rgba(16,185,129,.05);
      border-radius: var(--radius); padding: 12px;
      position: relative;
    }
    .insider-intel-box::before {
      content: "INSIDER INTEL";
      position: absolute; top: -1px; left: 12px;
      font-size: .6rem; font-weight: 800; letter-spacing: 1.5px;
      color: var(--primary); background: var(--card);
      padding: 0 6px; transform: translateY(-50%);
    }
    /* ── Line movement ── */
    .line-move-track {
      height: 6px; background: var(--border); border-radius: 3px;
      position: relative; margin: 8px 0;
    }
    .line-move-marker {
      position: absolute; top: 50%; transform: translate(-50%, -50%);
      width: 14px; height: 14px; border-radius: 50%;
    }
    /* ── Weather icons big ── */
    .wx-icon { font-size: 2rem; }
    /* ── Trap meter ── */
    .trap-meter-track {
      height: 12px; border-radius: 6px; overflow: hidden;
      background: linear-gradient(90deg, #22c55e, #f59e0b 40%, #ef4444 80%, #991b1b);
    }
    .trap-meter-needle {
      position: relative; height: 12px;
    }
    .trap-meter-indicator {
      position: absolute; top: -4px; transform: translateX(-50%);
      width: 4px; height: 20px; background: #fff; border-radius: 2px;
      box-shadow: 0 0 6px rgba(0,0,0,.5);
    }
    /* ── Composite score box ── */
    .comp-score-box {
      border-radius: 10px; padding: 16px; text-align: center;
    }
    /* ── Small helper ── */
    .gap-1 { gap: 4px; }
    .text-xxs { font-size: .65rem; }
    .lh-tight { line-height: 1.35; }
    .block { display: block; }
    /* ── Roster grid ── */
    .roster-player-row { padding:8px 10px;border-radius:8px;border:1px solid var(--border);background:var(--surface);margin-bottom:6px;cursor:pointer;transition:border-color .15s; }
    .roster-player-row:hover { border-color:var(--border-l); }
    .roster-player-detail { display:none;margin-top:10px;border-top:1px solid var(--border);padding-top:10px; }
    /* ── Matchup grade ── */
    .matchup-grade-card { padding:14px;border-radius:var(--radius-lg);border:1px solid var(--border);background:var(--surface); }
    /* ── Social hub ── */
    .beat-writer-card { padding:12px;border-radius:var(--radius);border:1px solid var(--border-l);background:var(--surface);position:relative;margin-bottom:10px; }
    .beat-writer-flag { position:absolute;top:-1px;left:10px;font-size:.58rem;font-weight:800;letter-spacing:1px;text-transform:uppercase;background:var(--card);padding:0 6px;transform:translateY(-50%); }
    /* ── Line movement ── */
    .line-step { display:flex;align-items:flex-start;gap:10px;margin-bottom:10px; }
    .line-step-dot { width:10px;height:10px;border-radius:50%;flex-shrink:0;margin-top:3px; }
    .line-step-line { position:absolute;left:4px;top:12px;bottom:-10px;width:2px;background:var(--border); }
  </style>
</head>

<script>
/* ─────────────────────────────────────────────────────
   UTILITIES
───────────────────────────────────────────────────── */
const q  = (s, ctx) => (ctx || document).querySelector(s);
const qq = (s, ctx) => [...(ctx || document).querySelectorAll(s)];

function safe(fn, fallback) {
  try { const v = fn(); return v === undefined || v === null ? fallback : v; }
  catch { return fallback; }
}

function togglePlayer(id) {
  const el = document.getElementById('pd-' + id);
  if (el) { const showing = el.style.display !== 'none'; el.style.display = showing ? 'none' : 'block'; }
}

function togglePlayerCard(id) {
  const el   = document.getElementById(id);
  const chev = document.getElementById(id + '-chev');
  if (!el) return;
  const open = el.style.display !== 'none';
  el.style.display = open ? 'none' : 'block';
  if (chev) chev.textContent = open ? '▸' : '▾';
}

function gradeClass(g) {
  if (!g) return "grade-c";
  const map = { "A+": "grade-a-plus", "A": "grade-a", "B": "grade-b", "C": "grade-c", "D": "grade-d" };
  return map[g] || "grade-c";
}

function distrClass(v) {
  if (v <= 3) return "dist-low";
  if (v <= 6) return "dist-mid";
  if (v <= 8) return "dist-high";
  return "dist-crit";
}

function momArrow(m) {
  if (!m) return "";
  const lc = m.toLowerCase();
  if (lc.includes("ris") || lc.includes("up"))   return '<span class="mom-up">↑</span>';
  if (lc.includes("dow") || lc.includes("decl"))  return '<span class="mom-down">↓</span>';
  return '<span class="mom-stable">→</span>';
}

function flames(level) {
  const n = level <= 3 ? 1 : level <= 6 ? 2 : 3;
  return '<span class="flames">' + "🔥".repeat(n) + '</span>';
}

const METRIC_GLOSSARY = {
  "Clutch":      { desc: "Performance in 4th-quarter and overtime crunch situations.", icon: "⚡" },
  "Big Game":    { desc: "Performance vs. ranked opponents and in high-stakes matchups.", icon: "🏆" },
  "Cold Wx":     { desc: "Performance when game-time temperature is below 40°F.", icon: "❄️" },
  "Road":        { desc: "Performance in hostile away environments with crowd noise.", icon: "✈️" },
  "Primetime":   { desc: "Performance in prime-time night games and nationally-televised matchups.", icon: "📺" },
  "Consistency": { desc: "Game-to-game reliability — avoids boom/bust outputs.", icon: "📊" },
  "Pressure":    { desc: "Ability to perform under or while generating pass-rush pressure. For QBs: keeping composure when hit. For defenders: disrupting the pocket.", icon: "💨" },
};

function showMetricTip(e, key) {
  const info = METRIC_GLOSSARY[key];
  if (!info) return;
  e.stopPropagation();
  let tt = document.getElementById("metric-tooltip-popup");
  if (!tt) {
    tt = document.createElement("div");
    tt.id = "metric-tooltip-popup";
    tt.className = "metric-tooltip-popup";
    tt.innerHTML = `<div class="mtp-title"></div><div class="mtp-body"></div>`;
    document.body.appendChild(tt);
    document.addEventListener("click", () => { tt.style.display = "none"; });
  }
  tt.querySelector(".mtp-title").textContent = info.icon + " " + key;
  tt.querySelector(".mtp-body").textContent = info.desc;
  tt.style.display = "block";
  const r = e.currentTarget.getBoundingClientRect();
  const left = Math.min(r.left, window.innerWidth - 250);
  const top = r.bottom + 6;
  tt.style.left = left + "px";
  tt.style.top = (top + window.scrollY) + "px";
  tt.style.position = "absolute";
}

function radarBar(label, val, color) {
  const v = Math.min(100, Math.max(0, val || 0));
  const hasInfo = !!METRIC_GLOSSARY[label];
  return `
    <div class="radar-row">
      <span class="radar-label" ${hasInfo ? `onclick="showMetricTip(event,'${label}')" title="Tap for definition"` : ""}>${label}${hasInfo ? `<span style="color:var(--muted);font-size:.65rem;opacity:.7">ⓘ</span>` : ""}</span>
      <div class="radar-track"><div class="radar-fill" style="width:${v}%;background:${color || "var(--primary)"}"></div></div>
      <span class="radar-val">${v}</span>
    </div>`;
}

function meterBar(val, max, color, height) {
  const pct = Math.min(100, Math.max(0, (val / (max || 100)) * 100));
  const h = height || 8;
  return `<div class="meter-track" style="height:${h}px"><div class="meter-fill" style="width:${pct}%;background:${color || "var(--primary)"}"></div></div>`;
}

function severityClass(sev) {
  const map = { critical: "xf-critical", high: "xf-high", medium: "xf-medium", low: "xf-low" };
  return map[(sev || "").toLowerCase()] || "xf-low";
}

function severityColor(sev) {
  const map = { critical: "var(--danger)", high: "var(--gold)", medium: "#fbbf24", low: "var(--muted)" };
  return map[(sev || "").toLowerCase()] || "var(--muted)";
}

function catIcon(cat) {
  const map = {
    injury: "🩹", weather: "🌦️", travel: "✈️", emotional: "🔥", rivalry: "⚔️",
    distraction: "😮", momentum: "📈", scheme: "🎯", crowd: "📣", suspension: "🚫",
    transfer: "🔄", coaching: "🧠", discipline: "⚠️", nil: "💰"
  };
  return map[(cat || "").toLowerCase()] || "📌";
}

function strengIcon(s) {
  const lc = (s || "").toLowerCase();
  if (lc.includes("extreme")) return "🔴";
  if (lc.includes("strong"))  return "🟠";
  if (lc.includes("mod"))     return "🟡";
  return "⚪";
}

/* ─────────────────────────────────────────────────────
   BOOT
───────────────────────────────────────────────────── */
const params  = new URLSearchParams(location.search);
const gameId  = params.get("id");

function renderGamePage(gData) {
  try {
  const game = resolveGame(gData);
  const pred = predictGame(game);
  const { homeTeam: home, awayTeam: away } = game;

  const isHomeFavored = pred.predictedSpread >= 0;
  const winner        = isHomeFavored ? home : away;
  const winnerPct     = pred.winProbability;
  const homePct       = isHomeFavored ? winnerPct : 100 - winnerPct;
  const awayPct       = 100 - homePct;

  const halfTotal  = pred.predictedTotal / 2;
  const halfSpread = Math.abs(pred.predictedSpread) / 2;
  const homeScore  = isHomeFavored ? halfTotal + halfSpread : halfTotal - halfSpread;
  const awayScore  = isHomeFavored ? halfTotal - halfSpread : halfTotal + halfSpread;

  const confCls = { elite: "badge-elite", high: "badge-high", medium: "badge-medium", low: "badge-low" }[pred.confidence] || "badge-low";
  const confLbl = { elite: "ELITE PICK", high: "HIGH CONFIDENCE", medium: "MODERATE", low: "LOW CONFIDENCE" }[pred.confidence] || "UNRATED";

  /* helpers for factors */
  const fIcon  = im => im === "positive" ? "↑" : im === "negative" ? "↓" : "→";
  const fColor = im => im === "positive" ? "var(--primary)" : im === "negative" ? "var(--danger)" : "var(--muted)";

  /* social buzz */
  const buzz = pred.socialBuzz || {};
  const platCls = p => `platform-${(p || "").replace("-", "_").replace(" ", "_")}`;
  const platLbl = { twitter: "𝕏 Twitter", reddit: "R Reddit", insider: "★ Insider", "beat-writer": "✎ Beat Writer" };

  /* players */
  const allPlayers = (typeof KEY_PLAYERS !== "undefined" ? KEY_PLAYERS : [])
    .filter(p => p.teamId === home.id || p.teamId === away.id);

  /* model breakdown */
  const bd = pred.modelBreakdown || {};
  const bdItems = [
    { label: "Offense vs Defense Matchup", value: bd.offenseVsDefense    || 0, color: "var(--accent)" },
    { label: "Recent Form",                value: bd.recentForm           || 0, color: "var(--primary)" },
    { label: "Home Field Advantage",       value: bd.homeFieldAdvantage   || 0, color: "#34d399" },
    { label: "Head-to-Head History",       value: bd.headToHead           || 0, color: "var(--gold)" },
    { label: "Coaching Edge",              value: bd.coachingEdge         || 0, color: "#c084fc" },
    { label: "Recruiting / Talent",        value: bd.recruitingEdge       || 0, color: "#38bdf8" },
    { label: "Social Signal",              value: bd.socialSignal         || 0, color: "#f472b6" },
  ];

  /* stat comparison */
  const statRows = [
    { label: "Points / Game",         hv: home.stats.pointsPerGame,        av: away.stats.pointsPerGame,        fmt: v => v.toFixed(1),          hib: true },
    { label: "Points Allowed / Game", hv: home.stats.pointsAllowedPerGame, av: away.stats.pointsAllowedPerGame, fmt: v => v.toFixed(1),          hib: false },
    { label: "Total Yards / Game",    hv: home.stats.yardsPerGame,         av: away.stats.yardsPerGame,         fmt: v => v.toFixed(0),          hib: true },
    { label: "Yards Allowed / Game",  hv: home.stats.yardsAllowedPerGame,  av: away.stats.yardsAllowedPerGame,  fmt: v => v.toFixed(0),          hib: false },
    { label: "Passing Yards / Game",  hv: home.stats.passingYardsPerGame,  av: away.stats.passingYardsPerGame,  fmt: v => v.toFixed(0),          hib: true },
    { label: "Rushing Yards / Game",  hv: home.stats.rushingYardsPerGame,  av: away.stats.rushingYardsPerGame,  fmt: v => v.toFixed(0),          hib: true },
    { label: "3rd Down %",            hv: home.stats.thirdDownPct,         av: away.stats.thirdDownPct,         fmt: v => (v*100).toFixed(1)+"%",hib: true },
    { label: "Red Zone %",            hv: home.stats.redZonePct,           av: away.stats.redZonePct,           fmt: v => (v*100).toFixed(1)+"%",hib: true },
    { label: "Turnover Margin",       hv: home.stats.turnoversForced - home.stats.turnoversPerGame,
                                      av: away.stats.turnoversForced - away.stats.turnoversPerGame,  fmt: v => v.toFixed(1),          hib: true },
    { label: "Sacks / Game",          hv: home.stats.sacks,                av: away.stats.sacks,                fmt: v => v.toFixed(1),          hib: true },
  ];

  /* ── SECTION RENDERERS ──────────────────────────────── */

  /* 2 — Alert Banner */
  function renderAlertBanner() {
    const alerts = [];
    if (pred.trapGameAlert)  alerts.push({ cls: "alert-trap",   dot: "var(--gold)",    icon: "⚠️",  title: "TRAP GAME ALERT", msg: "Model flags a potential trap spot. Situational factors suggest underdog may over-perform." });
    if (pred.injuryAlert)    alerts.push({ cls: "alert-injury", dot: "var(--danger)",  icon: "🩹",  title: "INJURY ALERT",    msg: "Key player injury uncertainty detected. Monitor final practice reports and official depth chart." });
    if (pred.sharpAlert)     alerts.push({ cls: "alert-sharp",  dot: "var(--primary)", icon: "💰",  title: "SHARP MONEY ALERT",msg: "Professional sharp money movement detected. Smart money is pushing the line in one direction." });
    if (!alerts.length) return "";
    return alerts.map(a => `
      <div class="alert-banner ${a.cls}">
        <span class="pulse-dot" style="background:${a.dot}"></span>
        <div>
          <div style="font-size:.7rem;font-weight:800;letter-spacing:1.5px;text-transform:uppercase;color:${a.dot};margin-bottom:3px">${a.icon} ${a.title}</div>
          <div style="font-size:.83rem;color:var(--text-soft);line-height:1.5">${a.msg}</div>
        </div>
      </div>`).join("");
  }

  /* 3a — Key Insight TL;DR Box */
  function renderKeyInsight() {
    const gp = game.gamePreview;
    const pickTeam = gp && gp.thePick && gp.thePick.team ? gp.thePick.team : winner.name;
    const pickLine = gp && gp.thePick && gp.thePick.line ? " " + gp.thePick.line : (pred.predictedSpread ? " " + fmtSpread(-pred.predictedSpread) : "");
    const pickConf = gp && gp.thePick && gp.thePick.confidence ? gp.thePick.confidence : (pred.confidence || "medium").toUpperCase();
    const confClass = { "ELITE": "key-insight-conf-elite", "HIGH": "key-insight-conf-high", "MEDIUM": "key-insight-conf-medium", "LOW": "key-insight-conf-low" }[pickConf] || "key-insight-conf-medium";
    const confLabel = { "ELITE": "Elite Confidence", "HIGH": "High Confidence", "MEDIUM": "Moderate Confidence", "LOW": "Low Confidence" }[pickConf] || "Moderate Confidence";

    // top xfactor
    const xf = safe(() => pred.xFactors, null) || safe(() => game.xFactors, null) || [];
    const topXf = xf.length ? xf.reduce((a, b) => ((b.severity || "").toLowerCase() === "critical" ? b : (a.severity || "").toLowerCase() !== "critical" && (b.severity || "").toLowerCase() === "high" ? b : a), xf[0]) : null;

    // border color — winner's team color
    const borderColor = isHomeFavored ? home.color : away.color;

    return `
      <div class="key-insight-box" style="border-left-color:${borderColor};background:linear-gradient(135deg,${borderColor}08 0%,var(--card) 70%)">
        <div class="key-insight-badge">TL;DR — Model Snapshot</div>
        <div style="display:flex;align-items:flex-start;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-top:6px">
          <div style="flex:1;min-width:200px">
            <div style="font-size:.6rem;font-weight:800;letter-spacing:2px;text-transform:uppercase;color:var(--muted-l);margin-bottom:5px">TOP PICK</div>
            <div class="key-insight-pick">${pickTeam}${pickLine}</div>
            <div style="font-size:.78rem;color:var(--muted-l);margin-top:4px">
              Win Probability: <strong style="color:${borderColor}">${isHomeFavored ? homePct : awayPct}%</strong>
              · Projected ${Math.round(homeScore)}&ndash;${Math.round(awayScore)}
            </div>
          </div>
          <div style="display:flex;flex-direction:column;align-items:center;gap:4px;flex-shrink:0;padding:10px 14px;border-radius:var(--radius);background:${borderColor}12;border:1px solid ${borderColor}30">
            <div style="font-size:.58rem;font-weight:800;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted-l)">Confidence</div>
            <div class="${confClass}" style="font-size:1rem;font-weight:900">${pickConf}</div>
            <div style="font-size:.62rem;color:var(--muted)">${confLabel}</div>
          </div>
        </div>
        ${topXf ? `
        <div style="margin-top:12px;padding:10px 12px;border-radius:var(--radius);background:rgba(255,255,255,.03);border:1px solid ${borderColor}20;display:flex;align-items:flex-start;gap:8px">
          <span style="font-size:1rem;flex-shrink:0">${catIcon(topXf.category)}</span>
          <div>
            <div style="font-size:.6rem;font-weight:800;letter-spacing:1.5px;text-transform:uppercase;color:${severityColor(topXf.severity)};margin-bottom:2px">#1 X-Factor · ${(topXf.severity||"").toUpperCase()}</div>
            <div style="font-size:.78rem;color:var(--text-soft);line-height:1.5"><strong style="color:var(--text)">${topXf.title}</strong> — ${topXf.description}</div>
          </div>
        </div>` : ""}
      </div>`;
  }

  /* 3b — Game Preview / Written Analysis */
  function renderGamePreview() {
    const gp = game.gamePreview;
    if (!gp) return "";
    const pickTeam = gp.thePick && gp.thePick.team ? gp.thePick.team : "";
    const pickLine = gp.thePick && gp.thePick.line ? gp.thePick.line : "";
    const pickConf = gp.thePick && gp.thePick.confidence ? gp.thePick.confidence : "";
    const pickUnit = gp.thePick && gp.thePick.unit ? gp.thePick.unit : 1;
    const pickReason = gp.thePick && gp.thePick.reasoning ? gp.thePick.reasoning : "";
    const confColor = { HIGH: "var(--primary)", MEDIUM: "var(--gold)", LOW: "var(--muted)" }[pickConf] || "var(--muted)";
    const analysisHTML = (gp.analysis || []).map(a => `
      <div style="margin-bottom:18px">
        <div style="display:flex;align-items:center;gap:8px;margin-bottom:7px">
          <span style="font-size:.65rem;font-weight:900;letter-spacing:2px;text-transform:uppercase;color:var(--muted-l)">${a.section}</span>
        </div>
        <p style="font-size:.875rem;color:var(--text-soft);line-height:1.75;margin:0">${a.text}</p>
      </div>`).join("");
    return `
      <div class="card card-p mb-5" style="border-color:rgba(16,185,129,.25);background:linear-gradient(135deg,rgba(16,185,129,.04) 0%,var(--card) 60%)">
        <div class="section-label mb-4">Game Analysis &amp; Preview</div>
        <h2 style="font-size:1.2rem;font-weight:900;color:var(--text);letter-spacing:.5px;margin-bottom:10px;line-height:1.35">${gp.headline || ""}</h2>
        <p style="font-size:.9rem;color:var(--text-soft);line-height:1.8;margin-bottom:22px;padding-bottom:18px;border-bottom:1px solid var(--border)">${gp.synopsis || ""}</p>
        ${analysisHTML}
        ${pickTeam ? `
        <div style="margin-top:20px;padding:16px 20px;border-radius:var(--radius-lg);background:rgba(16,185,129,.08);border:1px solid rgba(16,185,129,.3);display:flex;align-items:flex-start;justify-content:space-between;flex-wrap:wrap;gap:14px">
          <div>
            <div style="font-size:.65rem;font-weight:900;letter-spacing:2px;text-transform:uppercase;color:var(--muted-l);margin-bottom:6px">The Bet Model Pick</div>
            <div style="font-size:1.3rem;font-weight:900;color:var(--primary)">${pickTeam} ${pickLine}</div>
            <div style="font-size:.78rem;color:var(--muted-l);margin-top:4px;line-height:1.5">${pickReason}</div>
          </div>
          <div style="display:flex;flex-direction:column;align-items:center;gap:4px;flex-shrink:0">
            <div style="font-size:.65rem;font-weight:800;letter-spacing:1px;text-transform:uppercase;color:${confColor};border:1px solid ${confColor};border-radius:20px;padding:2px 12px">${pickConf}</div>
            <div style="font-size:.72rem;color:var(--muted)">Units: ${pickUnit}</div>
          </div>
        </div>` : ""}
      </div>`;
  }

  /* 3c — Key Players */
  function selectKeyPlayers(players, max) {
    const MAX = max || 6;
    const posPriority = {
      QB:0, RB:1, WR:2, TE:3, EDGE:4, DE:4, DL:5, DT:5,
      LB:6, OLB:6, ILB:6, MLB:6, CB:7, S:8, DB:8, FS:8, SS:8, NB:8,
      K:9, P:10, OL:11, NT:12, FB:13, LS:14, RS:15
    };
    return [...players].sort((a, b) => {
      const ai = (a.injuryStatus && a.injuryStatus !== "healthy") ? 0 : 1;
      const bi = (b.injuryStatus && b.injuryStatus !== "healthy") ? 0 : 1;
      if (ai !== bi) return ai - bi;
      const ap2 = posPriority[a.position] !== undefined ? posPriority[a.position] : 99;
      const bp2 = posPriority[b.position] !== undefined ? posPriority[b.position] : 99;
      return ap2 - bp2;
    }).slice(0, MAX);
  }

  function renderFullRoster() {
    const POS_GROUPS = [
      { label: "OFFENSE", positions: ["QB","RB","WR","TE","OL","FB","H-B"] },
      { label: "D-LINE / LINEBACKERS", positions: ["DL","DE","DT","EDGE","LB","OLB","ILB","MLB","NT"] },
      { label: "SECONDARY", positions: ["CB","S","DB","FS","SS","NB","SAF"] },
      { label: "SPECIAL TEAMS", positions: ["K","P","LS","RS","KR","PR"] }
    ];
    function whyNotActive(p) {
      const parts = [];
      const inj = (p.injuryType || "").trim();
      if (inj && inj !== "none" && inj !== "null") parts.push(inj);
      if (p.practiceStatus && !/^full$/i.test(p.practiceStatus)) parts.push(p.practiceStatus);
      if (!parts.length && p.injuryHistory && p.injuryHistory.length) {
        const recent = p.injuryHistory[p.injuryHistory.length - 1];
        if (recent.type) parts.push(recent.type);
        if (recent.note && parts.length < 2) parts.push(recent.note.slice(0, 40));
      }
      return parts.join(" · ");
    }
    function statusBadge(p) {
      const s = (p.injuryStatus || "healthy").toLowerCase();
      if (s === "healthy") return `<span style="font-size:.58rem;padding:1px 6px;border-radius:8px;background:rgba(16,185,129,.12);border:1px solid rgba(16,185,129,.3);color:var(--primary);font-weight:700">✓ ACTIVE</span>`;
      const c = s === "out" ? ["rgba(239,68,68,.2)","rgba(239,68,68,.5)","var(--danger)"] : s === "doubtful" ? ["rgba(239,68,68,.1)","rgba(239,68,68,.3)","#f87171"] : ["rgba(148,163,184,.12)","rgba(148,163,184,.35)","var(--muted)"];
      const why = whyNotActive(p);
      return `<span style="font-size:.58rem;padding:1px 6px;border-radius:8px;background:${c[0]};border:1px solid ${c[1]};color:${c[2]};font-weight:700">${s.toUpperCase()}${why ? " · " + why : ""}</span>`;
    }
    function keyStat(p) {
      const s = p.stats || {};
      const pos = p.position;
      if (pos === "QB") return s.passingYards ? `${s.passingYards} yds · ${s.passingTDs||0} TD · ${s.interceptions||0} INT` : "";
      if (pos === "RB") return s.rushingYards ? `${s.rushingYards} rush yds · ${s.rushingTDs||0} TD` : "";
      if (["WR","TE"].includes(pos)) return s.receivingYards ? `${s.receivingYards} rec yds · ${s.receivingTDs||0} TD` : s.receptions ? `${s.receptions} rec` : "";
      if (["DL","DE","DT","EDGE"].includes(pos)) return s.sacks ? `${s.sacks} sacks` : s.tackles ? `${s.tackles} tkl` : "";
      if (["LB","OLB","ILB","MLB"].includes(pos)) return s.tackles ? `${s.tackles} tkl · ${s.sacks||0} sacks` : "";
      if (["CB","S","DB","FS","SS"].includes(pos)) return s.interceptionsDef ? `${s.interceptionsDef} INT · ${s.tackles||0} tkl` : s.tackles ? `${s.tackles} tkl` : "";
      return "";
    }
    function playerDetail(p, teamColor) {
      const ih = p.injuryHistory || [];
      const pf = p.personalFlags || null;
      const pm = p.performanceMetrics || null;
      const sr = p.scoutReport || null;
      const nil = p.nilSatisfaction;
      return `
        <div>
          ${p.heightWeight || p.hometown ? `<div style="font-size:.7rem;color:var(--muted-l);margin-bottom:8px">${p.heightWeight||""}${p.hometown?" · 📍 "+p.hometown:""}</div>` : ""}
          ${p.nflDraftStatus ? `<div style="margin-bottom:8px"><span style="font-size:.65rem;padding:2px 8px;border-radius:10px;background:rgba(245,158,11,.12);border:1px solid rgba(245,158,11,.3);color:var(--gold)">🏆 ${p.nflDraftStatus}</span></div>` : ""}
          ${ih.length ? `
            <div style="margin-bottom:10px;padding:8px 10px;background:rgba(239,68,68,.05);border:1px solid rgba(239,68,68,.15);border-radius:6px">
              <div style="font-size:.6rem;font-weight:900;letter-spacing:1.5px;text-transform:uppercase;color:#f87171;margin-bottom:5px">INJURY HISTORY</div>
              ${ih.map(ev => `<div style="font-size:.72rem;color:var(--text-soft);margin-bottom:3px"><span style="font-weight:700;color:${ev.impact==="high"?"var(--danger)":ev.impact==="medium"?"var(--gold)":"var(--muted)"}">${ev.year||""} ${ev.type||""}</span>${ev.note ? " — "+ev.note : ""}</div>`).join("")}
            </div>` : ""}
          ${pm ? `
            <div style="margin-bottom:10px">
              <div style="font-size:.6rem;font-weight:800;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted-l);margin-bottom:6px">PERFORMANCE METRICS</div>
              ${[
                ["Clutch",       pm.clutchRating],
                ["Big Game",     pm.bigGameRating],
                ["Cold Wx",      pm.coldWeatherRating],
                ["Road",         pm.roadGameRating],
                ["Primetime",    pm.primeTimeRating],
                ["Consistency",  pm.consistencyRating],
                ["Pressure",     pm.pressureRating],
              ].filter(([,v])=>v!==undefined).map(([lbl,v])=>radarBar(lbl,v,teamColor)).join("")}
            </div>` : ""}
          ${p.stats && Object.keys(p.stats).length ? `
            <div style="display:grid;grid-template-columns:repeat(2,1fr);gap:4px;margin-bottom:10px">
              ${Object.entries(p.stats).filter(([k,v])=>typeof v==="number"&&k!=="gamesPlayed").map(([k,v])=>`
                <div style="text-align:center;padding:6px 4px;background:var(--card);border:1px solid var(--border);border-radius:5px">
                  <div style="font-size:.58rem;color:var(--muted);overflow-wrap:break-word">${k.replace(/([A-Z])/g," $1").trim()}</div>
                  <div style="font-size:.85rem;font-weight:700;color:var(--text)">${typeof v==="number"&&v<1&&v>0?(v*100).toFixed(1)+"%":v}</div>
                </div>`).join("")}
            </div>` : ""}
          ${pf ? `
            <div style="margin-bottom:8px;padding:8px 10px;background:rgba(16,185,129,.04);border:1px solid rgba(16,185,129,.18);border-radius:6px;position:relative">
              <div style="font-size:.6rem;font-weight:800;letter-spacing:1.5px;text-transform:uppercase;color:var(--primary);margin-bottom:5px">INSIDER INTEL</div>
              ${pf.distractionNote ? `<div style="font-size:.76rem;color:var(--text-soft);font-style:italic;line-height:1.55;margin-bottom:5px">"${pf.distractionNote}"</div>` : ""}
              ${pf.socialMediaPattern ? `<div style="font-size:.7rem;color:var(--muted-l);margin-bottom:5px">🐦 Social: ${pf.socialMediaPattern}</div>` : ""}
              ${pf.distractionLevel > 0 ? `
                <div style="display:flex;align-items:center;gap:6px">
                  <span style="font-size:.65rem;color:var(--muted);flex-shrink:0">Focus Level ${pf.distractionLevel}/10</span>
                  <div style="flex:1;height:4px;background:var(--border);border-radius:2px;overflow:hidden"><div style="width:${pf.distractionLevel*10}%;height:100%;background:${pf.distractionLevel>=7?"var(--danger)":pf.distractionLevel>=5?"var(--gold)":"var(--primary)"}"></div></div>
                </div>` : ""}
            </div>` : ""}
          ${sr ? `<div style="margin-bottom:8px;padding:8px 10px;border-left:2px solid var(--accent);background:rgba(99,102,241,.05);border-radius:0 6px 6px 0"><div style="font-size:.6rem;font-weight:800;letter-spacing:1px;text-transform:uppercase;color:var(--accent);margin-bottom:4px">SCOUT REPORT</div><div style="font-size:.76rem;color:var(--text-soft);font-style:italic;line-height:1.55">"${typeof sr==="string"?sr:sr.summary||""}"</div></div>` : ""}
          ${nil !== undefined && nil !== null ? `
            <div style="display:flex;align-items:center;gap:6px">
              <span style="font-size:.65rem;color:var(--muted);flex-shrink:0">NIL Satisfaction</span>
              <div style="flex:1;height:4px;background:var(--border);border-radius:2px;overflow:hidden"><div style="width:${nil}%;height:100%;background:${nil>=70?"var(--primary)":nil>=40?"var(--gold)":"var(--danger)"}"></div></div>
              <span style="font-size:.65rem;font-weight:700;color:${nil>=70?"var(--primary)":nil>=40?"var(--gold)":"var(--danger)"}">${nil}/100</span>
            </div>` : ""}
        </div>`;
    }
    function teamPanel(team, players) {
      const grouped = POS_GROUPS.map(g => ({ ...g, pl: players.filter(p => g.positions.includes(p.position)) })).filter(g => g.pl.length > 0);
      if (!grouped.length) return `<div class="text-xs text-muted p-3">No player data</div>`;
      return grouped.map(g => `
        <div style="margin-bottom:14px">
          <div style="font-size:.58rem;font-weight:900;letter-spacing:2px;text-transform:uppercase;color:${readableOnDark(team.color)};border-bottom:1px solid ${team.color}35;padding-bottom:4px;margin-bottom:7px">${g.label}</div>
          ${g.pl.map(p => {
            const hasAlert = (p.personalFlags && p.personalFlags.distractionLevel >= 5) || (p.injuryStatus && p.injuryStatus !== "healthy");
            const alertParts = [];
            if (p.injuryStatus && p.injuryStatus !== "healthy") alertParts.push("Injury: " + p.injuryStatus + (p.injuryType && p.injuryType !== "none" ? " (" + p.injuryType + ")" : ""));
            if (p.personalFlags && p.personalFlags.distractionLevel >= 5) alertParts.push("Focus concern: level " + p.personalFlags.distractionLevel + "/10" + (p.personalFlags.distractionNote ? " — " + p.personalFlags.distractionNote : ""));
            const alertLabel = alertParts.length > 1 ? "ALERTS" : (p.injuryStatus && p.injuryStatus !== "healthy") ? "INJURY" : "FOCUS";
            const alertTip = alertParts.join(" | ");
            const ks = keyStat(p);
            return `
              <div class="roster-player-row" onclick="togglePlayer('${p.id}')" style="${hasAlert?"border-color:rgba(239,68,68,.3);background:rgba(239,68,68,.04);":""}">
                <div style="display:flex;align-items:center;gap:8px">
                  <div style="width:26px;height:26px;border-radius:50%;background:${team.color};display:flex;align-items:center;justify-content:center;font-size:.58rem;font-weight:700;color:${textForBg(team.color)};flex-shrink:0">#${p.number||"—"}</div>
                  <div style="flex:1;min-width:0">
                    <div style="display:flex;align-items:center;gap:5px;flex-wrap:wrap">
                      <span style="font-size:.85rem;font-weight:800;color:var(--text)">${p.name}</span>
                      <span style="font-size:.62rem;color:var(--muted)">${p.position} · ${p.year||""}</span>
                      ${statusBadge(p)}
                      ${hasAlert ? `<span title="${alertTip}" style="font-size:.58rem;padding:1px 5px;border-radius:5px;background:rgba(239,68,68,.1);color:#f87171;font-weight:700;cursor:help">⚠ ${alertLabel}</span>` : ""}
                    </div>
                    ${ks ? `<div style="font-size:.7rem;color:var(--muted-l);margin-top:1px">${ks}</div>` : ""}
                    ${(p.injuryStatus && p.injuryStatus !== "healthy") ? (() => {
                      const pf = p.personalFlags;
                      const focusShort = pf && pf.distractionLevel >= 5 ? (pf.distractionType ? pf.distractionType.replace(/_/g," ") : "focus concern") : "";
                      const sc2 = (p.injuryStatus||"").toLowerCase()==="out"?"#f87171":(p.injuryStatus||"").toLowerCase()==="doubtful"?"#f87171":"var(--muted)";
                      const reason = [whyNotActive(p), focusShort].filter(Boolean).join(" · ");
                      return reason ? `<div style="font-size:.68rem;color:${sc2};font-weight:600;margin-top:1px">↳ ${reason}</div>` : "";
                    })() : ""}
                  </div>
                  <span style="font-size:.72rem;color:var(--muted);flex-shrink:0">▾</span>
                </div>
                <div id="pd-${p.id}" class="roster-player-detail" style="display:none">
                  ${playerDetail(p, team.color)}
                </div>
              </div>`;
          }).join("")}
        </div>`).join("");
    }
    const hp = selectKeyPlayers(allPlayers.filter(p => p.teamId === home.id));
    const ap = selectKeyPlayers(allPlayers.filter(p => p.teamId === away.id));
    if (!hp.length && !ap.length) return "";
    return `
      <div class="card card-p mb-5" id="section-roster">
        <div class="section-label">Key Players <span style="font-size:.65rem;color:var(--muted);font-weight:400">· top 6 per team · tap to expand</span></div>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:20px">
          <div>
            <div style="display:flex;align-items:center;gap:8px;margin-bottom:12px">
              <div class="team-logo team-logo-sm" style="background:${away.color};color:${textForBg(away.color)}">${away.abbreviation.slice(0,3)}</div>
              <span style="font-size:.9rem;font-weight:800;color:var(--text)">${away.name}</span>
              <span style="font-size:.62rem;padding:1px 8px;border-radius:10px;background:${away.color}30;color:${readableOnDark(away.color)};font-weight:700;margin-left:auto">AWAY</span>
            </div>
            ${teamPanel(away, ap)}
          </div>
          <div>
            <div style="display:flex;align-items:center;gap:8px;margin-bottom:12px">
              <div class="team-logo team-logo-sm" style="background:${home.color};color:${textForBg(home.color)}">${home.abbreviation.slice(0,3)}</div>
              <span style="font-size:.9rem;font-weight:800;color:var(--text)">${home.name}</span>
              <span style="font-size:.62rem;padding:1px 8px;border-radius:10px;background:${home.color}30;color:${readableOnDark(home.color)};font-weight:700;margin-left:auto">HOME</span>
            </div>
            ${teamPanel(home, hp)}
          </div>
        </div>
      </div>`;
  }

  /* 3d — Position Group Matchup Analysis */
  function renderPositionMatchups() {
    function letter(score) {
      const a = Math.abs(score);
      if (a >= 18) return "A+"; if (a >= 12) return "A"; if (a >= 7) return "B+";
      if (a >= 4) return "B"; if (a >= 2) return "C"; return "D";
    }
    function lcolor(score) {
      const a = Math.abs(score);
      if (a >= 18) return "var(--primary)"; if (a >= 12) return "#34d399"; if (a >= 7) return "var(--gold)";
      if (a >= 4) return "#94a3b8"; return "var(--danger)";
    }
    const hs = home.stats, as_ = away.stats;
    const matchups = [
      {
        icon: "⚡", label: "OFFENSIVE LINE vs D-LINE",
        score: (hs.rushingYardsPerGame - as_.yardsAllowedPerGame * 0.4) * 0.35 + (hs.sacks - as_.sacksAllowed) * 1.8,
        home_lbl: `${home.abbreviation} OL / Run Game`,
        away_lbl: `${away.abbreviation} Defensive Line`,
        gen: (w, s) => s > 0 ? `${home.name} wins the trenches — ${hs.rushingYardsPerGame} rush yds/gm vs ${away.name}'s ${(as_.yardsAllowedPerGame * 0.4).toFixed(0)} run yds allowed/gm. Pass protection also holds up.`
                               : `${away.name} front four controls line of scrimmage — ${as_.sacks} sacks/gm creates havoc for ${home.name}'s run blocking scheme.`
      },
      {
        icon: "🎯", label: "QUARTERBACK BATTLE",
        score: hs.passingYardsPerGame * 0.3 + (home.offensiveRating - away.defensiveRating) * 0.5,
        home_lbl: `${home.abbreviation} QB / Passing Game`,
        away_lbl: `${away.abbreviation} Coverage`,
        gen: (w, s) => s > 0 ? `${home.name} QB has the edge — ${hs.passingYardsPerGame} pass yds/gm. ${home.coachName}'s system creates rhythm through short-to-intermediate routes.`
                               : `${away.name} secondary rated stronger — ${as_.passingYardsPerGame} pass yds/gm and their coverage packages limit downfield shots.`
      },
      {
        icon: "🛡️", label: "RUN DEFENSE",
        score: (as_.rushingYardsPerGame - hs.yardsAllowedPerGame * 0.4) * -0.3 + (home.defensiveRating - away.offensiveRating) * 0.45,
        home_lbl: `${home.abbreviation} Run Defense`,
        away_lbl: `${away.abbreviation} Ground Game`,
        gen: (w, s) => s > 0 ? `${home.name} stuffs the run — holds opponents to ${(hs.yardsAllowedPerGame * 0.4).toFixed(0)} rush yds/gm. Forces ${away.name} into passing downs.`
                               : `${away.name} run game is too physical — ${as_.rushingYardsPerGame} rush yds/gm will wear down ${home.name}'s defense over 60 minutes.`
      },
      {
        icon: "🔒", label: "SECONDARY vs RECEIVERS",
        score: (as_.passingYardsPerGame - hs.yardsAllowedPerGame * 0.58) * -0.28 + (home.defensiveRating - away.offensiveRating) * 0.35,
        home_lbl: `${home.abbreviation} Secondary`,
        away_lbl: `${away.abbreviation} Receivers / TE`,
        gen: (w, s) => s > 0 ? `${home.name} secondary holds the edge — limits opponents to ${(hs.yardsAllowedPerGame * 0.58).toFixed(0)} pass yds/gm. Wins man coverage battles.`
                               : `${away.name} receivers present mismatches — ${as_.passingYardsPerGame} pass yds/gm. Size or speed advantage to win outside.`
      },
      {
        icon: "⭐", label: "OVERALL TALENT EDGE",
        score: home.rating - away.rating,
        home_lbl: `${home.abbreviation} Roster Depth`,
        away_lbl: `${away.abbreviation} Roster Depth`,
        gen: (w, s) => Math.abs(s) >= 10 ? `${w.name} holds a significant talent advantage — ${Math.abs(s.toFixed(0))}-point composite rating gap. Depth wins in the 4th quarter.`
                                          : `Essentially even roster talent. Coaching, scheme, and game-plan execution determine the outcome here.`
      }
    ];
    return `
      <div class="card card-p mb-5">
        <div class="section-label">Position Group Matchup Analysis</div>
        <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px">
          ${matchups.map(m => {
            const winner = m.score >= 0 ? home : away;
            const wc = m.score >= 0 ? home.color : away.color;
            const grade = letter(m.score);
            const gc = lcolor(m.score);
            return `
              <div class="matchup-grade-card" style="border-color:${wc}30;background:${wc}06">
                <div style="display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:8px">
                  <div>
                    <div style="font-size:1rem;margin-bottom:3px">${m.icon}</div>
                    <div style="font-size:.62rem;font-weight:900;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted-l)">${m.label}</div>
                  </div>
                  <div style="text-align:center;flex-shrink:0;margin-left:8px">
                    <div style="font-size:1.6rem;font-weight:900;color:${gc};line-height:1">${grade}</div>
                    <div style="font-size:.55rem;color:var(--muted)">EDGE</div>
                  </div>
                </div>
                <div style="display:flex;align-items:center;gap:5px;margin-bottom:8px">
                  <div style="width:16px;height:16px;border-radius:50%;background:${wc};display:flex;align-items:center;justify-content:center;font-size:.5rem;font-weight:700;color:#fff;flex-shrink:0">${winner.abbreviation.slice(0,2)}</div>
                  <span style="font-size:.78rem;font-weight:700;color:${wc}">${winner.name} EDGE</span>
                </div>
                <div style="font-size:.75rem;color:var(--text-soft);line-height:1.55">${m.gen(winner, m.score)}</div>
              </div>`;
          }).join("")}
        </div>
      </div>`;
  }

  /* 3e — Social Intelligence Hub */
  function renderSocialHub() {
    const si = game.socialIntel || {};
    const lm = si.lineMovement || [];
    const pb = si.publicBetting || {};
    const bw = si.beatWriter || [];
    const xf = game.xFactors || [];
    const smSig = pred.sharpMoneySignal || {};
    const injuredPl = allPlayers.filter(p => p.injuryStatus && p.injuryStatus !== "healthy");
    const flaggedPl = allPlayers.filter(p => p.personalFlags && p.personalFlags.distractionLevel >= 5);
    const practiceNotes = allPlayers.filter(p => p.personalFlags && p.personalFlags.distractionNote);

    return `
      <div class="card card-p mb-5" id="section-social">
        <div class="section-label">Social Intelligence Hub</div>

        <!-- Beat Writer Reports -->
        <div style="margin-bottom:22px">
          <div style="font-size:.6rem;font-weight:900;letter-spacing:2px;text-transform:uppercase;color:var(--muted-l);margin-bottom:10px;display:flex;align-items:center;gap:6px"><span style="width:20px;height:1px;background:var(--border);display:inline-block"></span>BEAT WRITER REPORTS<span style="flex:1;height:1px;background:var(--border);display:inline-block"></span></div>
          <div style="display:grid;gap:10px">
            ${bw.length ? bw.map(r => {
              const team = r.team === game.homeTeamId ? home : away;
              const sc = r.sentiment === "positive" ? "var(--primary)" : r.sentiment === "negative" ? "var(--danger)" : "var(--gold)";
              return `
                <div class="beat-writer-card">
                  <div class="beat-writer-flag" style="color:${readableOnDark(team.color)}">✎ ${team.name.split(" ").pop()}</div>
                  <div style="display:flex;align-items:center;gap:6px;margin-bottom:7px;flex-wrap:wrap;margin-top:4px">
                    <span style="font-size:.8rem;font-weight:700;color:var(--text)">${r.reporter}</span>
                    <span style="font-size:.7rem;color:var(--muted)">· ${r.outlet}</span>
                    <span style="margin-left:auto;font-size:.65rem;color:var(--muted)">${r.daysAgo}d ago</span>
                  </div>
                  <div style="font-size:.82rem;color:var(--text-soft);line-height:1.65">${r.report}</div>
                  <div style="margin-top:8px;font-size:.65rem;font-weight:700;color:${sc};text-transform:uppercase">${r.sentiment === "positive" ? "↑ POSITIVE" : r.sentiment === "negative" ? "↓ NEGATIVE" : "→ NEUTRAL"} for ${team.name}</div>
                </div>`;
            }).join("") : xf.slice(0,3).map(x => {
              const iH = x.impactTeam === game.homeTeamId || x.impactTeam === "home";
              const team = iH ? home : away;
              const sc = x.impactDirection === "positive" ? "var(--primary)" : x.impactDirection === "negative" ? "var(--danger)" : "var(--gold)";
              return `
                <div class="beat-writer-card">
                  <div class="beat-writer-flag" style="color:${readableOnDark(team.color)}">${catIcon(x.category)} ${(x.category||"").toUpperCase()}</div>
                  <div style="display:flex;align-items:center;gap:6px;margin-bottom:7px;margin-top:4px">
                    <span style="font-size:.8rem;font-weight:700;color:var(--text)">${x.title}</span>
                    <span style="margin-left:auto;font-size:.62rem;padding:1px 5px;border-radius:4px;background:var(--surface);color:var(--muted)">Severity ${x.severity||"?"}/10</span>
                  </div>
                  <div style="font-size:.82rem;color:var(--text-soft);line-height:1.65">${x.description}</div>
                  <div style="margin-top:8px;font-size:.65rem;font-weight:700;color:${sc};text-transform:uppercase">${x.impactDirection === "positive" ? "↑ POSITIVE" : x.impactDirection === "negative" ? "↓ NEGATIVE" : "→ NEUTRAL"} — ${team.name}</div>
                </div>`;
            }).join("")}
          </div>
        </div>

        <!-- Social Buzz -->
        <div style="margin-bottom:22px">
          <div style="font-size:.6rem;font-weight:900;letter-spacing:2px;text-transform:uppercase;color:var(--muted-l);margin-bottom:10px;display:flex;align-items:center;gap:6px"><span style="width:20px;height:1px;background:var(--border);display:inline-block"></span>SOCIAL BUZZ MONITOR<span style="flex:1;height:1px;background:var(--border);display:inline-block"></span></div>
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px">
            ${[{ t: away, score: buzz.awayTeamBuzz||0, sent: buzz.sentimentAway||"0.50" },{ t: home, score: buzz.homeTeamBuzz||0, sent: buzz.sentimentHome||"0.50" }].map(({ t, score, sent }) => {
              const sentV = parseFloat(sent);
              const sentLabel = sentV >= 0.55 ? "Positive" : sentV <= 0.35 ? "Negative" : "Mixed";
              const sentC = sentV >= 0.55 ? "var(--primary)" : sentV <= 0.35 ? "var(--danger)" : "var(--gold)";
              return `
                <div style="padding:12px;border-radius:var(--radius);border:1px solid ${t.color}30;background:${t.color}08;text-align:center">
                  <div style="display:flex;align-items:center;justify-content:center;gap:5px;margin-bottom:8px">
                    <div class="team-logo" style="background:${t.color};width:18px;height:18px;font-size:.5rem;color:${textForBg(t.color)}">${t.abbreviation.slice(0,2)}</div>
                    <span style="font-size:.78rem;font-weight:700;color:var(--text)">${t.name}</span>
                  </div>
                  <div style="font-size:1.8rem;font-weight:900;color:${readableOnDark(t.color)};line-height:1">${score}</div>
                  <div style="font-size:.62rem;color:var(--muted);margin-bottom:8px">/100 Buzz Score</div>
                  <div style="height:5px;background:var(--border);border-radius:3px;overflow:hidden;margin-bottom:6px"><div style="width:${score}%;height:100%;background:${t.color}"></div></div>
                  <div style="font-size:.65rem">Sentiment: <strong style="color:${sentC}">${sentLabel}</strong></div>
                </div>`;
            }).join("")}
          </div>
          ${(buzz.trendingTopics||[]).length ? `<div style="display:flex;flex-wrap:wrap;gap:6px">${(buzz.trendingTopics||[]).map(t=>`<span style="font-size:.7rem;padding:3px 9px;border-radius:10px;background:var(--surface);border:1px solid var(--border);color:var(--muted-l)">${t}</span>`).join("")}</div>` : ""}
        </div>

        <!-- Key Player Status Report -->
        <div style="margin-bottom:22px">
          <div style="font-size:.6rem;font-weight:900;letter-spacing:2px;text-transform:uppercase;color:var(--muted-l);margin-bottom:10px;display:flex;align-items:center;gap:6px"><span style="width:20px;height:1px;background:var(--border);display:inline-block"></span>KEY PLAYER STATUS<span style="flex:1;height:1px;background:var(--border);display:inline-block"></span></div>
          ${(function() {
            const keyPl = selectKeyPlayers(allPlayers, 10);
            if (!keyPl.length) return '<div class="text-xs text-muted">No player data for this matchup</div>';
            return '<div style="display:grid;gap:6px">' + keyPl.map(p => {
              const t = p.teamId === home.id ? home : away;
              const s = (p.injuryStatus || "healthy").toLowerCase();
              const isHealthy = s === "healthy";
              const sc = isHealthy ? "var(--primary)" : s === "out" ? "var(--danger)" : s === "doubtful" ? "#f87171" : "var(--gold)";
              const borderC = isHealthy ? "var(--border)" : sc + "40";
              const pc = (p.practiceStatus || "full") === "full" ? "var(--primary)" : (p.practiceStatus || "").includes("limit") ? "var(--gold)" : "var(--danger)";
              const why = whyNotActive(p);
              return `
                <div style="display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:8px;background:var(--surface);border:1px solid ${borderC}">
                  <div style="width:22px;height:22px;border-radius:50%;background:${t.color};display:flex;align-items:center;justify-content:center;font-size:.54rem;font-weight:700;color:${textForBg(t.color)};flex-shrink:0">${t.abbreviation.slice(0,2)}</div>
                  <div style="flex:1">
                    <div style="display:flex;align-items:center;gap:5px;flex-wrap:wrap">
                      <span style="font-size:.8rem;font-weight:700;color:var(--text)">${p.name}</span>
                      <span style="font-size:.65rem;color:var(--muted)">${p.position} · ${p.year||""}</span>
                      ${p.nflDraftStatus ? '<span style="font-size:.58rem;color:var(--gold)">🏆</span>' : ""}
                    </div>
                    ${!isHealthy && why ? '<div style="font-size:.7rem;color:'+sc+';font-weight:600;margin-top:1px">'+why+'</div>' : ""}
                  </div>
                  <div style="text-align:right;flex-shrink:0">
                    <div style="font-size:.65rem;font-weight:800;text-transform:uppercase;color:${sc}">${isHealthy ? "ACTIVE" : s.toUpperCase()}</div>
                    ${p.practiceStatus && !isHealthy ? '<div style="font-size:.6rem;color:'+pc+';font-weight:600">'+p.practiceStatus.toUpperCase()+'</div>' : ""}
                  </div>
                </div>`;
            }).join("") + '</div>';
          })()}
        </div>

        <!-- Player Insider Intel -->
        ${practiceNotes.length ? `
        <div style="margin-bottom:22px">
          <div style="font-size:.6rem;font-weight:900;letter-spacing:2px;text-transform:uppercase;color:var(--muted-l);margin-bottom:10px;display:flex;align-items:center;gap:6px"><span style="width:20px;height:1px;background:var(--border);display:inline-block"></span>PLAYER INTELLIGENCE FEEDS<span style="flex:1;height:1px;background:var(--border);display:inline-block"></span></div>
          <div style="display:grid;gap:8px">
            ${practiceNotes.map((p, fi) => {
              const t = p.teamId === home.id ? home : away;
              const dl = p.personalFlags.distractionLevel || 0;
              const feedId = `pif-${fi}`;
              return `
                <div style="padding:10px 12px;border-left:3px solid ${t.color};background:var(--surface);border-radius:0 8px 8px 0;cursor:pointer" onclick="(function(el){var d=el.querySelector('.pif-body');var c=el.querySelector('.pif-chev');if(!d)return;var open=d.style.display!=='none';d.style.display=open?'none':'block';if(c)c.textContent=open?'▸':'▾';})(this)">
                  <div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap">
                    <span style="font-size:.8rem;font-weight:700;color:var(--text)">${p.name}</span>
                    <span style="font-size:.65rem;color:var(--muted)">${p.position} · ${t.abbreviation}</span>
                    ${dl >= 6 ? `<span style="margin-left:auto;font-size:.62rem;padding:1px 5px;border-radius:4px;background:rgba(239,68,68,.1);color:#f87171;font-weight:700">⚠ FOCUS RISK ${dl}/10</span>` : `<span style="margin-left:auto;font-size:.6rem;color:var(--muted)">INTEL</span>`}
                    <span class="pif-chev" style="font-size:.72rem;color:var(--muted)">▸</span>
                  </div>
                  <div class="pif-body" style="display:none;margin-top:8px">
                    <div style="font-size:.8rem;color:var(--text-soft);font-style:italic;line-height:1.55">"${p.personalFlags.distractionNote}"</div>
                    ${p.personalFlags.socialMediaPattern ? `<div style="font-size:.7rem;color:var(--muted-l);margin-top:4px">Social: ${p.personalFlags.socialMediaPattern}</div>` : ""}
                  </div>
                </div>`;
            }).join("")}
          </div>
        </div>` : ""}

        <!-- Line Movement -->
        ${lm.length ? `
        <div style="margin-bottom:22px">
          <div style="font-size:.6rem;font-weight:900;letter-spacing:2px;text-transform:uppercase;color:var(--muted-l);margin-bottom:10px;display:flex;align-items:center;gap:6px"><span style="width:20px;height:1px;background:var(--border);display:inline-block"></span>LINE MOVEMENT TRACKER<span style="flex:1;height:1px;background:var(--border);display:inline-block"></span></div>
          <div style="position:relative;padding-left:18px">
            ${lm.map((step, i) => {
              const isLast = i === lm.length - 1;
              const spreadDir = i > 0 && step.spread !== lm[i-1].spread;
              const spreadUp = spreadDir && step.spread < lm[i-1].spread;
              return `
                <div class="line-step">
                  <div style="position:relative">
                    <div class="line-step-dot" style="background:${isLast ? "var(--primary)" : "var(--border-l)"}"></div>

                  <div style="flex:1;padding-bottom:4px">
                    <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:3px">
                      <span style="font-size:.7rem;font-weight:700;color:var(--text)">${step.time}</span>
                      <span style="font-size:.78rem;font-weight:900;color:${isLast ? "var(--primary)" : "var(--text-soft)"}">${fmtSpread(step.spread)}</span>
                      <span style="font-size:.72rem;color:var(--muted)">O/U ${step.total}</span>
                      ${spreadDir ? `<span style="font-size:.65rem;font-weight:700;color:${spreadUp ? "var(--danger)" : "var(--primary)"}">${spreadUp ? "↑ AWAY" : "↓ HOME"} MONEY</span>` : ""}
                    </div>
                    <div style="font-size:.75rem;color:var(--muted-l);line-height:1.45">${step.note}</div>
                  </div>
                </div>`;
            }).join("")}
          </div>
        </div>` : ""}

        <!-- Public vs Sharp Betting Split -->
        ${(pb.homePct || smSig.publicBettingPct) ? `
        <div>
          <div style="font-size:.6rem;font-weight:900;letter-spacing:2px;text-transform:uppercase;color:var(--muted-l);margin-bottom:10px;display:flex;align-items:center;gap:6px"><span style="width:20px;height:1px;background:var(--border);display:inline-block"></span>PUBLIC vs SHARP SPLIT<span style="flex:1;height:1px;background:var(--border);display:inline-block"></span></div>
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
            <div style="padding:12px;border-radius:var(--radius);background:var(--surface);border:1px solid var(--border)">
              <div style="font-size:.65rem;color:var(--muted);margin-bottom:6px;font-weight:700">SPREAD BETS</div>
              ${(() => { const hp = pb.homePct || smSig.publicBettingPct || 50; const ap = 100 - hp; return `
                <div style="display:flex;height:20px;border-radius:5px;overflow:hidden;margin-bottom:6px">
                  <div style="width:${hp}%;background:${home.color}cc;display:flex;align-items:center;justify-content:center;font-size:.62rem;font-weight:700;color:#fff">${hp}%</div>
                  <div style="flex:1;background:${away.color}cc;display:flex;align-items:center;justify-content:center;font-size:.62rem;font-weight:700;color:#fff">${ap}%</div>
                </div>
                <div style="display:flex;justify-content:space-between;font-size:.65rem;color:var(--muted)"><span>${home.abbreviation}</span><span>${away.abbreviation}</span>`; })()}
              </div>
            </div>
            <div style="padding:12px;border-radius:var(--radius);background:var(--surface);border:1px solid var(--border)">
              <div style="font-size:.65rem;color:var(--muted);margin-bottom:6px;font-weight:700">TOTAL BETS</div>
              ${(() => { const op = pb.overPct || 52; const up = 100 - op; return `
                <div style="display:flex;height:20px;border-radius:5px;overflow:hidden;margin-bottom:6px">
                  <div style="width:${op}%;background:var(--primary)cc;display:flex;align-items:center;justify-content:center;font-size:.62rem;font-weight:700;color:#fff">${op}%</div>
                  <div style="flex:1;background:var(--danger)cc;display:flex;align-items:center;justify-content:center;font-size:.62rem;font-weight:700;color:#fff">${up}%</div>
                </div>
                <div style="display:flex;justify-content:space-between;font-size:.65rem;color:var(--muted)"><span>OVER</span><span>UNDER</span>`; })()}
              </div>
            </div>
          </div>
          ${smSig && smSig.side ? `
            <div style="margin-top:10px;padding:10px 12px;border-radius:var(--radius);background:rgba(16,185,129,.06);border:1px solid rgba(16,185,129,.2)">
              <div style="font-size:.65rem;font-weight:700;color:var(--primary);margin-bottom:3px">SHARP MONEY INDICATOR</div>
              <div style="font-size:.8rem;color:var(--text-soft)">Professionals are on <strong style="color:${smSig.side === "home" ? home.color : away.color}">${smSig.side === "home" ? home.name : away.name}</strong>${smSig.note ? " — " + smSig.note : "."}</div>
            </div>` : ""}
        </div>` : ""}
      </div>`;
  }

  /* 4 — X-Factor Alerts Panel */
  function renderXFactors() {
    const xf = safe(() => pred.xFactors, null) || safe(() => game.xFactors, null);
    if (!xf || !xf.length) return "";
    return `
      <div class="card card-p mb-5" id="section-xfactors">
        <div class="section-label">X-Factor Alerts</div>
        <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px">
          ${xf.map(x => `
            <div class="card ${severityClass(x.severity)}" style="padding:14px">
              <div class="flex items-center gap-2 mb-2">
                <span style="font-size:1.2rem">${catIcon(x.category)}</span>
                <span style="font-size:.7rem;font-weight:800;letter-spacing:1px;text-transform:uppercase;color:${severityColor(x.severity)}">${(x.severity || "").toUpperCase()}</span>
                ${x.impactTeam ? `<span style="margin-left:auto;font-size:.65rem;padding:2px 7px;border-radius:10px;background:rgba(255,255,255,.07);color:var(--muted-l)">${x.impactTeam === game.homeTeamId || x.impactTeam === "home" ? home.abbreviation : x.impactTeam === game.awayTeamId || x.impactTeam === "away" ? away.abbreviation : "BOTH"}</span>` : ""}
              </div>
              <div style="font-size:.875rem;font-weight:700;color:var(--text);margin-bottom:5px">${x.title || ""}</div>
              <div style="font-size:.78rem;color:var(--muted-l);line-height:1.5">${x.description || ""}</div>
              ${x.impactDirection ? `<div style="margin-top:8px;font-size:.7rem;font-weight:700;color:${x.impactDirection === "positive" ? "var(--primary)" : x.impactDirection === "negative" ? "var(--danger)" : "var(--muted)"}">${fIcon(x.impactDirection)} ${x.impactDirection.toUpperCase()} IMPACT</div>` : ""}
            </div>`).join("")}
        </div>
      </div>`;
  }

  /* 5 — Model Grade + Composite Prediction */
  function renderModelGrade() {
    const grade = pred.modelGrade || "B";
    const comp  = pred.compositeScore || { home: Math.round(homeScore), away: Math.round(awayScore) };
    const edge  = pred.overallEdge || null;
    return `
      <div class="card card-p mb-5">
        <div class="flex items-center gap-4 mb-5">
          <div class="model-grade ${gradeClass(grade)}">${grade}</div>
          <div style="flex:1">
            <div class="text-xs text-muted mb-1" style="letter-spacing:1.5px;text-transform:uppercase">Model Grade</div>
            <div style="font-size:1.4rem;font-weight:900;color:var(--text)">${grade === "A+" ? "Exceptional Confidence" : grade === "A" ? "High Confidence" : grade === "B" ? "Solid Confidence" : grade === "C" ? "Moderate Confidence" : "Low Confidence"}</div>
            <div class="text-xs text-muted mt-1">Based on data richness, signal alignment & market clarity</div>
          </div>
          <span class="badge ${confCls}">${confLbl}</span>
        </div>
        <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:16px">
          <div class="comp-score-box" style="border:2px solid ${home.color}40;background:${home.color}10">
            <div class="text-xs text-muted mb-1">Home Score</div>
            <div style="font-size:2rem;font-weight:900;color:${readableOnDark(home.color)}">${comp.home !== undefined ? comp.home : Math.round(homeScore)}</div>
            <div class="text-xs text-muted">${home.abbreviation}</div>
          </div>
          <div class="comp-score-box" style="border:2px solid var(--border);background:var(--surface);display:flex;flex-direction:column;align-items:center;justify-content:center">
            <div style="font-size:.65rem;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--muted);margin-bottom:4px">Final</div>
            <div style="font-size:1rem;font-weight:800;color:var(--text)">Projected</div>
            <div class="text-xs text-muted mt-1">Model Total: ${pred.predictedTotal ? pred.predictedTotal.toFixed(1) : "—"}</div>
          </div>
          <div class="comp-score-box" style="border:2px solid ${away.color}40;background:${away.color}10">
            <div class="text-xs text-muted mb-1">Away Score</div>
            <div style="font-size:2rem;font-weight:900;color:${readableOnDark(away.color)}">${comp.away !== undefined ? comp.away : Math.round(awayScore)}</div>
            <div class="text-xs text-muted">${away.abbreviation}</div>
          </div>
        </div>
        <!-- Win probability -->
        <div>
          <div class="flex justify-between text-xs text-muted mb-1">
            <span>${away.name} (${awayPct}%)</span>
            <span>${home.name} (${homePct}%)</span>
          </div>
          <div class="win-prob-bar">
            <div style="width:${awayPct}%;background:${away.color}"></div>
            <div style="width:${homePct}%;background:${home.color}"></div>
          </div>
        </div>
        ${edge ? `
        <div style="margin-top:14px;padding:12px;border-radius:var(--radius);background:var(--surface);border:1px solid var(--border)">
          <div class="text-xs text-muted mb-2" style="letter-spacing:1px;text-transform:uppercase">Overall Model Edge</div>
          <div class="flex items-center gap-3">
            <div style="font-size:1.2rem;font-weight:900;color:${edge.side === "home" ? home.color : edge.side === "away" ? away.color : "var(--gold)"}">
              ${edge.side === "home" ? home.name : edge.side === "away" ? away.name : "Pick'em"} ${edge.pts ? `+${edge.pts} pts` : ""}
            </div>
            ${edge.breakdown ? `<div class="text-xs text-muted">${edge.breakdown}</div>` : ""}
          </div>
        </div>` : ""}
      </div>`;
  }

  /* 5b — Win Probability Circular Gauge */
  function renderWinGauge() {
    const r = 52; // radius
    const cx = 64; const cy = 64;
    const circ = 2 * Math.PI * r;
    const homeDash = (homePct / 100) * circ;
    const awayDash = circ - homeDash;

    // Arc starts from top (−90°): rotate by −90deg
    const homeOffset = 0;
    const awayOffset = -homeDash;

    const winnerName = isHomeFavored ? home.name : away.name;
    const winnerPctDisp = isHomeFavored ? homePct : awayPct;
    const winnerColor = isHomeFavored ? home.color : away.color;
    const loserColor  = isHomeFavored ? away.color : home.color;

    return `
      <div class="win-gauge-wrap">
        <div style="font-size:.6rem;font-weight:800;letter-spacing:2px;text-transform:uppercase;color:var(--muted-l);margin-bottom:4px">Win Probability</div>
        <svg class="win-gauge-svg" width="128" height="128" viewBox="0 0 128 128">
          <!-- Background ring -->
          <circle class="win-gauge-bg" cx="${cx}" cy="${cy}" r="${r}"
            stroke="${loserColor}" stroke-width="12" opacity="0.25"/>
          <!-- Full away arc (behind) -->
          <circle class="win-gauge-arc" cx="${cx}" cy="${cy}" r="${r}"
            stroke="${loserColor}" stroke-width="10"
            stroke-dasharray="${circ}" stroke-dashoffset="0"
            transform="rotate(-90 ${cx} ${cy})" opacity="0.5"/>
          <!-- Home arc on top -->
          <circle class="win-gauge-arc" cx="${cx}" cy="${cy}" r="${r}"
            stroke="${winnerColor}" stroke-width="10"
            stroke-dasharray="${homeDash} ${awayDash}"
            transform="rotate(-90 ${cx} ${cy})"/>
          <!-- Center text -->
          <text x="${cx}" y="${cy - 6}" class="win-gauge-center"
            font-size="20" font-weight="900" fill="${winnerColor}">${winnerPctDisp}%</text>
          <text x="${cx}" y="${cy + 13}" class="win-gauge-center"
            font-size="7.5" font-weight="700" fill="var(--muted-l)" letter-spacing="0.5">WIN PROB</text>
        </svg>
        <div style="font-size:.78rem;font-weight:800;color:${winnerColor}">${winnerName}</div>
        <div style="font-size:.62rem;color:var(--muted)">${home.abbreviation} ${homePct}% · ${away.abbreviation} ${awayPct}%</div>
      </div>`;
  }

  /* 6 — Picks + Predicted Score */
  function renderPicks() {
    const homePia  = safe(() => pred.playerImpactAdj.home, 0);
    const awayPia  = safe(() => pred.playerImpactAdj.away, 0);
    const homeSit  = safe(() => pred.situationalAdj.home, 0);
    const awaySit  = safe(() => pred.situationalAdj.away, 0);
    const homeWx   = safe(() => pred.weatherImpact.homeAdj, 0);
    const awayWx   = safe(() => pred.weatherImpact.awayAdj, 0);
    const homeProg = safe(() => pred.programMomentumAdj.home, 0);
    const awayProg = safe(() => pred.programMomentumAdj.away, 0);
    const coachEdge = pred.coachingEdge || null;

    const adjRows = [
      { label: "Player Impact Adj", h: homePia, a: awayPia },
      { label: "Situational Adj",   h: homeSit, a: awaySit },
      { label: "Weather Adj",       h: homeWx,  a: awayWx },
      { label: "Program Momentum",  h: homeProg,a: awayProg },
    ].filter(r => r.h !== 0 || r.a !== 0);

    const sharePick = () => {
      const gp = game.gamePreview;
      const pickTeam = gp && gp.thePick && gp.thePick.team ? gp.thePick.team : winner.name;
      const pickLine = gp && gp.thePick && gp.thePick.line ? " " + gp.thePick.line : (pred.predictedSpread ? " " + fmtSpread(-pred.predictedSpread) : "");
      const pickConf = gp && gp.thePick && gp.thePick.confidence ? gp.thePick.confidence : (pred.confidence || "medium").toUpperCase();
      const text = "The Bet: " + pickTeam + pickLine + " — " + pickConf + " confidence. Analysis: " + window.location.href;
      navigator.clipboard.writeText(text).then(() => {
        const btn = document.getElementById("share-pick-btn");
        if (btn) {
          btn.textContent = "Copied!";
          btn.classList.add("copied");
          setTimeout(() => { btn.innerHTML = "&#128228; Share Pick"; btn.classList.remove("copied"); }, 2000);
        }
      }).catch(() => {});
    };
    window.__sharePick = sharePick;

    return `
      <div class="card card-p mb-5" id="section-picks">
        <div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;margin-bottom:16px">
          <div class="section-label" style="margin-bottom:0">Picks &amp; Predicted Score</div>
          <button id="share-pick-btn" class="share-pick-btn" onclick="window.__sharePick()">&#128228; Share Pick</button>
        </div>
        ${safe(renderWinGauge, "")}
        <div class="grid-3 mb-4">
          <!-- ATS -->
          <div style="border-radius:12px;padding:16px;text-align:center;border:2px solid ${pred.spreadPick && pred.spreadPick.side !== "no-bet" ? pred.spreadPick.side === "home" ? "rgba(99,102,241,.5)" : "rgba(245,158,11,.5)" : "var(--border)"};background:${pred.spreadPick && pred.spreadPick.side !== "no-bet" ? pred.spreadPick.side === "home" ? "rgba(99,102,241,.1)" : "rgba(245,158,11,.1)" : "var(--surface)"}">
            <div class="text-xs text-muted mb-2" style="text-transform:uppercase;letter-spacing:.5px">ATS Pick</div>
            ${pred.spreadPick && pred.spreadPick.side !== "no-bet"
              ? `<div style="font-size:.95rem;font-weight:800;color:${pred.spreadPick.side === "home" ? "var(--accent)" : "var(--gold)"}">${pred.spreadPick.team}</div>
                 ${game.bettingLines ? `<div class="text-xs text-muted mt-1">${fmtSpread(pred.spreadPick.side === "home" ? game.bettingLines.spread : -game.bettingLines.spread)}</div>` : ""}
                 <div class="text-xs text-muted mt-1">Edge +${pred.spreadPick.edge} pts</div>`
              : `<div style="font-size:.95rem;font-weight:700;color:var(--muted)">No Bet</div><div class="text-xs text-muted mt-1">No significant edge</div>`}
          </div>
          <!-- Total -->
          <div style="border-radius:12px;padding:16px;text-align:center;border:2px solid ${pred.totalPick && pred.totalPick.side !== "no-bet" ? pred.totalPick.side === "over" ? "rgba(16,185,129,.5)" : "rgba(239,68,68,.5)" : "var(--border)"};background:${pred.totalPick && pred.totalPick.side !== "no-bet" ? pred.totalPick.side === "over" ? "rgba(16,185,129,.1)" : "rgba(239,68,68,.1)" : "var(--surface)"}">
            <div class="text-xs text-muted mb-2" style="text-transform:uppercase;letter-spacing:.5px">Total Pick</div>
            ${pred.totalPick && pred.totalPick.side !== "no-bet"
              ? `<div style="font-size:1.6rem;font-weight:900;color:${pred.totalPick.side === "over" ? "var(--primary)" : "var(--danger)"}">${pred.totalPick.side.toUpperCase()}</div>
                 ${game.bettingLines ? `<div class="text-xs text-muted">O/U ${game.bettingLines.total}</div>` : ""}
                 <div class="text-xs text-muted">Model: ${pred.predictedTotal ? pred.predictedTotal.toFixed(1) : "—"}</div>`
              : `<div style="font-size:.95rem;font-weight:700;color:var(--muted)">No Bet</div><div class="text-xs text-muted mt-1">No significant edge</div>`}
          </div>
          <!-- Score -->
          <div style="border-radius:12px;padding:16px;text-align:center;border:2px solid var(--border);background:var(--surface)">
            <div class="text-xs text-muted mb-2" style="text-transform:uppercase;letter-spacing:.5px">Predicted Score</div>
            <div style="font-size:1.3rem;font-weight:900;color:var(--text)">${Math.round(homeScore)}&ndash;${Math.round(awayScore)}</div>
            <div class="text-xs text-muted mt-1">${home.abbreviation} vs ${away.abbreviation}</div>
            <div class="text-xs text-muted">Total: ${pred.predictedTotal ? pred.predictedTotal.toFixed(1) : "—"}</div>
          </div>
        </div>
        ${adjRows.length || coachEdge ? `
